# Myelin's pipeline runs in the pinned offline runner image from runner-assets.toml.
#
# Jobs use platform-owned structured Cargo recipes. The resolver and sandbox
# share one allowlist, so a recipe accepted into the plan is also executable at
# the offline vendored-Cargo boundary.
schema_version = 2
on = "push"

[execution]
profile = "linux-build-v1"

[[jobs]]
name = "build"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["build", "--locked"] }

[[jobs]]
name = "test"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "--workspace", "--all-targets"] }
needs = ["build"]

[[jobs]]
name = "clippy"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"] }
needs = ["build"]

[[jobs]]
name = "architecture"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "-p", "myelin-lints"] }
needs = ["build"]
