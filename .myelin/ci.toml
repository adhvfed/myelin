# Founder-dogfood pipeline — CT-007 gate-4 cutover. A real 3-job build/test/clippy DAG on
# Myelin's OWN workspace, executed offline in gVisor by the dogfood runner. This is the pipeline
# that replaces GitHub Actions: `build` compiles the whole workspace from the pinned full-workspace
# Cargo vendor (`--locked`, --network=none), then `test` (unit `--lib`) and `clippy`
# (`--all-targets -D warnings`) fan out from it. The image is the canonical-tree SHA-256 of the
# staged linux-rust-v1 (Rust-capable) rootfs pinned in runner-assets.toml.
schema_version = 2
on = "push"

[execution]
profile = "linux-build-v1"

[[jobs]]
name = "build"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["build", "--locked"] }

[[jobs]]
name = "test"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "--lib"] }
needs = ["build"]

[[jobs]]
name = "clippy"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"] }
needs = ["build"]
