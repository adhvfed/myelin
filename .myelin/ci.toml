# Founder-dogfood pipeline. The single job is intentionally small: it proves the complete
# push -> dispatch -> sandbox -> durable logs -> check projection path without spending a hosted
# build. Its bounded two-minute observation window is long enough to attach the required CLI and
# browser live consumers before the marker is emitted. The image digest is the canonical-tree
# SHA-256 of the staged linux-small-v1 rootfs used by this personal-production cell, including the
# empty precreated /workspace bind target so repeated jobs never mutate the verified tree; P0
# replaces this one-cell binding with the release supply-chain.
schema_version = 2
on = "push"

[execution]
profile = "linux-small-v1"

[[jobs]]
name = "build"
image = "myelin.local/linux-small-v1-rootfs@sha256:65f0f6f242cd4412b4ad56250eadb0a459a59a71b49d21485e68da6a3d5cb975"
command = ["/bin/sh", "-c", "printf '%s\\n' 'myelin-ci-acceptance-window-open'; /bin/sleep 120; printf '%s\\n' 'MYELIN-CI-a005e32fc1bb0c2b64e7d40ac1a01236'"]
