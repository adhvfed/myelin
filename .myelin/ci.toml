# Myelin's own pipeline, run by the self-hosted runner (offline gVisor, rootfs pinned in runner-assets.toml).
schema_version = 2
on = "push"

[execution]
profile = "linux-build-v1"

[[jobs]]
name = "build"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["build", "--locked"] }

[[jobs]]
name = "test"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "--lib"] }
needs = ["build"]

[[jobs]]
name = "clippy"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"] }
needs = ["build"]

# Architecture gates: the twelve lints, erosion + dependency-direction budgets,
# and contract coverage all run as myelin-lints test targets.
[[jobs]]
name = "gates"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "-p", "myelin-lints"] }
needs = ["build"]
