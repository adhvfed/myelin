# Myelin's pipeline runs in the pinned offline runner image from runner-assets.toml.
#
# jobs must use the platform-owned structured cargo recipes (the vendored-cargo
# boundary admits exactly: build --locked / test --locked --lib /
# clippy --locked --all-targets -- -D warnings). integration tests and the
# myelin-lints architecture gate need recipes the boundary does not admit yet -
# extending the structured recipe set is the named follow-on in docs/worklog.md.
schema_version = 2
on = "push"

[execution]
profile = "linux-build-v1"

[[jobs]]
name = "build"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["build", "--locked"] }

[[jobs]]
name = "test"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["test", "--locked", "--lib"] }
needs = ["build"]

[[jobs]]
name = "clippy"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
build = { tool = "cargo", args = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"] }
needs = ["build"]
