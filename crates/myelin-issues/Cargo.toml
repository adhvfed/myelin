[package]
name = "myelin-issues"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-issues is a CONSUMER SUBSYSTEM crate (the most cross-subsystem-coupled of the five —
# architecture issue-tracker 00-overview §1), NOT a node in the eleven-crate library DAG modelled
# by `myelin-substrate::crate_graph` (architecture 00 §2.9). Like the other subsystem/service
# crates (myelin-git, myelin-identity-service, myelin-gdpr-service) it is a LEAF CONSUMER above the
# shared glue crates: it depends on the frozen contract surfaces (identity NamespaceFragment +
# Principal, gdpr PersonalDataHolder + the #[personal_data] classify-derive, tenancy partition keys)
# and NOTHING in the production library DAG depends back on it. `substrate_is_root()` /
# `identity_is_sink()` in crate_graph.rs are preserved (a subsystem crate is the graph's terminal
# consumer, OUTSIDE the modelled DAG).
#
# At ISS-P01 (P-125 / M1) this crate carries ONLY the M1 "freeze-so-dependents-compile" slice
# (issue-tracker roadmap §3.0): the frozen Issues ReBAC namespace fragment (contract 4.9 — the
# `issue` namespace + the `- confidential` set-difference userset + `watcher` + the field/transition
# ABAC sub-objects) Identity compiles into the one cell schema, PLUS the H-Issues holder INTENT +
# the #[personal_data(...)] classification tags on the skeletal issue schema (contract 10.2 — incl.
# the OQ-H worklog/productivity behavioural tags) so the no-untagged-personal-data lint (contract
# 1.6) is GREEN from the first migration (ISS-P05). No Issues FEATURE ships here — the holder is
# OPENED + auto-registered by serve when the store opens in ISS-P07.
[[bin]]
# ISS-P05 (P-371, M4): the Issue Tracker service is a `serve(AppSpec)` shell (contract 1.1) — this
# binary is the "every service main.rs" the row names: it does nothing but hand the Issues AppSpec to
# the harness's one call (NOT a hand-rolled lifecycle). The library carries the shell builder
# (`issues_app_spec` / `run_issues`), the COMPLETE forward-only issue-spine migrations, and the
# auto-registered H3 PersonalDataHolder.
name = "issues"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# ISS-P05 (P-371, M4): the substrate serve(AppSpec) harness (contract 1.1/1.2/1.3): the three-surface
# split, liveness ≠ readiness, the forward-only migration runner + the HotTables declaration, the
# holder auto-registry (contract 1.4). The Issues service is an AppSpec, not a hand-rolled main. A
# leaf-consumer edge onto the substrate (the same edge every service shell carries); nothing in the
# production DAG depends back on myelin-issues. The CREATE-TABLE DDL stays `&str` the runner admits
# DB-free; the live forward-only apply is behind the `integration` feature only.
myelin-substrate = { path = "../myelin-substrate" }
# The frozen Identity contract surface: the names-only `NamespaceFragment` ABI carrier Identity
# admits into the cell schema (contract 4.9) + Principal (the verified subject the holder keys on).
# A consumer LEAF depending on the identity GLUE crate (not the service) keeps the §2.9 DAG acyclic.
myelin-identity = { path = "../myelin-identity" }
# The GDPR contract surface: contract 10.1 PersonalDataHolder + contract 10.2 the #[personal_data]
# classify-derive + the five frozen tag enums. Consumed (the H-Issues INTENT + the schema tags), not
# provided here.
myelin-gdpr = { path = "../myelin-gdpr" }
# The canonical (tenant, region) partition keys threaded through every issue schema row + ArtifactRef.
myelin-tenancy = { path = "../myelin-tenancy" }
# The frozen shared QUERY core (contract 13.3, X-3): the FieldType enum + the ViewSpec view-model +
# the QueryAst grammar + the order_key/LexoRank codec. Issues CO-OWNS this crate with Knowledge
# (ADR-06): it LINKS the frozen definitions directly — *the same bytes* Knowledge uses, never a
# re-implementation (architecture issue-tracker 01-tech-and-data-model §1 + §3). Issues owns its OWN
# AST→store compiler (ISS-P13) ON TOP of these shared shapes; the DEFINITIONS are byte-identical and
# live here, linked. The byte-identity drift-killer (tests/cdc_13_3_issues_coown.rs) replays the
# shared CONFORMANCE_VECTOR + serializes the shared ViewSpec from the Issues side and asserts 0 byte
# differences vs Knowledge's frozen outputs.
myelin-query = { path = "../myelin-query" }
# The frozen Bus event grammar (contract 2.9) + the EventEnvelope unit anchor (contract 2.1). Issues
# REGISTERS its complete `issue.*` taxonomy AGAINST this grammar (ISS-P03 / P-242) — `events.rs`
# below calls the ONE Bus validator (`myelin_events::validate_event_type`); there is no second token
# language and Issues does NOT author the grammar (EI-01 §7). The `initiative` type token is already
# in the Bus seed (recon §2); Issues completes the `issue.*`/`initiative.*` event-name list here.
myelin-events = { path = "../myelin-events" }
# The frozen Search-owned `declare_indexable` surface (contract 6.3): the `IndexSpec` shape Issues
# CONSTRUCTS its `issue.*` facets projection against + the `IncrementalIndexer` admission seam that
# ACCEPTS the registration (the build-time gate). Issues does NOT define a second indexing-contract
# shape — it links the ONE frozen `myelin_search::IndexSpec` (EI-01 §7). The live emitter
# (`issue.*` Search projection rows) lands in ISS-P17; here the DECLARATION is the deliverable.
myelin-search = { path = "../myelin-search" }
# The frozen Notif-owned `define_notif_rule` surface (contract 7.6): the `NotifRule`/`Reason`/`Class`
# shapes + the `NotifRuleRegistry::register` inverse-signal seam. Issues registers its reason set
# (SLA at-risk / unblocked / approval-requested) against the ONE Notif ranking table — never a second
# reason vocabulary (EI-01 §1/§7). The live notif wiring ("My Work" inbox routing) lands in ISS-P22;
# here the DECLARATION is the deliverable.
myelin-notif = { path = "../myelin-notif" }
serde.workspace = true
serde_json.workspace = true

# ------------------------------------------------------------------------------------------
# ISS-P05 (P-371): REAL live-stack schema apply behind the `integration` feature. The complete
# issue-spine data-model migration gets PROVEN against the live dev-stack Postgres (forward-only
# apply + RLS isolation + the FK + the hot-path indexes) in tests/integration_iss_p05_spine_schema.rs.
# The OPTIONAL sqlx + tokio deps are pulled ONLY by `--features integration` — the default
# `cargo build`/`cargo test --workspace` stay DB-free. EXTERNAL crates only; no new myelin edge. The
# test reads DATABASE_URL inline (no myelin-config edge — same posture as ci-controlplane/refs).
# ------------------------------------------------------------------------------------------
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# DEV-ONLY: the rich ReBAC namespace ENGINE (FragmentDef / Userset / StoreBackedCheck) lives in the
# Identity SERVICE crate. The runtime Issues fragment is the names-only `myelin_identity::Namespace-
# Fragment` ABI carrier (above) — a consumer subsystem never depends on a service crate at runtime
# (the §2.9 DAG stays acyclic). The contract-4.9 CDC pair (tests/cdc_4_9_issues_fragment.rs) needs
# the real engine to PROVE the Issues fragment admits + that the `- confidential` set-difference
# userset resolves LEAK-FREE (a confidential issue is absent from view for a non-grantee) — so the
# engine is a dev-dependency (test scaffolding only — no runtime edge). EI-01 §7: prove against the
# frozen engine, never re-define it.
[dev-dependencies]
myelin-identity-service = { path = "../myelin-identity-service" }
myelin-storage = { path = "../myelin-storage" }
# The frozen `ArtifactRef` token (contract 5.1) the Notif `classify`/dedup-render seam keys on — used
# ONLY in the 7.6 declares CDC + unit tests to render an Issues subject's inbox dedup key. Test
# scaffolding (no runtime edge: the declares module is generic over the caller's subject ref).
myelin-refs = { path = "../myelin-refs" }
# ISS-P05 (P-371): the architecture-lint ratchet (contract 1.6) — Issues' own dated red+green
# confirmation that `no-untagged-personal-data` REJECTS an untagged PII Issues field + ADMITS the
# tagged schema, and that `forward-only-migration` / `residency-pin` are GREEN over the issue-spine
# migration source (tests/lint_issue_spine.rs). A test-support crate (NOT a production DAG node).
myelin-lints = { path = "../myelin-lints" }
# Note: `myelin-events` + `serde_json` are now REGULAR dependencies (above) — `events.rs` (ISS-P03)
# registers the `issue.*` taxonomy against the Bus grammar at RUNTIME, and the 13.3 byte-identity CDC
# (tests/cdc_13_3_issues_coown.rs) keeps serializing the co-owned ViewSpec/FieldType to JSON. Both
# resolve through the regular deps; no separate dev entry needed.

[features]
default = []
# ISS-P05 (P-371): the live-stack schema-apply proof (the issue-spine migration against real
# Postgres). ISS-P06 (P-372) ADDS the live-stack emit-iff-committed proof for the write path (the
# issue state row + its issue.* event co-commit in ONE Postgres tx; a rolled-back tx writes 0 of
# each — tests/integration_iss_p06_outbox.rs). Pulls the optional sqlx + tokio external crates only;
# the default build stays DB-free.
integration = ["dep:sqlx", "dep:tokio"]
