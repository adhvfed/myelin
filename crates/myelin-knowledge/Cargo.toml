[package]
name = "myelin-knowledge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "knowledge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
myelin-substrate = { path = "../myelin-substrate" }
myelin-identity = { path = "../myelin-identity" }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-events = { path = "../myelin-events" }
myelin-content = { path = "../myelin-content" }
myelin-query = { path = "../myelin-query" }
myelin-refs = { path = "../myelin-refs" }
myelin-notif = { path = "../myelin-notif" }
myelin-storage = { path = "../myelin-storage" }
myelin-search = { path = "../myelin-search" }
myelin-gdpr = { path = "../myelin-gdpr" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3.workspace = true
yrs = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
myelin-config = { path = "../myelin-config" }

[features]
default = []
test-support = ["myelin-events/test-support"]
integration = [
    "myelin-storage/integration",
]

[dev-dependencies]
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-events = { path = "../myelin-events", features = ["test-support"] }
myelin-knowledge = { path = ".", features = ["test-support"] }
myelin-harness = { path = "../myelin-harness" }
myelin-identity-service = { path = "../myelin-identity-service", features = ["test-support"] }
myelin-agent-service = { path = "../myelin-agent-service" }
myelin-agent = { path = "../myelin-agent" }
