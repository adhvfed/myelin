[package]
name = "myelin-agent-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The HOSTED-AGENT COMPOSITION ROOT (AG-P25 real-run wiring): the ONE leaf crate that composes the
# real vendor brain (`myelin-agent-model::LlmAgentRuntime` over `LunaClient`), the platform-owned
# driving loop (`myelin-agent-service::SkeletonAgent::handle_run`), and the durable prepaid wallet
# (`myelin-storage::AgentWallet`) into a FUNCTIONING, METERED, end-to-end agent run.
#
# WHY A NEW LEAF CRATE (the crate-graph reasoning):
#   - The `no-llm-in-platform` boundary (contract 1.6) forbids `myelin-agent-service` from ever
#     depending on `myelin-agent-model`. The real brain must therefore be constructed at a
#     composition root that depends on BOTH crates and passed into `handle_run` as a `&dyn
#     MeteredRuntime`.
#   - No existing production crate depends on `myelin-agent-service` — it is itself a documented LEAF
#     consumer (like the other service crates), and `myelin-agent-model` is a leaf too (nothing
#     depends on it). There is thus no pre-existing host that could take on the composition.
#   - A NEW leaf crate is acyclic BY CONSTRUCTION: nothing in the workspace depends on it, so no edge
#     can close a cycle. It is OUTSIDE the eleven-crate library DAG modelled by
#     `myelin-substrate::crate_graph` (a terminal consumer, exactly like the service crates), and it
#     confines the `myelin-agent-model` dependency edge to this single home.
[dependencies]
# The two crates the no-llm boundary keeps apart, joined ONLY here:
myelin-agent-model = { path = "../myelin-agent-model" }     # the real brain (LlmAgentRuntime + LunaClient)
myelin-agent-service = { path = "../myelin-agent-service" } # the driving loop (SkeletonAgent::handle_run) + metering
# The frozen agent seam value types the RunSubstrate + the no-tools catalogue/executor reference.
myelin-agent = { path = "../myelin-agent" }
# The durable prepaid wallet (money) + the nominal reserve/settle types the RunSubstrate carries.
myelin-storage = { path = "../myelin-storage" }
# The first REAL governed READ tool's subsystem: the Git check-status projection
# (`PgCheckStatusProjection::rows_for_commit`) — a genuinely tenant-scoped (`with_tenant_tx` RLS +
# region fail-closed) real subsystem read the `Direct`-route `GitCheckStatusReadExecutor` dispatches
# to. The composition root (this leaf crate) is the sanctioned home for a concrete durable executor —
# `myelin-agent-service` stays provider-agnostic (no `SubstrateProvider`/runtime edge in its src).
myelin-git = { path = "../myelin-git" }
# The runtime `Handle` the durable read executor threads into `PgCheckStatusProjection` for its
# sync→async bridge (the same `block_in_place` bridge `AgentWallet` uses for the per-turn debit).
tokio = { workspace = true }
# The durable-workflow seams the RunSubstrate threads (token mint, delegation caveats, journal).
myelin-flow = { path = "../myelin-flow" }
# The transactional outbox + id-minter the trace activity co-commits through.
myelin-events = { path = "../myelin-events" }
# The agent Principal the run acts as.
myelin-identity = { path = "../myelin-identity" }
# The REAL per-run token providers wired behind the mint/revoke seams at this composition root: the
# Identity `RunTokenMinter` (PASETO-signed per-run tokens) + the durable S7 `RevocationStore`
# (the tenant-scoped denylist) + the cell token authority (the signing root). A leaf crate, so this
# edge cannot close a dependency cycle.
myelin-identity-service = { path = "../myelin-identity-service" }
# The (tenant, region) partition types.
myelin-tenancy = { path = "../myelin-tenancy" }
# Parse a tool's JSON-schema STRING into the normalized object carrier the vendor tool spec sends.
serde_json.workspace = true
# Convert the engine's epoch-seconds clock into the canonical RFC-3339 instant the Identity mint's
# `expires_at` arithmetic + the S7 store's instant compare both parse (the mint/teardown time base).
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# The MOCK ModelClient double (hermetic end-to-end, no network) — proves the composition + F1 + the
# per-turn metering wire up green without touching Luna.
myelin-agent-model = { path = "../myelin-agent-model", features = ["test-support"] }
# The in-memory nominal-substrate doubles the drills build: CostLedger::new (storage/test-support) +
# OutboxStore::new (events/test-support). The wallet stays DURABLE — the money-critical piece is real.
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-events = { path = "../myelin-events", features = ["test-support"] }
# The REAL ReBAC decision engine the cap-enforcement gate consults: `StoreBackedCheck::new` (the
# in-memory-tuple test-double constructor) + the real `write_tuples` grant path, so the drills seed a
# genuine `pull` grant and exercise the SAME `IdentityService::check` a human's request flows through.
myelin-identity-service = { path = "../myelin-identity-service", features = ["test-support"] }
# The live Luna drill (gated on OPENAI_API_KEY + live PG :5433, mirroring integration_wallet_metering):
myelin-config = { path = "../myelin-config" }
sqlx = { workspace = true }
tokio = { workspace = true }
