[package]
name = "myelin-agent-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hosted-agent-worker"
path = "src/main.rs"
required-features = ["integration"]

[dependencies]
myelin-agent-model = { path = "../myelin-agent-model" }
myelin-agent-service = { path = "../myelin-agent-service" }
myelin-agent = { path = "../myelin-agent" }
myelin-mcp = { path = "../myelin-mcp" }
myelin-notif = { path = "../myelin-notif" }
myelin-storage = { path = "../myelin-storage" }
myelin-git = { path = "../myelin-git" }
tokio = { workspace = true }
myelin-flow = { path = "../myelin-flow" }
myelin-events = { path = "../myelin-events" }
myelin-identity = { path = "../myelin-identity" }
myelin-identity-service = { path = "../myelin-identity-service" }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-refs = { path = "../myelin-refs" }
myelin-config = { path = "../myelin-config" }
serde_json.workspace = true
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
blake3.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "aws-lc-rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
myelin-agent-model = { path = "../myelin-agent-model", features = ["test-support"] }
myelin-agent-service = { path = "../myelin-agent-service", features = ["integration"] }
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-events = { path = "../myelin-events", features = ["test-support"] }
myelin-identity-service = { path = "../myelin-identity-service", features = ["test-support"] }
sqlx = { workspace = true }
tokio = { workspace = true }

[features]
default = []
integration = ["myelin-agent-service/integration"]
