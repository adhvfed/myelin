[package]
name = "myelin-identity-service"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The service binary the harness runs (the "every service `main.rs`" of contract 1.1). Named
# `identity` (= SERVICE_NAME) so the deployable matches the service/trace identifier.
[[bin]]
name = "identity"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# THE Identity SERVICE crate (P-ID-04 → P-054): the bootable service shell the harness wires
# (boot → migrate → relay → consumers → three ports → graceful drain), NOT a hand-rolled main.
#
# DAG POSITION (a documented, NAMED extension of the §2.9 eleven-crate DAG, like myelin-harness
# and myelin-lints): this is a SERVICE crate — the "every service `main.rs`" consumer the
# contract-index row 1.1 names. It is the FIRST such service. It sits ABOVE myelin-substrate
# (the root-last harness) as a leaf consumer: it depends on the harness (serve/AppSpec) and the
# frozen identity contract surface, and NOTHING in the production DAG depends on it. It is
# therefore OUTSIDE the eleven-crate library DAG modelled by `crate_graph.rs`
# (substrate_is_root() — "no crate depends on substrate" — is preserved: a service main is not
# part of that library graph, it is the graph's terminal consumer). See the crate-level note in
# src/lib.rs.
[dependencies]
# The frozen Identity & Access contract surface (the eleven-method IdentityService ABI, the
# Principal/Decision/Consistency types) — P-ID-04 wires the shell's check/list_objects SLOTS
# against these signatures with fail-closed stubs until the bodies land (P-ID-09/P-ID-11).
myelin-identity = { path = "../myelin-identity" }
# The harness: serve(AppSpec) + the three-surface topology (public/internal/metrics-health) +
# liveness≠readiness + graceful drain. The shell is an AppSpec this wires; it is NOT a service
# that re-implements the lifecycle (architecture 00 §3.1, the one call).
myelin-substrate = { path = "../myelin-substrate" }
# TenantId / Region value types (for the Principal the internal-RPC authorizer threads).
myelin-tenancy = { path = "../myelin-tenancy" }
# P-ID-08 (P-057): the S3 ReBAC tuple store emits iam.tuple_written via the OUTBOX — the ONLY
# emit path (the no-raw-publish lint forbids any other). The OutboxStore / OutboxTx::emit /
# EventDraft / EmitContextBase carriers + the iam.tuple_written envelope construction live in
# the events tier; the store buffers its delta + the event into ONE OutboxTransaction so the
# tuple write and its event co-commit (emit-iff-committed). A service crate (a leaf consumer
# ABOVE the events tier) may depend on it; nothing in the production library DAG depends back.
myelin-events = { path = "../myelin-events" }
# P-ID-08 (P-057): the S3 store is RLS-partitioned `(tenant, region)` with NO cross-tenant query
# path — every store access is built through TenantScope/TenantQuery (the tenant-predicate floor),
# and the store auto-registers as a PersonalDataHolder (the OltpStoreHolder seam). The OLTP tier
# client (RLS guard + holder) lives in myelin-storage.
myelin-storage = { path = "../myelin-storage" }
# The iam.tuple_written event payload is references-not-payloads JSON (object#relation@subject
# refs + the zookie watermark, never PII) built with `serde_json::json!`. The whole workspace
# shares one serde_json::Value shape behind EventEnvelope.payload (workspace.dependencies).
serde_json = { workspace = true }
# P-ID-05 (P-064): the S1 principal store tags every PII column with the frozen
# `#[personal_data(...)]` attribute (contract 10.2) referencing the five-tag classification enums
# (DataCategory/DataRole/LawfulBasis/RetentionClass/ErasureMethod) so the no-untagged-personal-data
# lint (contract 1.6) is GREEN on S1 and the store compiles against the FROZEN tags (never drift).
# The PersonalDataHolder trait id the S1 store registers under also lives here (10.1).
myelin-gdpr = { path = "../myelin-gdpr" }
# P-133 (P-ID-22): the ONE platform predicate language. The promoted `CaveatContext`
# evaluator (check_engine::eval_caveat) calls into the single bounded, DoS-hardened,
# statically-cost-bounded `myelin-query` QueryAst interpreter (contract 3.4, the EventMatcher
# core) — there is no second predicate language. A service crate (the terminal consumer ABOVE
# the mid-tier library DAG) depends on myelin-query; nothing in the production library DAG
# depends back on this service.
myelin-query = { path = "../myelin-query" }

[dev-dependencies]
# P-ID-10 (P-068) ID-D3 drill: the failure-injection harness's telemetry-assertion library
# (the contract-1.8 survival-signal set, incl. CrossTenantCount) the cross-tenant drill emits its
# dated green artifact through. DEV-only — myelin-harness never enters the service production DAG.
myelin-harness = { path = "../myelin-harness" }
# P-ID-15 (P-073) CDC for 4.11: the critical-dep caller wraps `check` in the ResilientClient
# (contract 1.9) — the M0 shared resilient inter-service client (timeout + breaker + bulkhead +
# jittered retry). The CDC pins the provider (Identity `check` + S6 FailStatic) against the
# consumer (a critical-dep caller wrapping the check in ResilientClient + S6). DEV-only — the
# client never enters the identity-service production DAG; the CDC models a DOWNSTREAM consumer
# of Identity (every other service is such a caller).
myelin-client = { path = "../myelin-client" }
