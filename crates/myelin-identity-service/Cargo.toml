[package]
name = "myelin-identity-service"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "identity"
path = "src/main.rs"

[[bin]]
name = "mr009_kill9_writer"
path = "src/bin/mr009_kill9_writer.rs"
required-features = ["integration"]

[lib]
path = "src/lib.rs"

[dependencies]
blake3.workspace = true
myelin-identity = { path = "../myelin-identity" }
myelin-substrate = { path = "../myelin-substrate" }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-events = { path = "../myelin-events" }
myelin-storage = { path = "../myelin-storage" }
serde_json = { workspace = true }
myelin-gdpr = { path = "../myelin-gdpr" }
myelin-query = { path = "../myelin-query" }
myelin-notif = { path = "../myelin-notif" }
myelin-refs = { path = "../myelin-refs" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ring = "0.17"
rsa = "0.9"
sha2 = { workspace = true, features = ["oid"] }
base64 = "0.22"
zeroize = "1"
hmac = "0.12"
xmlparser = "0.13"
ciborium = "0.2"
tokio = { workspace = true, features = ["signal"] }
myelin-config = { workspace = true }
sqlx = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rand = "0.8"
myelin-harness = { path = "../myelin-harness" }
myelin-client = { path = "../myelin-client" }
myelin-agent = { path = "../myelin-agent" }
myelin-identity-service = { path = ".", features = ["test-support"] }

[features]
default = []
integration = ["myelin-storage/integration"]

test-support = ["myelin-storage/test-support"]
memory = ["test-support"]
