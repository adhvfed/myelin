[package]
name = "myelin-search"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-search is a CONSUMER crate (architecture §0/§1): it owns no contract crate and
# holds only derived, reconstructible state. At M0 (SRCH-P01 → P-021) it carries ONLY the
# index-document NAME ANCHORS aligned to the frozen EventEnvelope (contract 2.1) + ArtifactRef
# (contract 5.1) — no mechanism. It therefore depends on:
#   - myelin-events   → the frozen EventEnvelope field list the index doc aligns to (the
#                       names/units anchor the drift test reconciles against), which also
#                       re-exports ArtifactRef / Region / TenantId / DataRole / Visibility /
#                       PiiKeyRef.
#   - myelin-tenancy  → the ArtifactRef value type (the doc_id key) + the (tenant, region)
#                       partition key, named directly so the anchor module reads from the
#                       definition site.
# It MUST NOT be depended on by -tenancy/-events/-identity (it is downstream in the §2.9 DAG).
# The engine + index backends + the permission-aware query pipeline (the path the
# search-requires-acl-filter lint guards) are the M2 follow-on (SRCH-P03..SRCH-P16); they pull
# in myelin-query / myelin-identity / myelin-gdpr / myelin-content then, not at this M0 floor.
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-events = { path = "../myelin-events" }

# SRCH-P02 (P-122, M1) consumer dependencies — Search registers into the platform GDPR/KMS/residency
# substrate (holder registration + per-tenant index DEK + residency-pin confirmation). Like
# myelin-refs-service (REF-P3/P4), Search is a LEAF CONSUMER above these glue crates and is OUTSIDE
# the eleven-crate library DAG modelled by myelin-substrate::crate_graph (it is not a Crate::* node),
# so adding these does NOT mutate the modelled DAG (substrate stays root; nothing depends back on
# Search). The acyclicity holds: -gdpr/-storage/-substrate never depend on -search.
#   - myelin-gdpr      → the PersonalDataHolder contract (10.1) + the receipt/scope/SubjectRef types
#                        Search IMPLEMENTS as holder H7 (stub surface now; real purge+reindex SRCH-P15).
#   - myelin-storage   → the KMS hierarchy (11.3/11.4: KmsEngine + KeyClass + PiiKeyRef) the Search
#                        per-tenant index DEK is reserved in + the KeyOrigin/IndexAdmission HYOK gate.
#   - myelin-substrate → the holder registry (StoreKind/HolderRegistry, contract 1.4) + the H1–H18
#                        catalog (Holder::H7SearchIndex + classify_store + the completeness assertion).
#   - myelin-identity  → Principal — the verified subject the holder's locate/erase key on (via
#                        SubjectRef). (Promoted from dev-only: the holder surface now uses it in prod.)
myelin-gdpr = { path = "../myelin-gdpr" }
myelin-storage = { path = "../myelin-storage" }
myelin-substrate = { path = "../myelin-substrate" }
myelin-identity = { path = "../myelin-identity" }

# TEST-ONLY. The names/units drift test constructs a canonical EventEnvelope (which embeds a
# Principal from myelin-identity, now a prod dep above) to read the REAL frozen field names off a
# value, and confirms the search-requires-acl-filter lint (its home is the shared myelin-lints
# ratchet crate; SRCH-P01 confirms it in place rather than duplicating it — EI-01 §7). The lint crate
# is not a production dependency; it is the harness the lint proof runs against.
[dev-dependencies]
myelin-lints = { path = "../myelin-lints" }
serde_json = { workspace = true }
