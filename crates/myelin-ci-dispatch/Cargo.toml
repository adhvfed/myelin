[package]
name = "myelin-ci-dispatch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ci-dispatch"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
myelin-substrate = { path = "../myelin-substrate" }

myelin-ci-controlplane = { path = "../myelin-ci-controlplane" }

myelin-query = { path = "../myelin-query" }
myelin-ci-sandbox = { path = "../myelin-ci-sandbox" }
myelin-git = { path = "../myelin-git" }
myelin-events = { path = "../myelin-events", features = ["nats"] }
myelin-identity = { path = "../myelin-identity" }
myelin-tenancy = { path = "../myelin-tenancy" }
serde_json = { workspace = true }

myelin-storage = { path = "../myelin-storage" }
myelin-flow = { path = "../myelin-flow" }
serde = { workspace = true }
toml = { workspace = true }

sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }

myelin-config = { path = "../myelin-config" }
aws-sdk-s3 = { workspace = true, optional = true }

[dev-dependencies]
myelin-events = { path = "../myelin-events", features = ["test-support"] }
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
git2.workspace = true
async-nats.workspace = true

[features]
default = []
test-support = []
integration = [
    "dep:sqlx",
    "dep:aws-sdk-s3",
    "myelin-storage/integration",
]
