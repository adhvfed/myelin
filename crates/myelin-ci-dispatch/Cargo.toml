[package]
name = "myelin-ci-dispatch"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# CI-P6 (P-349, M4): the CI Trigger & Dispatch service is a `serve(AppSpec)` shell (contract 1.1) —
# the binary below is the "every service main.rs" the row names: it does nothing but hand the CI
# Trigger & Dispatch AppSpec to the harness's one call (NOT a hand-rolled lifecycle). Trigger &
# Dispatch is "stateless except the dedup ledger" (arch 00 §4): the library carries the shell
# builder (`dispatch_app_spec` / `run_dispatch`) + the ONE table this service owns — the
# `consumer_dedup` ledger (arch 01 §3.8 / contract 2.5), the exactly-once-effect anchor so one push
# = one run. (The dispatch BEHAVIOUR — the EventMatcher, the trust-tier stamp, the definition
# resolution → CAS snapshot, the reserve/start handoff — is CI-P10/CI-P11; this is the shell + the
# dedup-ledger schema.)
#
# Like the other service/subsystem crates (myelin-search, myelin-ci-controlplane) it is a LEAF
# CONSUMER above the shared substrate: it depends on the frozen serve/AppSpec + migrations surface
# and NOTHING in the production eleven-crate library DAG depends back on it — so
# `substrate_is_root()` is preserved (a subsystem crate is the graph's terminal consumer, OUTSIDE the
# modelled DAG). cargo build --workspace stays DB-free; the live-stack schema apply is behind the
# `integration` feature only.
[[bin]]
name = "ci-dispatch"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The substrate serve(AppSpec) harness (contract 1.1/1.2/1.3): the three-surface split, liveness ≠
# readiness, the forward-only migration runner, the holder auto-registry (contract 1.4). Trigger &
# Dispatch is an AppSpec, not a hand-rolled main.
myelin-substrate = { path = "../myelin-substrate" }

# CT-004m: the SHARED CI durable-migration seam. ci-dispatch's reserve/start co-commit writes `ci_run`,
# a table OWNED by myelin-ci-controlplane (its `CREATE_CI_RUN_DDL`). The dispatch main applies
# `ci_durable_migrations()` (the `ci_run`/`check_attempt`/`ci_cost_event` writer subset) at boot so the
# table is present regardless of which CI service boots first (the shared-`myelin`-DB reality — one PG
# for every service). This is a PRODUCTION edge now (was dev-only): dispatch → controlplane is acyclic
# (controlplane is a terminal leaf consumer; nothing in the modelled DAG depends back on dispatch, so
# `substrate_is_root()` is preserved). The migration set is the ONE source of the `ci_run` DDL — no drift.
myelin-ci-controlplane = { path = "../myelin-ci-controlplane" }

# ------------------------------------------------------------------------------------------
# CI-P10 (P-353, M4): the dispatch BEHAVIOUR's reused engines + frozen types. Trigger & Dispatch
# is the graph's TERMINAL consumer (a subsystem crate OUTSIDE the modelled production DAG —
# nothing depends back on it, so `substrate_is_root()` is preserved). It pulls:
#   - myelin-query     — the ONE EventMatcher (= the frozen QueryAst, contract 3.4); a trigger
#                        compiles to this, NOT a CI DSL / CEL. NO second predicate language.
#   - myelin-ci-sandbox — the already-frozen 3-way `TrustTier` the `JobSpec.trust_tier` carries.
#   - myelin-git       — the already-frozen 2-way `CheckStatus`-tier the merge gate reads (X-1).
#   - myelin-events / myelin-identity / myelin-tenancy — the envelope + SetExpr/ObjectType + the
#                        partition keys these surfaces are typed over.
# These crates already sit above the substrate (myelin-ci-sandbox -> myelin-git -> myelin-query),
# so adding them HERE creates no cycle (dispatch is the terminal leaf). cargo build --workspace
# stays DB-free (none of these pull a DB on the default features).
myelin-query = { path = "../myelin-query" }
myelin-ci-sandbox = { path = "../myelin-ci-sandbox" }
myelin-git = { path = "../myelin-git" }
myelin-refs = { path = "../myelin-refs" }
myelin-events = { path = "../myelin-events", features = ["nats"] }
myelin-identity = { path = "../myelin-identity" }
myelin-tenancy = { path = "../myelin-tenancy" }
serde_json = { workspace = true }

# ------------------------------------------------------------------------------------------
# CI-P11 (P-354, M4): the definition resolution → content-addressed snapshot + the reserve/start
# handoff REUSES two frozen seams (no second implementation):
#   - myelin-storage  — the frozen content-addressed `BlobStore` (contract 11.2): the resolved DAG
#                       is written as a T2 CAS blob (BLAKE3 address = the run's reproducible
#                       definition). NOT a new store; the one trait.
#   - myelin-flow     — the frozen `DurableExecutor::start` + `StartSpec` (contract 9.1): the
#                       reserve/start handoff hands the snapshot ref to the `ci.pipeline` workflow.
# Both crates are TERMINAL leaf consumers above the substrate (myelin-flow already depends on
# myelin-storage); NEITHER depends back on myelin-ci-dispatch, so adding both edges HERE (dispatch
# is itself the graph's terminal consumer) is acyclic. cargo build --workspace stays DB-free
# (storage's default fs floor + flow's in-memory executor pull no DB).
myelin-storage = { path = "../myelin-storage" }
myelin-flow = { path = "../myelin-flow" }
# serde derive for the ResolvedSnapshot: the resolved DAG is serialised to CANONICAL JSON (the
# byte-identical-for-identical-input form the BLAKE3 content address is taken over — the
# reproducibility floor, VISION §3). The `derive` feature is the workspace default; no DB edge.
serde = { workspace = true }
# CT-004b (M4): the AUTHORED `.myelin/ci.*` config-file parser (arch 02 §7.4 — "declarative
# JSON-schema'd core, authored as YAML/TOML"). TOML is the primary authored surface; `toml` is
# ALREADY a workspace-pinned dep (myelin-events reads `thresholds.toml` with it) — the lightest
# maintained TOML lib, no NEW third-party crate enters the graph. JSON is parsed with the
# serde_json already listed above (free — the JSON-schema'd core). YAML is DEFERRED (no workspace
# YAML dep; serde_yaml is archived/unmaintained — adding it would violate minimal-deps). Both
# formats are DB-free, build-time only.
toml = { workspace = true }

# ------------------------------------------------------------------------------------------
# REAL live-stack schema apply behind the `integration` feature (CI-P6). The consumer_dedup ledger
# migration gets PROVEN against the live dev-stack Postgres (forward-only apply + RLS isolation +
# the exactly-once PRIMARY KEY) in tests/integration_ci_p6_dispatch_schema.rs. The OPTIONAL sqlx +
# tokio deps are pulled ONLY by `--features integration` — the default `cargo build`/`cargo test
# --workspace` stay DB-free. EXTERNAL crates only; no new myelin edge. The test reads DATABASE_URL
# inline (no myelin-config edge — same posture as refs-service/identity).
# ------------------------------------------------------------------------------------------
sqlx = { workspace = true, optional = true }
# MR-009b W3b.6: tokio + myelin-config are REGULAR deps now — the durable service main.rs
# (provider-from-env → migrate_foundation → OutboxStore::durable, fail-loud) needs them. The
# `integration` feature no longer carries their dep: activation; the build stays DB-free
# (connecting happens at RUNTIME, never at build).
tokio = { workspace = true, features = ["signal"] }

# CI-P11 (P-354, M4): the CAS-SNAPSHOT round-trip against the LIVE object store (RustFS). The binding
# data-layer policy: a contract that touches the object store (11.2 BlobStore — the CAS definition
# snapshot) ships a REAL integration test green against the live dev stack, NOT a mock. The resolver
# writes the snapshot through `myelin_storage::s3blob::S3BlobStore` (the dev<->prod backing SWAP) and
# reads the SAME bytes back at the SAME content address. These optional deps are pulled ONLY by
# `--features integration`; the default build stays DB-free.
myelin-config = { path = "../myelin-config" }
aws-sdk-s3 = { workspace = true, optional = true }

[dev-dependencies]
# MR-009b W3b.6: enable `test-support` so this crate's DEV tests reach the events in-memory
# `OutboxStore::new()` double (the durable `OutboxStore::durable` is the production default; the
# in-memory `Memory` arm + `::new()` are `#[cfg(any(test, feature = "test-support"))]`). DEV-only
# — never in the production DAG (cargo tree -e no-dev shows no test-support edge).
myelin-events = { path = "../myelin-events", features = ["test-support"] }
# MR-009b W7.3 — the fs `FsBlobStore` floor is now a `test-support`-gated test double in
# myelin-storage; this crate's `resolve.rs` unit tests + `cdc_ci_p11_resolve_dispatch` drill drive it
# via the `BlobStore` trait, so enable `test-support` DEV-only. Never in the production DAG
# (`cargo tree -e no-dev` shows no test-support edge) — the SAME idiom as the other subsystem crates'
# storage test-support dev-deps (git/search/issues/knowledge/chat).
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
git2.workspace = true
async-nats.workspace = true
# CT-004m: myelin-ci-controlplane is now a PRODUCTION dependency (see `[dependencies]` above) — the
# dispatch main applies its `ci_durable_migrations()` at boot. The CT-004b live-PG trigger-consumer
# durability test uses the SAME crate's real migration set (no drift). No separate dev-dependency
# entry is needed (the production edge covers the test).

[features]
default = []
# CT-004b: the `test-support`-gated in-memory doubles (`MapGitConfigReader`, `RecordingReserveStore`)
# the trigger-consumer unit tests + downstream drills drive DB-free. Never in the production DAG (the
# `no-in-memory-durable-store` scanner strips `test-support`-gated types as test doubles).
test-support = []
# `myelin-storage/integration` exposes the s3blob module (the real S3BlobStore over RustFS/Scaleway).
# The CT-004b live-PG trigger-consumer durability test rides `integration` (real ci_run co-commit).
integration = [
    "dep:sqlx",
    "dep:aws-sdk-s3",
    "myelin-storage/integration",
]
