[package]
name = "myelin-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "myelin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

myelin-git = { path = "../myelin-git" }
myelin-agent = { path = "../myelin-agent" }
myelin-events = { path = "../myelin-events" }
myelin-issues = { path = "../myelin-issues" }
myelin-ci-controlplane = { path = "../myelin-ci-controlplane" }
myelin-notif = { path = "../myelin-notif" }
myelin-refs = { path = "../myelin-refs" }

serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = "4.1.6"
rand = "0.8"
sha2 = { workspace = true }
zeroize = "1"

percent-encoding = "2.3"

hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "aws-lc-rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "io-std", "time", "signal"] }

[dev-dependencies]
myelin-edge = { path = "../myelin-edge", features = ["test-support"] }
myelin-identity = { path = "../myelin-identity" }
myelin-identity-service = { path = "../myelin-identity-service", features = ["test-support"] }
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-tenancy = { path = "../myelin-tenancy" }
