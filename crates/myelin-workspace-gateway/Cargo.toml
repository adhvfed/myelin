[package]
name = "myelin-workspace-gateway"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
myelin-identity-service = { path = "../myelin-identity-service" }
myelin-storage = { path = "../myelin-storage" }
myelin-agent-service = { path = "../myelin-agent-service" }
myelin-ci-sandbox = { path = "../myelin-ci-sandbox" }
myelin-config = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "=0.63.0", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"

[dev-dependencies]
tempfile.workspace = true
