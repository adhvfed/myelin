[package]
name = "myelin-workspace-gateway"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
myelin-identity-service = { path = "../myelin-identity-service" }
myelin-storage = { path = "../myelin-storage" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "=0.63.0", default-features = false, features = ["ring"] }
uuid = "1"

[dev-dependencies]
tokio = { workspace = true }
