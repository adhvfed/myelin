[package]
name = "myelin-gdpr-macros"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The proc-macro half of the GDPR classify-derive (contract 10.2). It exists as a SEPARATE
# crate because Rust requires `proc-macro = true` crates to export ONLY procedural macros — the
# five-tag ENUM TYPES (the names consumers reference) live in `myelin-gdpr` itself, and
# `myelin-gdpr` re-exports the `#[personal_data]` attribute from here so a store writes
# `use myelin_gdpr::personal_data;` and never depends on this crate directly.
#
# DAG position: this is a leaf BELOW `myelin-gdpr` (it has NO myelin dependencies — the
# proc-macro toolchain only). `myelin-gdpr` depends on it; nothing else does. The generated code
# names `::myelin_gdpr::__registry::*` paths the CONSUMER crate resolves — so this crate carries NO
# myelin dependency and the acyclic-leaf position is preserved (P-GA-07 / P-107).
[lib]
proc-macro = true

[dependencies]
# The classify-derive BODY (P-GA-07 / P-107): parse the tagged struct + its `#[personal_data(...)]`
# helper args (syn), emit the generated registry entry + the structural `subject_locator` accessor
# (quote). These compile ONLY into this proc-macro crate (a build-time dep of the consumers; it ships
# no runtime code into a binary).
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
