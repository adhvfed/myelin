[package]
name = "myelin-query"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-query is in the mid-tier of the DAG (architecture 00 §2.9). It depends on
# tenancy + identity + events (the `EventMatcher` predicate core shares the QueryAst, and
# permission-aware queries compose with list_objects). It MUST NOT depend on -agent,
# -gdpr, -client, or -substrate (downstream).
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
serde.workspace = true
# The EventMatcher (matcher.rs, P-137) projects the EventEnvelope's `payload`
# (`serde_json::Value`) into the bounded interpreter's variable namespace, so serde_json is a
# NORMAL dependency now (the envelope payload type crosses into the matcher). It stays
# DB-free — pure value projection, no I/O.
serde_json = { workspace = true }
