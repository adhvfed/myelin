[package]
name = "myelin-events"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

async-nats = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
myelin-config = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
nats = ["dep:async-nats", "dep:tokio", "dep:myelin-config", "dep:futures"]
integration = ["nats"]

test-support = []
memory = ["test-support"]

[dev-dependencies]
myelin-harness = { path = "../myelin-harness" }
myelin-events = { path = ".", features = ["test-support"] }
toml = { workspace = true }
