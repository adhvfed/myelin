[package]
name = "myelin-flow"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# THE durable-workflow substrate crate (P-FLOW-01 → P-197, M2). myelin-flow is a BUILD,
# DBOS-class, Postgres-embedded engine (architecture durable-workflow.md §2, ADR-09) — NO new
# datastore. It sits inside the myelin-flow service's own Postgres and inherits the M0
# substrate's outbox / idempotent-consumer / crypto-shred / tenant-partition / fail-static
# primitives.
#
# At P-FLOW-01 it carries the SCHEMA ONLY: the six-table data model (architecture §3 —
# workflow_run / wf_history / wf_timer / wf_signal / wf_activity_attempt / wf_definition) as
# forward-only `(tenant, region)`-first RLS migrations, plus the row TYPE carriers with the
# `#[personal_data(...)]` classification tags on every PII-bearing column. No AppSpec wiring
# (P-FLOW-02), no holder registration (P-FLOW-03), no algorithms (P-FLOW-04..08).
#
# DAG POSITION (a documented, NAMED leaf consumer, like myelin-notif / myelin-agent-service):
# it sits ABOVE the glue crates — it depends on -tenancy (the (tenant, region) partition key),
# -refs (the ArtifactRef value type the references-not-payloads `input`/`result` carry), -gdpr
# (the #[derive(PersonalData)] classify-derive), and -substrate (the Migration/MigrationRunner
# forward-only framework + is_destructive). NOTHING in the production library DAG depends back
# on it. It is therefore OUTSIDE the eleven-crate library DAG modelled by
# myelin-substrate::crate_graph (substrate_is_root()/identity_is_sink() are preserved — a
# subsystem schema crate is the graph's terminal consumer, not a node in it).
[dependencies]
# The (tenant, region) partition key — every table LEADS with TenantId + Region (12.1, ADR-11).
myelin-tenancy = { path = "../myelin-tenancy" }
# ArtifactRef — `workflow_run.input` + `wf_history.result` are references-not-payloads (the
# workflow about a PR carries the PR's ArtifactRef, never the PR body — architecture §3.1/§3.2).
myelin-refs = { path = "../myelin-refs" }
# The #[derive(PersonalData)] + #[personal_data(...)] classification (contract 10.2) the six
# data-model row types (src/schema.rs) carry on every PII-bearing column (the rare inline-PII
# result/payload key refs) — the no-untagged-personal-data gate's compile-time half.
myelin-gdpr = { path = "../myelin-gdpr" }
# The forward-only migration framework: Migration / Migrations / MigrationRunner / HotTables /
# is_destructive (contract 1.5). The migrations are built through it so the boot-time runner
# applies them forward-only AND the forward-only-migration lint reads them at source-scan.
myelin-substrate = { path = "../myelin-substrate" }

# REAL Postgres backend behind the `integration` feature (Stage 1 / infra). OPTIONAL deps pulled
# ONLY by `--features integration`, which compiles the live-PG schema-apply + RLS denial +
# idempotency-constraint test (tests/integration_flow_schema.rs) run against the docker-compose
# dev stack. The default `cargo build --workspace` stays DB-free (the binding-policy floor — no
# DB at build).
myelin-config = { path = "../myelin-config", optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The committed-ratchet lint-fixture test (tests/lint_fixtures.rs): the FOUR schema gates this
# prompt names (forward-only-migration / no-untagged-personal-data / tenant-predicate /
# no-cross-db) run over RED/GREEN fixtures so a regression that lets a destructive migration / an
# untagged-PII column / a tenant-less query / a cross-DB reach slip through fails THIS build.
myelin-lints = { path = "../myelin-lints" }

[features]
# The live-PG integration test (tests/integration_flow_schema.rs). DB-free by default.
integration = ["dep:myelin-config", "dep:sqlx", "dep:tokio"]
