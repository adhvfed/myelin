[package]
name = "myelin-agent-service"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The Agent-Fabric IMPLEMENTATION / SERVICE crate (AG-P2 → P-131), distinct from the glue crate
# `myelin-agent` (AG-P1 → P-130, which owns the frozen six-trait contract surface). Like the other
# SERVICE / SUBSYSTEM crates (myelin-identity-service, myelin-gdpr-service, myelin-git,
# myelin-issues, myelin-notif) it is a LEAF CONSUMER above the glue crates: it depends on
# -agent (the ToolDef/effect value types the data model references) + -gdpr (the #[personal_data]
# classify-derive) + -storage (the forward-only online migration runner + the (tenant, region) RLS
# guard) + -tenancy (the partition key types). NOTHING in the production library DAG depends back on
# it; it is OUTSIDE the eleven-crate library DAG modelled by myelin-substrate::crate_graph
# (substrate_is_root() / identity_is_sink() are preserved — a service is the graph's terminal
# consumer). See the crate-level note in src/lib.rs.
[dependencies]
myelin-agent = { path = "../myelin-agent" }
myelin-gdpr = { path = "../myelin-gdpr" }
myelin-storage = { path = "../myelin-storage" }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
# The PersonalDataHolder REGISTRATION seam (AG-P3 → P-132): the substrate HolderRegistry (the ONE
# door — opening IS registering, contract 1.4), the StoreClassifier (the data-map's "this OLTP store
# is holder HN" fact), and the H1–H18 catalog (the Fabric stores classify to H11 agent-memory + H17
# agent-trace). Mirrors myelin-refs-service / myelin-search (the M1 holder-registration pattern).
# AG-P4 (→ P-216) also uses `serve(AppSpec)` (contract 1.1) + `consume` (the dispatch consumer) here.
myelin-substrate = { path = "../myelin-substrate" }

# AG-P4 (→ P-216) — the SKELETON runtime ties the substrate path together. NEW deps (all leaf
# consumers above the glue crates; NO cycle — `myelin-flow` depends on `myelin-agent` [glue], NOT on
# `myelin-agent-service`, so this crate may depend on `myelin-flow` and remains OUTSIDE the
# eleven-crate library DAG modelled by `myelin-substrate::crate_graph`):
#   - myelin-flow   : a run is a durable workflow (ADR-09) — the `WfCtx` loop body the SKELETON drives
#                     + the `DurableExecutor` seam (contracts 9.1/9.2/9.5); reused, not reinvented.
#   - myelin-events : the transactional outbox `OutboxTx::emit(draft, cause)` nested-causality emit
#                     (contract 2.2) + the `consume` dispatch-consumer entry-point (contract 3.6).
#   - myelin-refs   : the `ArtifactRef` the trace row is keyed by (references-not-payloads).
myelin-flow = { path = "../myelin-flow" }
myelin-events = { path = "../myelin-events" }
myelin-refs = { path = "../myelin-refs" }
# The SKELETON's terminal trace event carries a references-not-payloads JSON payload (the trace
# `ArtifactRef`); serde_json builds the `EventDraft.payload` value (it was a dev-dep for AG-P2's
# round-trip test; the SKELETON's emit needs it at lib scope).
serde_json.workspace = true

# REAL Postgres backend behind the `integration` feature (Stage 1 / infra). OPTIONAL deps: the
# DEFAULT `cargo build --workspace` stays DB-free (the binding policy floor — no DB at build). They
# are pulled ONLY by `--features integration`, which compiles the live-PG RLS denial test
# (tests/integration_rls.rs) run against the docker-compose dev stack.
#   - myelin-config : the dev<->prod CONFIG SWAP seam (the DATABASE_URL the live test reads);
#   - sqlx          : the OLTP Postgres client (RUNTIME queries — sqlx::query, NOT query!, so the
#                     build is DB-free even with the feature off);
#   - tokio         : the async runtime the live client needs.
myelin-config = { path = "../myelin-config", optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The migration test re-uses the storage online runner; serde_json round-trips the trace ArtifactRef.
serde_json.workspace = true

[features]
default = []
# Pull the real Postgres client + compile the live-PG (tenant, region) RLS cross-tenant denial test.
integration = ["dep:myelin-config", "dep:sqlx", "dep:tokio"]
