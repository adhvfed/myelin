[package]
name = "myelin-substrate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-substrate is the ROOT of the crate DAG, root-LAST (architecture 00 §2.9):
# ... → client → substrate. It depends on ALL the glue crates and is depended on by
# NONE of them (a service's main.rs is the only consumer). It is the harness home
# (serve(AppSpec)) and the FailStatic<T> home, and it carries the crate-graph-acyclic
# test (the build-layer realisation of the no-cross-sync-cycle lint, P-S10 ships the
# real lint).
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
myelin-refs = { path = "../myelin-refs" }
myelin-content = { path = "../myelin-content" }
myelin-query = { path = "../myelin-query" }
myelin-agent = { path = "../myelin-agent" }
myelin-gdpr = { path = "../myelin-gdpr" }
myelin-client = { path = "../myelin-client" }
# The storage SUBSTRATE (P-007): serve opens the bounded OLTP pool through it (§3.3) and
# auto-registers the OLTP store as a PersonalDataHolder (§3.4). The crate_graph DAG already
# models Substrate → Storage (root-last); this manifest edge realises it.
myelin-storage = { path = "../myelin-storage" }
serde.workspace = true

[dev-dependencies]
# Test-support ONLY: the hello-world serve test reads the contract-1.8 producer signals
# serve exports back through the harness's telemetry-assertion library (the SAME SignalName
# set). A dev-dependency so myelin-harness stays OUT of the production crate DAG
# (architecture §2.9 — the harness is a leaf consumer; nothing in the DAG depends on it).
myelin-harness = { path = "../myelin-harness" }
serde_json.workspace = true
