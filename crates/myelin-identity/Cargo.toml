[package]
name = "myelin-identity"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-identity is a SINK in the crate DAG (architecture 00 §2.9): "identity depends
# on nothing" above myelin-tenancy. Its ONLY myelin dependency is myelin-tenancy
# (for TenantId / Region / ArtifactRef value types). Adding any edge to myelin-events,
# -refs, -content, -query, -agent, -gdpr, -client, or -substrate would make identity
# non-sink and MUST NOT compile (the crate-graph-acyclic test asserts this).
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
serde.workspace = true
