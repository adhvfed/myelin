[package]
name = "myelin-gdpr"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-gdpr is below the events tier in the DAG (architecture 00 §2.9):
# events (+ refs/content/query) → agent, gdpr. It depends on tenancy + identity (the
# subject locator threads a Principal/TenantId) AND on events (P-GA-01: the `data_role`
# enum anchors to the frozen 2.1 `EventEnvelope.data_role` field — `myelin_events::DataRole`
# — so the GDPR `tenant-content | platform-operational` role-tag can never drift from the
# envelope's `controller | processor`; the edge gdpr → events is acyclic, events depends only
# on tenancy + identity). It MUST NOT depend on -client or -substrate (downstream); such an
# edge MUST NOT compile.
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
# The proc-macro half of the classify-derive (contract 10.2, P-GA-02). `myelin-gdpr` re-exports
# its `#[personal_data]` attribute so a store writes `use myelin_gdpr::personal_data;` and the
# five-tag enum TYPES (defined HERE) + the attribute (defined THERE) arrive together.
myelin-gdpr-macros = { path = "../myelin-gdpr-macros" }
serde.workspace = true
serde_json.workspace = true
# BLAKE3 content-addresses the holder-op Receipt (P-GA-05): `content_hash = blake3:<hex>` over the
# canonical receipt body. ONE hash family across the platform (the same multihash convention the
# BlobStore content-address and the audit Merkle leaf use — no hand-rolled crypto, VISION §4).
blake3.workspace = true
hex.workspace = true
