[package]
name = "myelin-ci-sandbox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The CI SANDBOX crate (CI-P1 → P-129, M2). The runner/backend home (architecture
# continuous-integration 01 §2: the runtime-agnostic seam; ADR-20 / X-6 / CI-1). At P-129 it
# carries ONLY the SEAM, frozen byte-authoritative to arch 01 §2:
#   - the JobSpec struct (kind ∈ {Ci, Agent} — the UNIFY point) + its supporting value types
#     (ImageRef digest-pin-or-reject, EgressPolicy default-deny, ResourceLimits incl. pids_max +
#     zero-swap + timeout, TrustTier, RunTokenRef, MeterTarget, IdemToken, …);
#   - the SandboxBackend trait SHAPE (launch / kill) + the FleetProvider trait SHAPE
#     (provision / deprovision / capacity) — shapes ONLY (no impl: Firecracker is CI-P2/P-237,
#     gVisor is CI-P28, the fleet impl is CI-P14);
#   - the four-uniform-guarantee wiring SEAM (RunnerHooks: reserve/settle 11.7, mint_run_token
#     4.7 attribution, the HITL-withhold routing note, the isolation-floor hook CI-P5's escape
#     drill drives). ToolHands::exec (8.4) IS launch(JobSpec{kind:Agent}) — the equivalence wired
#     here (agent_job(...)) so the agent fabric (AG-P8/P-226) dispatches onto THIS exact runner.
#
# DAG POSITION (a documented, NAMED leaf consumer, exactly like myelin-git / myelin-issues /
# myelin-notif / myelin-chat): it sits ABOVE the shared glue crates — it depends ONLY on
# myelin-tenancy (the frozen Region partition type the FleetProvider trait names) and NOTHING in
# the production library DAG depends back on it. It is therefore OUTSIDE the eleven-crate library
# DAG modelled by `myelin-substrate::crate_graph` (substrate_is_root() / identity_is_sink() are
# preserved — a subsystem crate is the graph's terminal consumer, not a node in it).
#
# DB-FREE / VM-FREE BY DEFAULT: this crate touches NO DB / object-store / cache / bus contract.
# CI-P2 (P-237) adds the Firecracker default backend + the gVisor named-second backend + the
# backend-independent mandatory hardening profile. Their unit tests inject a fake VMM/runtime so
# the default `cargo test` NEVER boots a guest. The REAL microVM boot lives ONLY behind the
# `integration` feature (tests/hardened_boot_selftest.rs), gated to SKIP gracefully without
# /dev/kvm or `firecracker`. `cargo build --workspace` + the default `cargo test` stay DB-free AND
# VM-free. The ZERO-escapes real-kernel GATE (AG-D4 / CI-T1) is CI-P5 (named floor).
[dependencies]
# The frozen (tenant, region) partition types (contract 12.1 / P-CP-01). The FleetProvider trait
# names `Region` in provision/capacity (arch 01 §2). myelin-tenancy is a shared partition-key
# carrier and NOTHING in the production DAG depends back on myelin-ci-sandbox, so this leaf edge
# keeps the §2.9 graph acyclic.
myelin-tenancy = { path = "../myelin-tenancy" }
# The runner agent (CI-P3 → P-238) reports terminal via the FROZEN `job.done` durable signal
# (9.2/9.4) — it ECHOES the workflow-minted `idem_token` onto the ENGINE's `DurableExecutor::signal`
# (`SignalSpec{signal_name = JOB_DONE_SIGNAL, idem_key = idem_token}`), whose `INSERT … ON CONFLICT
# (tenant, run_id, signal_name, idem_key) DO NOTHING` IS the exactly-once wake (recon §OQ-F, shipped
# P-FLOW-09/P-205). The runner does NOT build a second signal path — it consumes the one engine
# signal idempotency. NO cycle: `myelin-flow` is a TERMINAL DAG consumer (nothing depends back on it,
# and it has no edge to `myelin-ci-sandbox`), so `myelin-ci-sandbox → myelin-flow` stays acyclic —
# exactly the edge `myelin-agent-service` already carries to both crates.
myelin-flow = { path = "../myelin-flow" }
# The `job.done` signal payload is references-not-payloads `ArtifactRef`s (§3.4) — the terminal
# report carries result refs (the `ci.log.available` pointer + artifact refs), never a PII body.
myelin-refs = { path = "../myelin-refs" }
serde.workspace = true

[features]
# Two REAL live-stack proofs, both DB/VM-free by default:
#   - tests/hardened_boot_selftest.rs (CI-P2) boots a Firecracker microVM with the full hardening
#     profile ON; gated to SKIP gracefully without /dev/kvm or `firecracker`.
#   - tests/integration_runner_lease.rs (CI-P3 → P-238) proves the runner-side lease handshake
#     against REAL Postgres: claim (`FOR UPDATE SKIP LOCKED`) + heartbeat-renew + the exactly-once
#     terminal report (`job.done` ON CONFLICT DO NOTHING → double-deliver buffers once). The
#     `FOR UPDATE SKIP LOCKED` lease is a Postgres contract — it MUST be proven on the live stack,
#     not mocked. Run: cargo test -p myelin-ci-sandbox --features integration.
# `cargo build --workspace` + the default `cargo test` stay DB-free AND VM-free.
integration = ["dep:myelin-config", "dep:sqlx", "dep:tokio"]

[dependencies.myelin-config]
path = "../myelin-config"
optional = true

[dependencies.sqlx]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dev-dependencies]
serde_json.workspace = true
# The `MonotonicMinter` (the `IdMinter` the unit tests build a `FlowExecutor` over to PROVE the
# runner's `job.done` reports onto the ONE engine signal path). Dev-dep ONLY — the production runner
# takes a caller-supplied executor; the minter is needed only to CONSTRUCT one in the unit tests.
# NO cycle: nothing in the production DAG depends back on myelin-ci-sandbox.
myelin-events = { path = "../myelin-events" }
