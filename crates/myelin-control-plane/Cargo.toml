[package]
name = "myelin-control-plane"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
integration = ["myelin-storage/integration"]

test-support = []
memory = ["test-support"]

[dependencies]
myelin-substrate = { path = "../myelin-substrate" }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
myelin-gdpr = { path = "../myelin-gdpr" }
myelin-storage = { path = "../myelin-storage" }
blake3 = { workspace = true }
hex = { workspace = true }
myelin-flow = { path = "../myelin-flow" }
tokio = { workspace = true }

[dev-dependencies]
myelin-control-plane = { path = ".", features = ["test-support"] }
myelin-substrate = { path = "../myelin-substrate", features = ["test-support"] }
myelin-config = { path = "../myelin-config" }
futures = { workspace = true }
sqlx = { workspace = true }
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-gdpr-service = { path = "../myelin-gdpr-service" }
myelin-harness = { path = "../myelin-harness" }
myelin-ci-sandbox = { path = "../myelin-ci-sandbox" }
