[package]
name = "myelin-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
myelin-refs = { path = "../myelin-refs" }
myelin-gdpr = { path = "../myelin-gdpr" }
serde.workspace = true
blake3.workspace = true
zeroize = "1"
hex.workspace = true
sha2.workspace = true
aes-gcm = "0.10"

sqlx.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-credential-types.workspace = true
fred.workspace = true
tokio.workspace = true
myelin-config.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[features]
default = []
nats = ["myelin-events/nats"]
integration = [
    "nats",
    "myelin-events/integration",
    "myelin-events/test-support",
]

test-support = ["myelin-events/test-support"]
memory = ["test-support"]

[dev-dependencies]
myelin-storage = { path = ".", features = ["test-support"] }
myelin-events = { path = "../myelin-events", features = ["test-support"] }
myelin-harness = { path = "../myelin-harness" }
toml.workspace = true
myelin-control-plane = { path = "../myelin-control-plane", features = ["test-support"] }
myelin-gdpr-service = { path = "../myelin-gdpr-service" }
myelin-search = { path = "../myelin-search" }
myelin-refs-service = { path = "../myelin-refs-service" }
futures = { workspace = true }
