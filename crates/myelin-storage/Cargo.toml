[package]
name = "myelin-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# myelin-storage is the STORAGE SUBSTRATE crate (architecture 05-…/storage.md §47-52, the
# "implementation crate" note: Storage's runtime code — the tier clients, KMS adapters,
# BlobStore impls, backup/restore machinery — lands in this new workspace crate). It is the
# harness-level seam the bootstrap harness (`serve(AppSpec)`) wires every subsystem through;
# it is NOT a per-subsystem data-access crate (architecture 00 §2.8: there is deliberately
# no shared storage-API crate spanning subsystems — each service owns its schema, the
# boundary is the no-cross-db lint). See the crate-level DEVIATION note in src/lib.rs.
#
# DAG position (architecture 00 §2.9, root-last): it sits below -gdpr/-client and ABOVE
# -substrate (the harness depends on the tier clients it wires). It depends on:
#   - myelin-tenancy   : TenantId / Region — the (tenant, region) partition key (12.1);
#   - myelin-identity  : Principal — the verified token the tenant is sourced FROM (12.1);
#   - myelin-events    : the outbox the OLTP DB co-locates (11.1; co-location body is P-ST-02);
#   - myelin-gdpr      : PersonalDataHolder — every store auto-registers as a holder (1.4/10.1).
# It MUST NOT depend on -client or -substrate (downstream); such an edge MUST NOT compile.
[dependencies]
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-identity = { path = "../myelin-identity" }
myelin-events = { path = "../myelin-events" }
myelin-gdpr = { path = "../myelin-gdpr" }
serde.workspace = true
# BlobStore (P-ST-03 / 11.2): BLAKE3 hash-on-write + re-hash-on-read integrity (a cited proven
# structure — VISION §4 / storage.md §11), `hex` renders the multihash digest into the
# self-describing content-address + the per-tenant fs key path.
blake3.workspace = true
hex.workspace = true
# SHA-256 verification for git-imported objects (P-ST-22 / 11.2 git pack tier). The BlobStore
# admits a `sha256:` multihash tag (P-ST-03); the git pack tier supplies the read-side verify
# for that tag so a corrupt git object is detected on read (0 silent serve, STOR-D7 on packs).
# RustCrypto `sha2` (FIPS-180-4) — never a hand-rolled hash (VISION §4 / EI-01 §7).
sha2.workspace = true
# The three-level KMS hierarchy (P-ST-06 / 11.3): the L2 DEK working keys are AES-256-GCM
# (storage.md §4). We use the vetted RustCrypto `aes-gcm` AEAD (NIST SP 800-38D) for the
# real wrap/unwrap envelope crypto rather than hand-rolling it (EI-01 §7: one primitive
# behind a narrow trait; "cite proven structures, do not hand-roll crypto"). The
# `getrandom` feature gives us `aead::OsRng` for key + nonce generation. The self-hostable
# engine seam (Vault-Transit-class) fronts this in-process software engine on this floor.
aes-gcm = "0.10"

# ------------------------------------------------------------------------------------------
# REAL backends behind the `integration` feature (Stage 1 / infra). OPTIONAL deps: the default
# `cargo build --workspace` compiles NONE of them, so the unit build stays DB-free. They are
# pulled only by `--features integration`, which carries the real-backend tests
# (tests/integration_*.rs) run against the docker-compose dev stack.
#   - sqlx            : the OLTP/outbox/ReBAC Postgres client (RUNTIME queries, no live-DB build);
#   - aws-sdk-s3      : the object-store BlobStore backing (RustFS/Scaleway, path-style);
#   - fred            : the Valkey/Redis backing for the Cache seam (cache.rs);
#   - tokio           : the async runtime the real clients need.
# ------------------------------------------------------------------------------------------
sqlx = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
fred = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
myelin-config = { workspace = true, optional = true }
# serde_json: (1) the OLAP live feed (olap_feed.rs, P-145) constructs the `*.snapshot`
# `SnapshotDraft.payload` (a `serde_json::Value`) it re-emits through the bus reindex seam — a
# pure-Rust JSON lib already in `myelin-events`' non-optional DAG, NOT a DB client, so it does not
# affect the DB-free build floor; (2) the pg.rs outbox stores the EventEnvelope as JSONB behind the
# `integration` feature. It is a normal (non-optional) dependency.
serde_json.workspace = true

[features]
default = []
# Pull the real Postgres + S3 + Valkey clients and compile the live-backend integration tests.
integration = [
    "dep:sqlx",
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-credential-types",
    "dep:fred",
    "dep:tokio",
    "dep:myelin-config",
    # The PgStore relay publishes through the events BusTransport, and the NATS bus impl lives
    # behind the events `integration` feature; the storage smoke test for the outbox→bus drain
    # needs it, so storage's integration feature turns on the events one transitively.
    "myelin-events/integration",
]

# MR-009b Wave 0 — the `test-support` cargo feature (alias `memory`). It exists to gate the
# in-memory durable-store DOUBLES (KMS engine, cost/erasure/post-pit ledgers, blob store, …) so
# DOWNSTREAM crates can enable them as a DEV-dependency: the doubles are consumed CROSS-CRATE in
# non-test lib code (e.g. `KmsEngine::new()` at ~90 sites), which `#[cfg(test)]` (crate-local) can
# NOT reach. It is EMPTY here in Wave 0 — the feature is established so later waves (2-7) gate the
# doubles behind `#[cfg(any(test, feature = "test-support"))]` and downstream dev-deps can turn it
# on; NO code moves behind it yet. The `no-in-memory-durable-store` scanner treats
# `feature = "test-support"` as a test-double gate (Wave 0). `memory` is a documented alias.
test-support = []
memory = ["test-support"]

# The failure-injection harness is TEST-SUPPORT only (the same posture as a service's
# main.rs / the harness's own dev usage). The IDOR + pool-saturation DRILLS read the
# contract-1.8 survival signal set (CrossTenantCount == 0, PoolSaturation) off the
# telemetry-assertion library. It is a dev-dependency ONLY — nothing in the production
# build path pulls myelin-harness into the storage crate's runtime DAG.
[dev-dependencies]
myelin-harness = { path = "../myelin-harness" }
# myelin-lints is TEST-SUPPORT only: the P-ST-08 encryption GATE drill
# (tests/encryption_gate_drill.rs) exercises the `no-untagged-personal-data` lint over an inline
# red (untagged PII scratch field fires) + green (tagged) fixture — the GATE's "a deliberately-
# untagged PII scratch field fires the lint, then remove it" step. The lint scanner is a pure
# function over source text (no live backend). It is a dev-dep ONLY — nothing in the storage
# crate's production DAG pulls myelin-lints (and myelin-lints does not depend on myelin-storage,
# so there is no cycle).
myelin-lints = { path = "../myelin-lints" }
# (serde_json is a normal [dependencies] entry — see above — so it is available to tests too.)
# toml is TEST-SUPPORT only: the STOR-D2 RPO drill (tests/stor_d2_rpo_drill.rs) reads its
# `rpo_max_mins` bound from the workspace-root `thresholds.toml` (the versioned source of
# truth, P-038) — NEVER a hardcoded magic number (EI-01 §3). It never enters the runtime DAG.
toml.workspace = true
# myelin-control-plane is a DEV-dependency ONLY: the contract-12.4 CDC pair
# (tests/cdc_12_4_storage_residency_report.rs, P-ST-15) proves Storage's per-store region REPORTS
# (the provider) feed the control plane's `residency_verify` (the consumer) that signs the
# no-global-pool attestation. The control plane already depends on myelin-storage (the normal
# DAG edge); a dev-dependency back is the CDC consumer reaching DOWN to its provider's test — a
# dev-only edge Cargo permits (it never enters the storage crate's production/runtime DAG, so no
# build cycle). This is the SAME posture as the myelin-lints / myelin-harness dev-deps above.
myelin-control-plane = { path = "../myelin-control-plane" }
# myelin-gdpr-service is a DEV-dependency ONLY: the E2E-4 holder-coverage CDC pair
# (tests/cdc_e2e4_holder_coverage.rs, P-ST-35) pins that storage's H1–H18 `HolderClass::ALL`
# catalogue (the PROVIDER of the storage-side crypto-shred reach) covers the orchestrator's
# storage-owned `orchestration::holder_ids` (the CONSUMER that drives the data-map fan-out). The
# two coverage proofs MUST agree. `myelin-gdpr-service` does NOT depend on `myelin-storage`, so a
# dev-dependency back is a CDC consumer reaching DOWN to its provider's test — no build cycle
# (the same posture as the myelin-control-plane / myelin-lints / myelin-harness dev-deps above).
myelin-gdpr-service = { path = "../myelin-gdpr-service" }
# myelin-search + myelin-refs-service are DEV-dependencies ONLY: the E2E-3 reindex-parity CDC pair
# (tests/cdc_e2e3_reindex_parity.rs, P-ST-36) confirms that storage's derived-store reindex-parity
# contribution (the PROVIDER — `DerivedStoreClass::ALL` = OLAP/Search/Refs, all cold-reindex==live
# with NO backup-restore path) AGREES with the REAL Search (`SearchReindexer` / SRCH-D5) and Refs
# (`RefsReindexer` / REF-D4) cold==live byte-parity drills (the CONSUMERS). Both crates already
# depend on `myelin-storage` (the normal DAG edge — they consume the KMS/holder substrate); a
# dev-dependency BACK is the CDC reaching DOWN to corroborate the real reindexers — a dev-only edge
# Cargo permits (it never enters the storage crate's production/runtime DAG, so no build cycle). The
# two proofs MEET; neither re-derives the other (the SAME posture as the myelin-gdpr-service /
# myelin-control-plane dev-deps above).
myelin-search = { path = "../myelin-search" }
myelin-refs-service = { path = "../myelin-refs-service" }
