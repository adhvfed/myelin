[package]
name = "myelin-outbox-publisher"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "myelin-outbox-publisher"
path = "src/main.rs"

[dependencies]
myelin-events = { path = "../myelin-events", features = ["nats"] }
myelin-storage = { path = "../myelin-storage", features = ["nats"] }
sqlx.workspace = true
tokio = { workspace = true, features = ["signal"] }

[features]
default = []
integration = ["myelin-events/integration", "myelin-storage/integration"]

[dev-dependencies]
myelin-identity = { path = "../myelin-identity" }
myelin-tenancy = { path = "../myelin-tenancy" }
serde_json.workspace = true
