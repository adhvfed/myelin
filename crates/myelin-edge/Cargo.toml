[package]
name = "myelin-edge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
myelin-identity = { path = "../myelin-identity" }
myelin-identity-service = { path = "../myelin-identity-service" }
myelin-substrate = { path = "../myelin-substrate" }
myelin-storage = { path = "../myelin-storage" }
myelin-config = { workspace = true }
myelin-tenancy = { path = "../myelin-tenancy" }
myelin-git = { path = "../myelin-git" }
myelin-issues = { path = "../myelin-issues" }
myelin-notif = { path = "../myelin-notif" }
myelin-agent = { path = "../myelin-agent" }
myelin-events = { path = "../myelin-events" }
myelin-ci-sandbox = { path = "../myelin-ci-sandbox" }
myelin-ci-controlplane = { path = "../myelin-ci-controlplane" }
myelin-flow = { path = "../myelin-flow" }
zeroize = "1"
serde = { workspace = true }
serde_json = { workspace = true }

percent-encoding = "2.3"

base64 = "0.22"

blake3.workspace = true

chrono = { version = "0.4", default-features = false, features = ["std"] }

hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful", "client-legacy"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "aws-lc-rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }

sqlx = { workspace = true, optional = true }

[dev-dependencies]
myelin-ci-controlplane = { path = "../myelin-ci-controlplane", features = ["test-support"] }
myelin-storage = { path = "../myelin-storage", features = ["test-support"] }
myelin-identity-service = { path = "../myelin-identity-service", features = ["test-support"] }
myelin-events = { path = "../myelin-events", features = ["test-support"] }
myelin-issues = { path = "../myelin-issues", features = ["test-support"] }
myelin-edge = { path = ".", features = ["test-support"] }
base64 = "0.22"

[features]
default = []
integration = ["myelin-storage/integration", "dep:sqlx"]
privileged-host-tests = ["myelin-ci-sandbox/privileged-host-tests"]
test-support = ["myelin-events/test-support"]
