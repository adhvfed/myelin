# Myelin CI — the committed gates run on every push / PR.
#
# The `architecture-lints` job is the EB-07 → P-019 deliverable: the twelve architecture lints
# (contract-index 1.6 / §2.11), including the Bus's owned `no-raw-publish` slice, wired in LOUD and
# NEVER SWALLOWED. The gate is the `lint-gate` binary's exit code (no `... || true`, no `continue-
# on-error`) plus the `myelin-lints` test suite (the fixture matrix + the CI-gate self-test that
# proves a red fixture makes the gate exit non-zero). A violation fails the job; doctrine EI-01 §5
# ("an uncommitted gate is no gate; make violations loud, never silently swallowed").
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Infra levers (NOT a code change): as the workspace grew (sandbox/aws-lc-sys/ring/sqlx + all the
  # M2/M3 crates) the standard GitHub runner began running OUT OF DISK while linking — the same
  # `collect2: ld terminated with signal 7 [Bus error]` / `No space left on device` the integration
  # workflow hit (see ~/myelin-handoff/03-infra-and-ci.md). debuginfo=0 is the big lever (debuginfo
  # is the bulk of the link size); CARGO_INCREMENTAL=0 keeps target/ small. Paired with a
  # free-disk-space step + rust-cache on the heavy compile jobs below.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  RUSTDOCFLAGS: "-C debuginfo=0"

jobs:
  edge-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: Build the locked, stripped, checksummed edge release bundle
        run: scripts/build-edge-release.sh
      - name: Upload the edge release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-release-${{ runner.arch }}
          path: target/release-bundles/*.tar.gz*
          if-no-files-found: error

  frontend:
    # The browser product is a production surface, not an optional build artifact. Run the complete
    # frontend workspace gate plus the real-browser suite against a real Valkey session backend.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      # Deterministic test-only key; deployments inject 32 random bytes from their secret manager.
      MYELIN_WEB_SESSION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install the locked frontend workspace
        run: pnpm install --frozen-lockfile
      - name: Lint every frontend package
        run: pnpm lint
      - name: Run component, server, and Valkey integration tests
        run: pnpm test
      - name: Build every frontend package for production
        run: pnpm build
      - name: Install the pinned Chromium browser and system dependencies
        run: pnpm --filter @myelin/web exec playwright install --with-deps chromium
      - name: Run the real-browser product suite
        run: pnpm --filter @myelin/web test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-results
          path: frontend/apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: myelin-web:ci
      SMOKE_CONTAINER: myelin-web-smoke
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build the digest-pinned production web image
        run: docker build --file frontend/apps/web/Dockerfile --tag "$IMAGE" .
      - name: Reject a production container without an explicit edge upstream
        run: |
          if docker run --rm \
            --env REDIS_URL=rediss://127.0.0.1:1 \
            --env MYELIN_WEB_SESSION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --env MYELIN_PUBLIC_ORIGIN=https://myelin.example \
            "$IMAGE"; then
            echo "production image started without MYELIN_EDGE_URL" >&2
            exit 1
          fi
      - name: Start the hardened production container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = node
          docker run --detach --name "$SMOKE_CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:3000:3000 \
            --env REDIS_URL=rediss://127.0.0.1:1 \
            --env MYELIN_WEB_SESSION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --env MYELIN_PUBLIC_ORIGIN=https://myelin.example \
            --env MYELIN_EDGE_URL=http://edge.internal:8080 \
            --env MYELIN_HSTS=1 \
            "$IMAGE"
      - name: Smoke liveness, readiness, ingress, assets, and SIGTERM
        run: |
          live=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail \
              --header 'x-forwarded-proto: https' \
              http://127.0.0.1:3000/healthz >/dev/null; then
              live=1
              break
            fi
            sleep 0.25
          done
          if [ "$live" -ne 1 ]; then
            docker logs "$SMOKE_CONTAINER"
            exit 1
          fi

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'x-forwarded-proto: https' http://127.0.0.1:3000/healthz)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'x-forwarded-proto: https' http://127.0.0.1:3000/readyz)" = 503
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/healthz)" = 308

          asset_path=$(docker exec "$SMOKE_CONTAINER" node -e \
            "const fs=require('node:fs');const f=fs.readdirSync('/app/public/_build/assets').find(n=>n.endsWith('.js'));if(!f)process.exit(1);console.log('/_build/assets/'+f)")
          asset_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'x-forwarded-proto: https' "http://127.0.0.1:3000${asset_path}")
          test "$asset_status" = 200

          docker stop --timeout 10 "$SMOKE_CONTAINER"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$SMOKE_CONTAINER")" = 0
      - name: Remove the smoke container
        if: always()
        run: |
          if docker inspect "$SMOKE_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$SMOKE_CONTAINER"
          fi

  architecture-lints:
    # The committed-lint ratchet (contract 1.6). LOUD: the gate is the binary exit code + the
    # myelin-lints tests; there is deliberately NO `|| true` / `continue-on-error` anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: The twelve architecture lints over the workspace source (loud, non-zero on any violation)
        run: cargo run -p myelin-lints --bin lint-gate
      - name: The lint fixture matrix + the CI-gate self-test (red-fixture ⇒ non-zero exit)
        run: cargo test -p myelin-lints

  contract-coverage:
    # The contract-coverage META-GATE (P-S21 → P-037). LOUD: the gate is the binary exit code —
    # it FAILS the workspace if any contract-index row claims a CDC pair it does not have, drops a
    # row silently, or defers a row without naming its landing prompt. There is deliberately NO
    # `|| true` / `continue-on-error`. Doctrine EI-01 §5 ("a contract violation dropped silently is
    # a multi-day misdiagnosis"). This is the meta-gate every later prompt's DEFINITION OF DONE
    # leans on (the contract-coverage scanner passes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: The contract-coverage scanner over the contract-index + manifest (loud, non-zero on any falsely-claimed row)
        run: cargo run -p myelin-lints --bin contract-coverage
      - name: The scanner self-test (red manifest fixture ⇒ non-zero exit; green ⇒ zero)
        run: cargo test -p myelin-lints --test contract_coverage_gate

  sub-m0-scorecard:
    # The M0 EXIT-GATE scorecard (P-S24 → P-039) — the consolidated band-boundary gate. LOUD:
    # the gate is the `sub-m0-scorecard` binary's exit code. It runs EVERY required SUB-M0 row's
    # proof command (the per-feature drills SUB-D1/D2/BUS-D4/D5/D7/D8/D9 + the twelve lints + the
    # contract-coverage scanner + the harness self-test), records each as a dated green artifact,
    # writes testing/scorecards/sub-m0.md, and EXITS NON-ZERO if any row is missing or claimed-
    # not-proven (the gate invariant: no later band runs over a red M0, master-sequencing §2 /
    # EI-01 §2). There is deliberately NO `|| true` / `continue-on-error`. The permanent gates
    # SUB-D1/D2/BUS-D4 re-run forever — a regression on any of them halts the run. The
    # scorecard_ratchet test proves dropping a row OR flipping it green-without-proof reds the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: The SUB-M0 exit-gate scorecard (runs every required drill; non-zero on any red/missing row)
        run: cargo run -p myelin-harness --bin sub-m0-scorecard
      - name: The scorecard ratchet meta-test (dropping a row OR green-without-proof reds the gate)
        run: cargo test -p myelin-harness --test scorecard_ratchet

  id-m1-scorecard:
    # The Identity M1 → M2 EXIT-GATE scorecard (P-079 / P-ID-21) — the consolidated cross-tenant /
    # fail-static / disabled-user go/no-go. LOUD: the gate is the `id-m1-scorecard` binary's exit
    # code. It RE-RUNS (does not re-implement) every required M1 Id drill's proof command — ID-D3
    # (cross-tenant 0), ID-D2 (fail-static), ID-D1 (disabled-in-5-min), ID-D4 (leak-free pre-filter
    # incl. the S8 JOIN), ID-D7 (watermark), ID-D5 (delegation intersection), ID-D6 (token-crash),
    # ID-D8 (restore) — plus the contract-coverage 4.1–4.11 re-affirm, records each as a dated green
    # artifact, writes testing/scorecards/id-m1.md, and EXITS NON-ZERO if any row is missing or
    # claimed-not-proven (the gate invariant: M2/the reactive layer does not run over a red M1 Id
    # gate, master-sequencing §2 / EI-01 §2). There is deliberately NO `|| true` / `continue-on-
    # error`. The M5-hardening floor (ID-D9 30× surge + multi-cell → P-ID-31/P-ID-35) is a named,
    # visible deferral — Id is *correct* at M1, *hardened* at M5. The id_m1_scorecard_ratchet test
    # proves dropping a drill OR flipping it green-without-proof reds the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: The Id M1→M2 exit-gate scorecard (re-runs every M1 Id drill; non-zero on any red/missing row)
        run: cargo run -p myelin-harness --bin id-m1-scorecard
      - name: The Id-M1 scorecard ratchet meta-test (dropping a drill OR green-without-proof reds the gate)
        run: cargo test -p myelin-harness --test id_m1_scorecard_ratchet

  self-hosting-ci:
    # The Myelin SELF-HOSTING CI graph — the DOGFOOD loop (P-507 / P-S37 → M6, SUB-M6). LOUD:
    # the gate is the `self-hosting-ci` binary's exit code. It runs the substrate ratchet AS
    # Myelin CI jobs on Myelin's OWN commit — the twelve architecture lints + the contract-coverage
    # scanner + the mandatory-core cargo-mutants mutation gate (the `.cargo/mutants.toml` surface:
    # outbox/relay/consumer/dedup + ResilientClient + FailStatic + the shed lane) — and the harness
    # DRIVES the substrate's surge/restore/migration drills (SUB-D3/D6/D10). It writes
    # testing/scorecards/self-hosting-ci.md and EXITS NON-ZERO if ANY job is red (a deliberately-
    # violating commit — a lint red, a surviving mutant, a red drill — is rejected; the ratchet
    # rejects on Myelin's own work, EI-01 §5). There is deliberately NO `|| true` / `continue-on-
    # error`. The dogfood meta-test proves the graph carries the ratchet AND that a violating commit
    # reds the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: Install cargo-mutants (the mandatory-core mutation gate tool)
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: The dogfood meta-test (the graph carries the ratchet; a violating commit reds the gate)
        run: cargo test -p myelin-harness --test self_hosting_ci_dogfood
      - name: The self-hosting CI graph on Myelin's own commit (lints + scanner + mutation gate + SUB-D3/D6/D10; non-zero on any red)
        run: cargo run -p myelin-harness --bin self-hosting-ci

  build-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Reclaim ~25GB on the runner (dotnet/android/ghc) so the workspace link does not run out of
      # disk — see the env: note above. Loud-but-non-fatal so a tooling hiccup never fails the gate.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-07-20
        with:
          tool-cache: false
          large-packages: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
          components: clippy
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
