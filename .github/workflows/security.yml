name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-scan unchanged lockfiles when advisory databases gain new entries.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
        with:
          toolchain: stable
      - name: Install the pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Reject vulnerable Cargo.lock dependencies
        run: cargo audit

  pnpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reject moderate-or-higher pnpm lockfile vulnerabilities
        run: pnpm audit --audit-level moderate
