[workspace]
resolver = "2"
members = [
    "crates/myelin-tenancy",
    "crates/myelin-identity",
    # The Identity SERVICE crate (P-ID-04 → P-054): the bootable service SHELL the harness wires
    # (boot → migrate → relay → consumers → three ports → graceful drain; liveness ≠ readiness;
    # fail-closed check/list_objects slots until the M1 bodies land). This is the "every service
    # `main.rs`" consumer the contract-index row 1.1 names — the FIRST such service. Like
    # myelin-harness and myelin-lints it is a LEAF consumer ABOVE myelin-substrate (the root-last
    # harness): it depends on the harness (serve/AppSpec) + the frozen identity contract surface,
    # and NOTHING in the production crate DAG depends on it. It is therefore OUTSIDE the
    # eleven-crate library DAG modelled by crate_graph.rs (substrate_is_root() — "no *library*
    # crate depends on substrate" — is preserved; a service main is the harness's terminal
    # consumer). See the crate-level note in crates/myelin-identity-service/src/lib.rs.
    "crates/myelin-identity-service",
    "crates/myelin-events",
    "crates/myelin-refs",
    # The myelin-search SERVICE crate skeleton (SRCH-P01 → P-021). Search owns NO contract
    # crate (architecture §0/§1: it is overwhelmingly a CONSUMER — it composes myelin-query,
    # myelin-identity, myelin-events, myelin-gdpr, myelin-content and holds only derived,
    # reconstructible state). At M0 this crate carries ONLY the index-document NAME ANCHORS
    # (the field/unit names aligned to the frozen EventEnvelope (2.1) + ArtifactRef (5.1), no
    # mechanism) + the names/units drift test. The engine, the index backends, and the
    # permission-aware query pipeline (the path the search-requires-acl-filter lint guards)
    # land in M2 (SRCH-P03..SRCH-P16). It sits in the consumer tier of the §2.9 DAG: it
    # depends on -tenancy/-events/-identity and MUST NOT be depended on by them.
    "crates/myelin-search",
    "crates/myelin-content",
    "crates/myelin-query",
    "crates/myelin-agent",
    "crates/myelin-gdpr",
    # The GDPR/Audit SERVICE crate (P-GA-19 → P-062): the tamper-evident audit log core — the
    # outbox-only audit CONSUMER + the per-tenant hash-chain + the Merkle leaves + the
    # minimisation (contract 10.6, the construction half; the proofs/STH/witness are P-119). Like
    # myelin-identity-service it is a SERVICE crate — a LEAF consumer ABOVE myelin-events /
    # -identity / -tenancy; it consumes the frozen bus + identity + tenancy surfaces and NOTHING
    # in the production library DAG depends back on it (substrate_is_root() in crate_graph.rs is
    # preserved — a service is the graph's terminal consumer, OUTSIDE the eleven-crate library
    # DAG). The DSR orchestrator + the GDPR-owned holders come to live here in M1
    # (P-GA-05/-06/-11). See the crate-level note in crates/myelin-gdpr-service/src/lib.rs.
    "crates/myelin-gdpr-service",
    # The proc-macro half of the GDPR classify-derive (contract 10.2; P-GA-02 → P-050). A
    # `proc-macro = true` crate may export ONLY procedural macros, so the `#[personal_data]`
    # attribute lives here while the five-tag enum TYPES it references live in `myelin-gdpr`,
    # which re-exports the attribute. It is a leaf BELOW myelin-gdpr in the §2.9 DAG (no myelin
    # deps); only myelin-gdpr depends on it.
    "crates/myelin-gdpr-macros",
    "crates/myelin-client",
    # The Git-hosting SUBSYSTEM crate (GIT-P3 → P-063). At M1 it carries ONLY the
    # PersonalDataHolder H1 INTENT (architecture 00-overview §1.1, 03 §6) + the
    # #[personal_data(...)] classification tags on the skeletal git schema (01 §4.3/§4.5) so the
    # no-untagged-personal-data lint (contract 10.2 / 1.6) is green from the first migration
    # (GIT-P8). It is a LEAF SUBSYSTEM consumer ABOVE the glue crates (depends on -gdpr/-tenancy/
    # -identity) and is NOT a node in the eleven-crate library DAG modelled by
    # myelin-substrate::crate_graph (like the service crates) — nothing in the production DAG
    # depends back on it; substrate_is_root()/identity_is_sink() are preserved. The holder is
    # OPENED + auto-registered by serve in GIT-P8 (M3-G1); no git feature ships at P-063.
    "crates/myelin-git",
    # The Issue-tracker SUBSYSTEM crate (ISS-P01 → P-125 / M1). The most cross-subsystem-coupled
    # consumer subsystem (architecture issue-tracker 00-overview §1). At M1 it carries ONLY the
    # "freeze-so-dependents-compile" slice (roadmap §3.0): the frozen Issues ReBAC namespace fragment
    # (contract 4.9 — the `issue` namespace + the `- confidential` set-difference userset + `watcher`
    # + the field/transition ABAC sub-objects) Identity compiles into the one cell schema, PLUS the
    # H3 holder INTENT + the #[personal_data(...)] classification tags on the skeletal issue schema
    # (contract 10.2 — incl. the OQ-H worklog/productivity behavioural tags, basis = TBD_LEGAL) so
    # the no-untagged-personal-data lint (contract 1.6) is GREEN from the first migration (ISS-P05).
    # Like the other subsystem/service crates (myelin-git, myelin-identity-service) it is a LEAF
    # CONSUMER above the glue crates (depends on -identity/-gdpr/-tenancy) and is NOT a node in the
    # eleven-crate library DAG modelled by crate_graph.rs — nothing in the production DAG depends back
    # on it; substrate_is_root()/identity_is_sink() are preserved. No Issues FEATURE ships at P-125;
    # the holder is OPENED + auto-registered by serve in ISS-P07. See crates/myelin-issues/src/lib.rs.
    "crates/myelin-issues",
    # The Refs SERVICE/SUBSYSTEM crate (REF-P3 → P-120). Distinct from the `myelin-refs` GLUE
    # crate (the ArtifactRef value type + #sub codec, a MODELLED node in the eleven-crate library
    # DAG that MUST NOT depend on -gdpr). Like the other service/subsystem crates
    # (myelin-identity-service, myelin-gdpr-service, myelin-git) it is a LEAF CONSUMER above the
    # glue crates: it depends on -gdpr (PersonalDataHolder) / -substrate (the holder registry +
    # H1–H18 catalog) / -refs (the value type) / -tenancy / -identity, and NOTHING in the
    # production library DAG depends back on it (so substrate_is_root()/identity_is_sink() in
    # crate_graph.rs are preserved — a subsystem crate is the graph's terminal consumer, OUTSIDE
    # the modelled DAG). At REF-P3 it carries ONLY the Refs PersonalDataHolder registration (H12,
    # a STUB surface — locate/export empty-but-correct, restrict/erase no-ops) + the residency-pin
    # confirmation. The edge schema (REF-P5), the per-tenant DEK pin (REF-P4), the builder/
    # invalidator consumers (REF-P6/P7) and the real erasure body (REF-P15) land here in M1/M2.
    "crates/myelin-refs-service",
    # The Notifications crate (NOTIF-P1 → P-127, M2). Notif owns ZERO new contracts vs Phase 3
    # (architecture notifications.md §0/§1.2 — it is overwhelmingly a CONSUMER), so it carries no
    # separate glue crate; THIS crate plays both roles at the leaf of the §2.9 DAG: (1) the §4.1
    # EXPOSED contract CARRIERS (InboxItem / HumanisedString / the reason+class enums / the
    # DeliveryAdapter trait SHAPE — compile-time carriers so a contract change breaks every
    # consumer's build NOW, ADR-01), and (2) the SERVICE SHELL (an AppSpec passed to
    # serve(AppSpec) — boot → migrate → relay → three ports → drain, liveness≠readiness, empty
    # migration set + empty consumer seam). Like the other service/subsystem crates it is a LEAF
    # CONSUMER above the glue crates (depends on -tenancy/-events/-identity/-refs/-substrate) and
    # is NOT a node in the eleven-crate library DAG modelled by crate_graph.rs — nothing in the
    # production DAG depends back on it; substrate_is_root()/identity_is_sink() are preserved. The
    # data model (NOTIF-P2), the Signal-consumer router (NOTIF-P3), and the holder (NOTIF-P4) are
    # the named floors. See the crate-level note in crates/myelin-notif/src/lib.rs.
    "crates/myelin-notif",
    # The Chat SUBSYSTEM crate (CHAT-P1 → P-128, M2). Chat is the MAXIMAL CONSUMER subsystem
    # (architecture chat 00-overview §2.1). At CHAT-P1 it carries ONLY the M2-C0
    # "freeze-so-dependents-compile" taxonomy slice: the COMPLETE `chat.*` event-token list
    # (architecture 03 §1.1/§1.2) split into the DURABLE-via-outbox set vs the FIREHOSE-only set,
    # each token PROVEN grammatical against the one Bus validator (EB-02/P-042) — chat REGISTERS
    # its list; it does NOT author the grammar (the names anchor X-5). Like the other
    # subsystem/service crates (myelin-git, myelin-issues, myelin-notif) it is a LEAF CONSUMER
    # above the glue crates (depends on -events) and is NOT a node in the eleven-crate library DAG
    # modelled by crate_graph.rs — nothing in the production DAG depends back on it;
    # substrate_is_root()/identity_is_sink() are preserved. No chat FEATURE ships at P-128: the
    # durable set's emit behaviour begins in CHAT-P5, the firehose set's in CHAT-P10. See the
    # crate-level note in crates/myelin-chat/src/lib.rs.
    "crates/myelin-chat",
    # The CI SANDBOX crate (CI-P1 → P-129, M2). The runner/backend home: the JobSpec struct
    # (the "one struct, two kinds" seam, kind ∈ {Ci, Agent}), the SandboxBackend / FleetProvider
    # trait SHAPES (no backend impl — Firecracker is CI-P2/P-237, gVisor is CI-P28), and the
    # four-uniform-guarantee wiring SEAM (reserve/settle 11.7, mint_run_token 4.7, HITL-withhold
    # routing note, isolation-floor hook). ToolHands::exec (8.4) IS launch(JobSpec{kind:Agent}) —
    # the equivalence wired here so the agent fabric (AG-P8/P-226) dispatches onto this exact
    # runner. Like the other subsystem crates it is a LEAF CONSUMER above the glue crates (depends
    # on -tenancy for Region) and is NOT a node in the eleven-crate library DAG modelled by
    # crate_graph.rs — nothing in the production DAG depends back on it; substrate_is_root() /
    # identity_is_sink() are preserved. cargo build --workspace stays DB-free (this is a pure
    # value/trait crate; no DB/object-store/cache/bus contract is touched at P-129). See the
    # crate-level note in crates/myelin-ci-sandbox/src/lib.rs.
    "crates/myelin-ci-sandbox",
    # The storage SUBSTRATE crate (P-ST-01 → P-007): the OLTP tier client (harness pool +
    # (tenant, region) RLS guard), and — in later prompts — the KMS hierarchy + BlobStore
    # impls + backup/restore machinery. Sits below -gdpr/-client and ABOVE -substrate in
    # the §2.9 root-last DAG (the harness depends on the tier client it wires). See the
    # crate-level DEVIATION note in crates/myelin-storage/src/lib.rs (this node extends the
    # §2.9 ten-crate DAG; the architecture §2.8 "no shared storage-API crate" is preserved
    # because this is the harness-wired mechanism, not a cross-subsystem data-access crate).
    "crates/myelin-storage",
    # The Tenancy control-plane SERVICE crate (P-CP-05 → P-080): the three PII-free registry
    # tables (`cell` / `tenant_placement` / `cell_provisioning`) + the per-cell `local_tenant`
    # directory + the HARD placement invariant (multi-cell single-region by construction). Like
    # the other service/subsystem crates it is a LEAF consumer ABOVE the glue crates (depends on
    # -substrate/-tenancy/-gdpr) and is NOT a node in the eleven-crate library DAG modelled by
    # crate_graph.rs — nothing in the production DAG depends back on it; substrate_is_root() is
    # preserved. See the crate-level note in crates/myelin-control-plane/src/lib.rs.
    "crates/myelin-control-plane",
    "crates/myelin-substrate",
    # Test-support failure-injection harness (P-S02..P-S04). NOT a node in the production
    # crate DAG (architecture §2.9) — it sits above myelin-substrate as a leaf consumer and
    # nothing depends on it. See crates/myelin-harness/Cargo.toml.
    "crates/myelin-harness",
    # The architecture-lint ratchet (P-S10 → P-017: the four load-bearing lints;
    # P-S11 → P-018 completes the twelve). NOT a node in the production crate DAG
    # (architecture §2.9) — like myelin-harness it is a leaf test-support crate; NO
    # production crate depends on it. It ships the §2.11 / contract-1.6 lints as
    # cargo-level source-scanning checks (red + green fixtures) run as CI jobs over the
    # workspace source + the fixture matrix. See crates/myelin-lints/Cargo.toml.
    "crates/myelin-lints",
    # The env-driven CONFIG layer (Stage 1 / infra): the dev<->prod CONFIG SWAP seam. Reads the
    # standard-interface endpoints (DATABASE_URL, S3_*, REDIS_URL, NATS_URL, MYELIN_REGION) from
    # the environment so moving from the docker-compose dev stack to Scaleway (fr-par) is a
    # config change, not a code change. A LEAF, zero-myelin-dep, zero-client-dep crate — it
    # keeps `cargo build --workspace` DB-free; the real backend clients live behind the
    # `integration` feature in the crates that own the trait impls.
    "crates/myelin-config",
]

# Workspace-wide dependency versions. Pinned once here so every glue crate shares
# the exact same shape of serde_json::Value behind EventEnvelope.payload
# (architecture 00 §2.1, the references-not-payloads rule) and a single ULID/time
# representation. Kept to a tiny, zero-feature set — this is the skeleton (P-001);
# real impl deps land with the prompts that fill the stubbed bodies.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The versioned thresholds file (P-S22 / P-038) is a TOML config source every M0 drill reads
# its quantified threshold from. `toml` (de)serializes it; preserve-order is irrelevant here
# (the file is keyed, not positional), so the default feature set is enough.
toml = "0.8"
# BLAKE3 is the content-address hash for the BlobStore (P-ST-03 / contract 11.2): hash-on-write,
# re-hash-on-read integrity. A cited, proven structure (BLAKE3 2020; storage.md §11) — VISION §4
# (cite proven structures, do not hand-roll a hash). `hex` renders the multihash digest into the
# self-describing content-address string + the fs key path.
blake3 = "1"
hex = "0.4"
# The proc-macro toolchain for the `#[derive(PersonalData)]` classify-derive BODY (contract 10.2,
# P-GA-07 / P-107): parse the tagged struct + its `#[personal_data(...)]` helper args (syn), emit
# the generated registry entry + the structural `subject_locator` accessor (quote). `full` is not
# needed — we parse a `DeriveInput` (a struct) and field attributes, not whole expressions; the
# default `derive` + `parsing` + `proc-macro` features cover it. proc-macro2 carries the Span type.
syn = { version = "2", default-features = false, features = ["derive", "parsing", "proc-macro", "printing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# ----------------------------------------------------------------------------------------------
# REAL-BACKEND CLIENTS (Stage 1 / infra). Declared here once for a single pinned shape, but
# referenced ONLY behind the `integration` cargo feature in the crates that own the trait impls
# (BlobStore in -storage, BusTransport in -events, the OLTP client + outbox + ReBAC tuple store
# in -substrate/-storage/-identity). A workspace.dependencies entry compiles NOTHING on its own —
# it is pulled only by a crate that lists it under `[dependencies]`/an optional dep. So the
# default `cargo build --workspace` stays DB-FREE; only `--features integration` pulls these.
# ----------------------------------------------------------------------------------------------

# OLTP client. sqlx with RUNTIME-checked queries (sqlx::query / query_as — NOT the query!
# compile-time macros), so the build never needs a live DB. rustls (no system OpenSSL),
# migrate for the forward-only DDL, uuid/chrono for the tuple/audit columns.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }
# async runtime for the real-backend tests/impls.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

# Object store: aws-sdk-s3 against a custom endpoint + path-style addressing (RustFS/Scaleway).
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
# rustls-aware HTTP client (no system OpenSSL) — required so put/get actually dispatch over HTTP.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
aws-credential-types = "1"

# Cache: Valkey/Redis via fred.
fred = { version = "10", default-features = false, features = ["i-std"] }

# Durable bus: NATS JetStream via async-nats.
async-nats = "0.38"
# Stream combinators (StreamExt) for draining the NATS JetStream pull-consumer batch. A tiny,
# default-feature `futures` — pulled ONLY behind the events `integration` feature (the NATS bus).
futures = "0.3"

# The env-config layer (the dev<->prod swap seam).
myelin-config = { path = "crates/myelin-config" }

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
