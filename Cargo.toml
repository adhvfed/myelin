[workspace]
resolver = "2"
members = [
    "crates/myelin-tenancy",
    "crates/myelin-identity",
    # The Identity SERVICE crate (P-ID-04 → P-054): the bootable service SHELL the harness wires
    # (boot → migrate → relay → consumers → three ports → graceful drain; liveness ≠ readiness;
    # fail-closed check/list_objects slots until the M1 bodies land). This is the "every service
    # `main.rs`" consumer the contract-index row 1.1 names — the FIRST such service. Like
    # myelin-harness and myelin-lints it is a LEAF consumer ABOVE myelin-substrate (the root-last
    # harness): it depends on the harness (serve/AppSpec) + the frozen identity contract surface,
    # and NOTHING in the production crate DAG depends on it. It is therefore OUTSIDE the
    # eleven-crate library DAG modelled by crate_graph.rs (substrate_is_root() — "no *library*
    # crate depends on substrate" — is preserved; a service main is the harness's terminal
    # consumer). See the crate-level note in crates/myelin-identity-service/src/lib.rs.
    "crates/myelin-identity-service",
    "crates/myelin-events",
    "crates/myelin-refs",
    # The myelin-search SERVICE crate skeleton (SRCH-P01 → P-021). Search owns NO contract
    # crate (architecture §0/§1: it is overwhelmingly a CONSUMER — it composes myelin-query,
    # myelin-identity, myelin-events, myelin-gdpr, myelin-content and holds only derived,
    # reconstructible state). At M0 this crate carries ONLY the index-document NAME ANCHORS
    # (the field/unit names aligned to the frozen EventEnvelope (2.1) + ArtifactRef (5.1), no
    # mechanism) + the names/units drift test. The engine, the index backends, and the
    # permission-aware query pipeline (the path the search-requires-acl-filter lint guards)
    # land in M2 (SRCH-P03..SRCH-P16). It sits in the consumer tier of the §2.9 DAG: it
    # depends on -tenancy/-events/-identity and MUST NOT be depended on by them.
    "crates/myelin-search",
    "crates/myelin-content",
    "crates/myelin-query",
    "crates/myelin-agent",
    "crates/myelin-gdpr",
    # The GDPR/Audit SERVICE crate (P-GA-19 → P-062): the tamper-evident audit log core — the
    # outbox-only audit CONSUMER + the per-tenant hash-chain + the Merkle leaves + the
    # minimisation (contract 10.6, the construction half; the proofs/STH/witness are P-119). Like
    # myelin-identity-service it is a SERVICE crate — a LEAF consumer ABOVE myelin-events /
    # -identity / -tenancy; it consumes the frozen bus + identity + tenancy surfaces and NOTHING
    # in the production library DAG depends back on it (substrate_is_root() in crate_graph.rs is
    # preserved — a service is the graph's terminal consumer, OUTSIDE the eleven-crate library
    # DAG). The DSR orchestrator + the GDPR-owned holders come to live here in M1
    # (P-GA-05/-06/-11). See the crate-level note in crates/myelin-gdpr-service/src/lib.rs.
    "crates/myelin-gdpr-service",
    # The proc-macro half of the GDPR classify-derive (contract 10.2; P-GA-02 → P-050). A
    # `proc-macro = true` crate may export ONLY procedural macros, so the `#[personal_data]`
    # attribute lives here while the five-tag enum TYPES it references live in `myelin-gdpr`,
    # which re-exports the attribute. It is a leaf BELOW myelin-gdpr in the §2.9 DAG (no myelin
    # deps); only myelin-gdpr depends on it.
    "crates/myelin-gdpr-macros",
    "crates/myelin-client",
    # The Git-hosting SUBSYSTEM crate (GIT-P3 → P-063). At M1 it carries ONLY the
    # PersonalDataHolder H1 INTENT (architecture 00-overview §1.1, 03 §6) + the
    # #[personal_data(...)] classification tags on the skeletal git schema (01 §4.3/§4.5) so the
    # no-untagged-personal-data lint (contract 10.2 / 1.6) is green from the first migration
    # (GIT-P8). It is a LEAF SUBSYSTEM consumer ABOVE the glue crates (depends on -gdpr/-tenancy/
    # -identity) and is NOT a node in the eleven-crate library DAG modelled by
    # myelin-substrate::crate_graph (like the service crates) — nothing in the production DAG
    # depends back on it; substrate_is_root()/identity_is_sink() are preserved. The holder is
    # OPENED + auto-registered by serve in GIT-P8 (M3-G1); no git feature ships at P-063.
    "crates/myelin-git",
    # The storage SUBSTRATE crate (P-ST-01 → P-007): the OLTP tier client (harness pool +
    # (tenant, region) RLS guard), and — in later prompts — the KMS hierarchy + BlobStore
    # impls + backup/restore machinery. Sits below -gdpr/-client and ABOVE -substrate in
    # the §2.9 root-last DAG (the harness depends on the tier client it wires). See the
    # crate-level DEVIATION note in crates/myelin-storage/src/lib.rs (this node extends the
    # §2.9 ten-crate DAG; the architecture §2.8 "no shared storage-API crate" is preserved
    # because this is the harness-wired mechanism, not a cross-subsystem data-access crate).
    "crates/myelin-storage",
    # The Tenancy control-plane SERVICE crate (P-CP-05 → P-080): the three PII-free registry
    # tables (`cell` / `tenant_placement` / `cell_provisioning`) + the per-cell `local_tenant`
    # directory + the HARD placement invariant (multi-cell single-region by construction). Like
    # the other service/subsystem crates it is a LEAF consumer ABOVE the glue crates (depends on
    # -substrate/-tenancy/-gdpr) and is NOT a node in the eleven-crate library DAG modelled by
    # crate_graph.rs — nothing in the production DAG depends back on it; substrate_is_root() is
    # preserved. See the crate-level note in crates/myelin-control-plane/src/lib.rs.
    "crates/myelin-control-plane",
    "crates/myelin-substrate",
    # Test-support failure-injection harness (P-S02..P-S04). NOT a node in the production
    # crate DAG (architecture §2.9) — it sits above myelin-substrate as a leaf consumer and
    # nothing depends on it. See crates/myelin-harness/Cargo.toml.
    "crates/myelin-harness",
    # The architecture-lint ratchet (P-S10 → P-017: the four load-bearing lints;
    # P-S11 → P-018 completes the twelve). NOT a node in the production crate DAG
    # (architecture §2.9) — like myelin-harness it is a leaf test-support crate; NO
    # production crate depends on it. It ships the §2.11 / contract-1.6 lints as
    # cargo-level source-scanning checks (red + green fixtures) run as CI jobs over the
    # workspace source + the fixture matrix. See crates/myelin-lints/Cargo.toml.
    "crates/myelin-lints",
]

# Workspace-wide dependency versions. Pinned once here so every glue crate shares
# the exact same shape of serde_json::Value behind EventEnvelope.payload
# (architecture 00 §2.1, the references-not-payloads rule) and a single ULID/time
# representation. Kept to a tiny, zero-feature set — this is the skeleton (P-001);
# real impl deps land with the prompts that fill the stubbed bodies.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The versioned thresholds file (P-S22 / P-038) is a TOML config source every M0 drill reads
# its quantified threshold from. `toml` (de)serializes it; preserve-order is irrelevant here
# (the file is keyed, not positional), so the default feature set is enough.
toml = "0.8"
# BLAKE3 is the content-address hash for the BlobStore (P-ST-03 / contract 11.2): hash-on-write,
# re-hash-on-read integrity. A cited, proven structure (BLAKE3 2020; storage.md §11) — VISION §4
# (cite proven structures, do not hand-roll a hash). `hex` renders the multihash digest into the
# self-describing content-address string + the fs key path.
blake3 = "1"
hex = "0.4"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
