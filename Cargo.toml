[workspace]
resolver = "2"
members = [
    "crates/myelin-tenancy",
    "crates/myelin-identity",
    "crates/myelin-identity-service",
    "crates/myelin-events",
    "crates/myelin-refs",
    "crates/myelin-search",
    "crates/myelin-content",
    "crates/myelin-query",
    "crates/myelin-knowledge",
    "crates/myelin-agent",
    "crates/myelin-agent-service",
    "crates/myelin-agent-model",
    "crates/myelin-gdpr",
    "crates/myelin-gdpr-service",
    "crates/myelin-gdpr-macros",
    "crates/myelin-client",
    "crates/myelin-git",
    "crates/myelin-issues",
    "crates/myelin-refs-service",
    "crates/myelin-notif",
    "crates/myelin-flow",
    "crates/myelin-chat",
    "crates/myelin-chat-gateway",
    "crates/myelin-ci-sandbox",
    "crates/myelin-ci-dispatch",
    "crates/myelin-outbox-publisher",
    "crates/myelin-ci-controlplane",
    "crates/myelin-storage",
    "crates/myelin-migration-audit",
    "crates/myelin-control-plane",
    "crates/myelin-substrate",
    "crates/myelin-edge",
    "crates/myelin-harness",
    "crates/myelin-lints",
    "crates/myelin-config",
    "crates/myelin-cli",
    "crates/myelin-mcp",
    "crates/myelin-agent-host",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
hex = "0.4"
siphasher = "1.0.3"
sha2 = "0.10"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "proc-macro", "printing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

tantivy = "0.26"

yrs = "0.27"

git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"

aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
aws-credential-types = "1"

fred = { version = "10", default-features = false, features = ["i-std"] }

async-nats = "0.47"
futures = "0.3"

myelin-config = { path = "crates/myelin-config" }

[workspace.package]
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
