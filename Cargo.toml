[workspace]
resolver = "2"
members = [
    "crates/myelin-tenancy",
    "crates/myelin-identity",
    "crates/myelin-events",
    "crates/myelin-refs",
    "crates/myelin-content",
    "crates/myelin-query",
    "crates/myelin-agent",
    "crates/myelin-gdpr",
    "crates/myelin-client",
    # The storage SUBSTRATE crate (P-ST-01 → P-007): the OLTP tier client (harness pool +
    # (tenant, region) RLS guard), and — in later prompts — the KMS hierarchy + BlobStore
    # impls + backup/restore machinery. Sits below -gdpr/-client and ABOVE -substrate in
    # the §2.9 root-last DAG (the harness depends on the tier client it wires). See the
    # crate-level DEVIATION note in crates/myelin-storage/src/lib.rs (this node extends the
    # §2.9 ten-crate DAG; the architecture §2.8 "no shared storage-API crate" is preserved
    # because this is the harness-wired mechanism, not a cross-subsystem data-access crate).
    "crates/myelin-storage",
    "crates/myelin-substrate",
    # Test-support failure-injection harness (P-S02..P-S04). NOT a node in the production
    # crate DAG (architecture §2.9) — it sits above myelin-substrate as a leaf consumer and
    # nothing depends on it. See crates/myelin-harness/Cargo.toml.
    "crates/myelin-harness",
    # The architecture-lint ratchet (P-S10 → P-017: the four load-bearing lints;
    # P-S11 → P-018 completes the twelve). NOT a node in the production crate DAG
    # (architecture §2.9) — like myelin-harness it is a leaf test-support crate; NO
    # production crate depends on it. It ships the §2.11 / contract-1.6 lints as
    # cargo-level source-scanning checks (red + green fixtures) run as CI jobs over the
    # workspace source + the fixture matrix. See crates/myelin-lints/Cargo.toml.
    "crates/myelin-lints",
]

# Workspace-wide dependency versions. Pinned once here so every glue crate shares
# the exact same shape of serde_json::Value behind EventEnvelope.payload
# (architecture 00 §2.1, the references-not-payloads rule) and a single ULID/time
# representation. Kept to a tiny, zero-feature set — this is the skeleton (P-001);
# real impl deps land with the prompts that fill the stubbed bodies.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
