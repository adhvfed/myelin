
[[asset]]
id = "linux-rust-v1"
capability = "rust"
covers_job = "build-test-clippy"
stage_script = "scripts/build-rust-rootfs.sh"
env_var = "MYELIN_GVISOR_RUST_ROOTFS"
default_path = "~/.local/share/gvisor-assets/rust-rootfs"
source_image = "rust:1.95-slim-bookworm"
source_image_digest = "sha256:d7482085ff5b415f84dba5647ae71606650bdef00db7aeb69f4b3d170c3e4082"
canonical_tree_sha256 = "e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
image = "myelin.local/linux-rust-v1-rootfs@sha256:e6684d70e026a1433a7e32e2d29c100468d08579ef532834fdd27d4808c35a60"
note = "Exported from the pinned Debian Rust image rather than assembled from host libraries. crates/myelin-ci-sandbox/tests/rust_capable_rootfs_prod_exec_test.rs checks rustc and cargo under runsc as a non-root user without network egress. The production gVisor registry includes this asset, but no dispatched job selects it yet."

[[asset]]
id = "git-v1"
capability = "checkout"
covers_job = "build-test-clippy"
stage_script = "scripts/stage-git-rootfs.sh"
env_var = "MYELIN_GVISOR_GIT_ROOTFS"
default_path = "~/.local/share/gvisor-assets/git-rootfs"
source_image = "host-git:2.54.0"
source_image_digest = "sha256:bb6007e89e15dad35cf623a203db26dde9e042cb2df844320055cad3cd2eb5d0"
canonical_tree_sha256 = "0ac70764ba20a043d19933213d60070c7f8712947a86753bab518569df302646"
image = "myelin.local/git-v1-rootfs@sha256:0ac70764ba20a043d19933213d60070c7f8712947a86753bab518569df302646"
note = "Founder-dogfood git-bearing rootfs used for exact-commit checkout and git wire. The shared tree is read-only to OCI workloads, all mount targets are precreated and empty, registry construction pins the complete content, and each git execution re-verifies the same canonical digest before spawning."

[[asset]]
id = "cargo-vendor-smoke-v1"
capability = "cargo-vendor"
covers_job = "build-test-clippy"
stage_script = "scripts/build-cargo-vendor-asset.sh"
env_var = "MYELIN_GVISOR_CARGO_VENDOR"
default_path = "~/.local/share/gvisor-assets/cargo-vendor-smoke-v1"
source_image = "testing/fixtures/cargo-vendor-smoke/Cargo.lock"
source_image_digest = "sha256:fc5b44e66527fdda3cbef94d7ee128f77f0919dc176e0ae8198a717b8ca7c603"
lockfile_sha256 = "fc5b44e66527fdda3cbef94d7ee128f77f0919dc176e0ae8198a717b8ca7c603"
mount_destination = "/opt/myelin/cargo-vendor"
canonical_tree_sha256 = "9fcc19c65ae0a47de4b241c30f9eb3613cd74adf315f763e6f91d74b31eec8eb"
image = "myelin.local/cargo-vendor-smoke-v1@sha256:9fcc19c65ae0a47de4b241c30f9eb3613cd74adf315f763e6f91d74b31eec8eb"
note = "Exact Cargo.lock-keyed cargo vendor tree for the external-dependency smoke crate. The production registry resolves and verifies the complete canonical tree at startup through the shared ownership/mode-hardened asset walk. The fixed mount destination is recorded for the next slice; this slice does not mount the tree, install Cargo source replacement, or select it for any job."

