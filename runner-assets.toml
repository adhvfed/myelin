note = "Full-workspace (443-crate) Cargo.lock-keyed cargo vendor tree, keyed to this repo's own root Cargo.lock. ADDITIVE + DORMANT alongside cargo-vendor-smoke-v1: the production registry resolves and verifies this complete canonical tree at startup through the SAME ownership/mode-hardened asset walk and world-readable check as the smoke asset, but no dispatched job mounts it, installs Cargo source replacement, or selects it yet. It is the vendor asset a future real full-workspace `.myelin/ci.toml` build-test-clippy job will mount at the recorded destination."
