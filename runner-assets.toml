# runner-assets.toml — the CT-007 pre-registered cutover-floor GATE 2/4 (digest-pinned runner
# assets), first slice.
#
# planning/system-reviews/2026-06-26/12-ci-track-ledger.md ("Pre-registered CT-007 cutover
# floor", ~line 311) states gate 2 as:
#
#   "digest-pinned one-cell runner assets provide the actual Rust/Node/browser/container
#   capabilities [the 12 GitHub CI jobs] require without weakening gVisor, egress, or privilege
#   boundaries."
#
# This file is DIFFERENT from `ci-workload-inventory.toml` (gate 1): that file maps GitHub JOBS to
# CT-007-step OWNERS. This file maps RUNNER ASSETS (staged gVisor rootfs trees carrying a specific
# capability) to their digest pins. A GitHub job needs one or more runner assets to run under the
# Myelin-native sandbox; this manifest is the accounting of which assets exist, how they were
# built, and what their content must hash to.
#
# STATUS TODAY (committed 2026-07-25; wording corrected 2026-07-25 after a second adversarial
# review round by gpt-5.6-sol; corrected AGAIN 2026-07-25 once the registry slice landed — code wins
# over docs): the Rust rootfs and exact-commit checkout assets now have a Cargo.lock-keyed,
# content-addressed `cargo vendor` companion. The companion is REGISTERED and verified at runner
# startup, but deliberately is not mounted or selected by any job in this slice. It remains a
# foundation toward the `build-test-clippy` job, not proof that the job can resolve dependencies
# offline; that gVisor read-only mount and Cargo source-replacement wiring is the next slice.
# `JobSpec.image`
# IS now the real launch authority (`GvisorBackend::launch_with` resolves + canonical-tree-verifies
# it against a `GvisorAssetRegistry` BEFORE any resource is reserved — the env-var
# `MYELIN_GVISOR_ROOTFS`/`MYELIN_GVISOR_RUST_ROOTFS` resolvers remain, but only as the mechanism the
# registry's own entries are built from, no longer as a fallback authority a job's declared image can
# bypass); the Rust image and Cargo-vendor asset are registered in the production registry
# (`myelin-ci-controlplane`'s `production_gvisor_registry()`), but no dispatched job selects the
# vendor asset yet. Node (frontend
# lint/unit/build jobs), a headless browser (the Chromium suite), Docker-in-Docker (the `integration`
# workflow's live-backend needs), and outbound egress to the RustSec/npm advisory DBs (the
# `security.yml` jobs) are ALL still missing runner assets — separate, later rows, added by later
# slices of this same gate. Gate 2 is NOT closed by this file; it is one toolchain-smoke closer.
#
# ENFORCEMENT: `crates/myelin-lints/tests/runner_asset_digest_pin.rs` recomputes each row's
# `canonical_tree_sha256` (via the SAME `tar --sort=name --mtime=@0 --owner=0 --group=0
# --numeric-owner --format=gnu -C <staged-dir> -cf - . | sha256sum` recipe
# `scripts/dogfood.sh`'s `verify_ci_rootfs()` uses) against the staged directory named by `env_var`
# (falling back to each asset's own documented default path), ONLY when that directory actually
# exists on the current machine — this is a genuine, honest skip on any host without the asset
# staged (matching this repo's existing runsc/KVM graceful-skip convention), not a silent vacuous
# pass. `MYELIN_REQUIRE_RUST_ROOTFS_PIN=1` forces a hard failure instead of a skip.
#
# THIS IS NOT THE PRODUCTION `linux-small-v1` PROFILE. `.myelin/ci.toml`'s pinned
# `myelin.local/linux-small-v1-rootfs@sha256:...` (verified by `scripts/dogfood.sh
# verify-ci-rootfs`) is the founder-dogfood marker-pipeline rootfs — a SEPARATE concern from the
# per-capability runner assets tracked here. Neither this file nor its enforcement test reads or
# writes `.myelin/ci.toml`.

[[asset]]
id = "linux-rust-v1"
capability = "rust"
# The GitHub job(s) this asset provides the capability for (ci-workload-inventory.toml job ids).
covers_job = "build-test-clippy"
stage_script = "scripts/build-rust-rootfs.sh"
env_var = "MYELIN_GVISOR_RUST_ROOTFS"
default_path = "~/.local/share/gvisor-assets/rust-rootfs"
# The exact official source image `scripts/build-rust-rootfs.sh` pulled + pinned when this row's
# digest was computed (2026-07-25). Re-staging with FORCE=1 against a different RUST_IMAGE_TAG
# changes the rootfs content and therefore this row's digest.
source_image = "rust:1.95-slim-bookworm"
source_image_digest = "sha256:d7482085ff5b415f84dba5647ae71606650bdef00db7aeb69f4b3d170c3e4082"
# The canonical-tree content digest of the STAGED rootfs (docker-exported filesystem + the empty
# pinned /workspace bind target + usr/local/bin/{rustc,cargo,...} PATH-reachability symlinks — see
# the script's own header for why the symlinks target the real toolchain binaries, not the rustup
# proxy hardlinks). Computed
# 2026-07-25 on the founder dogfood host; reconfirmed unchanged 2026-07-25 after the staging-safety
# rewrite of build-rust-rootfs.sh (atomic build-then-promote instead of rm-rf-then-build). That
# rewrite briefly produced a DIFFERENT digest (2493dd29...) because `mktemp -d`'s default 0700 mode
# on the build-temp directory was being promoted straight into the rootfs ROOT's own permissions —
# the tar recipe hashes mode bits, so 0700 vs 0755 alone changes this digest, and a 0700 root also
# made the sandboxed non-root uid unable to traverse into the rootfs at all ("permission denied"
# finding /bin/sh — caught by actually re-running the prod-exec test, not assumed green). Fixed by
# chmod 0755 on the temp dir before populating it; the raw `docker export` step itself was
# independently confirmed byte-for-byte reproducible across separate container creates.
canonical_tree_sha256 = "91ffb0fa8e33ba7f32223b686d8bf1f204f0727ae8354e326758206a68107873"
# CT-007 gate 2/4 (registry slice, 2026-07-25): the digest-pinned `ImageRef` reference
# `GvisorAssetRegistry` (crates/myelin-ci-sandbox/src/asset_registry.rs) resolves against this row's
# staged directory. The digest embedded after `@sha256:` MUST equal `canonical_tree_sha256` above —
# `crates/myelin-lints/tests/runner_asset_digest_pin.rs` mechanically checks this manifest-internal
# consistency unconditionally (no staged directory required). This is the row that closes the
# "JobSpec.image is not yet bound to this asset at launch" gap the STATUS note above used to name —
# nothing dispatches this image yet, but the registry now carries the binding honestly.
image = "myelin.local/linux-rust-v1-rootfs@sha256:91ffb0fa8e33ba7f32223b686d8bf1f204f0727ae8354e326758206a68107873"
note = "Docker-pull + docker-export of an official Debian-slim rust image, NOT a hand-chased host-lib copy (unlike scripts/stage-git-rootfs.sh's git precedent) — the host cargo/rustc pull in dozens of transitive shared libs (libgit2, libssl, libcurl, icu, ...) that would make a hand-staged tree fragile and not a real immutable release artifact. Proven end to end by crates/myelin-ci-sandbox/tests/rust_capable_rootfs_prod_exec_test.rs: a real `runsc` sandbox on the SAME GvisorBackend::launch path every other job uses runs `rustc --version && cargo --version` and asserts non-root uid + no network egress, unchanged hardening. As of CT-007 gate 2/4's registry slice, this is a REAL registry entry (myelin-ci-controlplane's production_gvisor_registry()), not just a manifest row — though no dispatched job names this image yet."

[[asset]]
id = "git-v1"
capability = "checkout"
covers_job = "build-test-clippy"
stage_script = "scripts/stage-git-rootfs.sh"
env_var = "MYELIN_GVISOR_GIT_ROOTFS"
default_path = "~/.local/share/gvisor-assets/git-rootfs"
source_image = "host-git:2.54.0"
source_image_digest = "sha256:bb6007e89e15dad35cf623a203db26dde9e042cb2df844320055cad3cd2eb5d0"
# Honest canonical-tree digest of the founder host's staged git tree after re-staging through the
# corrected recipe. The pin includes every fixed OCI destination: /tmp, /workspace, /repo, and
# /quarantine. Both checkout and git-wire verify this same digest immediately before use, and the
# control-plane registers the same image/path in GvisorAssetRegistry at runner construction.
canonical_tree_sha256 = "0ac70764ba20a043d19933213d60070c7f8712947a86753bab518569df302646"
image = "myelin.local/git-v1-rootfs@sha256:0ac70764ba20a043d19933213d60070c7f8712947a86753bab518569df302646"
note = "Founder-dogfood git-bearing rootfs used for exact-commit checkout and git wire. The shared tree is read-only to OCI workloads, all mount targets are precreated and empty, registry construction pins the complete content, and each git execution re-verifies the same canonical digest before spawning."

[[asset]]
id = "cargo-vendor-smoke-v1"
capability = "cargo-vendor"
covers_job = "build-test-clippy"
stage_script = "scripts/build-cargo-vendor-asset.sh"
env_var = "MYELIN_GVISOR_CARGO_VENDOR"
default_path = "~/.local/share/gvisor-assets/cargo-vendor-smoke-v1"
source_image = "testing/fixtures/cargo-vendor-smoke/Cargo.lock"
source_image_digest = "sha256:fc5b44e66527fdda3cbef94d7ee128f77f0919dc176e0ae8198a717b8ca7c603"
lockfile_sha256 = "fc5b44e66527fdda3cbef94d7ee128f77f0919dc176e0ae8198a717b8ca7c603"
mount_destination = "/opt/myelin/cargo-vendor"
canonical_tree_sha256 = "9fcc19c65ae0a47de4b241c30f9eb3613cd74adf315f763e6f91d74b31eec8eb"
image = "myelin.local/cargo-vendor-smoke-v1@sha256:9fcc19c65ae0a47de4b241c30f9eb3613cd74adf315f763e6f91d74b31eec8eb"
note = "Exact Cargo.lock-keyed cargo vendor tree for the external-dependency smoke crate. The production registry resolves and verifies the complete canonical tree at startup through the shared ownership/mode-hardened asset walk. The fixed mount destination is recorded for the next slice; this slice does not mount the tree, install Cargo source replacement, or select it for any job."
