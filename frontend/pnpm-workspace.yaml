packages:
  - "packages/*"
  - "apps/*"

onlyBuiltDependencies:
  - esbuild

overrides:
  h3: 1.15.11
  "brace-expansion@1": 1.1.18
  "brace-expansion@2": 2.1.4
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: ">=8.5.18"
  tar: ">=7.5.21"

# GHSA-mh99-v99m-4gvg (brace-expansion ReDoS) is ignored via pnpm.auditConfig.ignoreGhsas in
# package.json (pnpm 10 does not read auditConfig from this file): the only patched line
# is >=5.0.8, which drops the callable default export that eslint-plugin-jsx-a11y's
# minimatch@3 usage requires (lint crashes on real source under the override), and both
# eslint-plugin-jsx-a11y and eslint-plugin-solid cap peer eslint at ^9 with no newer
# releases. All vulnerable paths are dev/build tooling (eslint, nitropack's archiver) on
# trusted input. Remove the ignore when the plugins support a minimatch major carrying
# brace-expansion >=5.
