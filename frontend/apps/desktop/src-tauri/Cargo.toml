# The Tauri 2 desktop+mobile shell crate (MR-018 / E0.7).
#
# CARGO-WORKSPACE PLACEMENT (justified): this is a SEPARATE cargo project (own Cargo.lock, own
# `[workspace]` root below) — deliberately NOT a member of the root myelin workspace. Reasons:
#   1. The `tauri` dep tree (webkit2gtk/soup bindings, the wry webview, hundreds of crates) would
#      bloat the root workspace lock + every `cargo check --workspace` run; the shell is a leaf
#      consumer, exactly like the service `main.rs` crates are leaves above the library DAG.
#   2. It lives under `frontend/`, so it is OUTSIDE the `crates/*/src` tree the architecture lints
#      (myelin-lints `workspace_clean`) scan — the lint gate stays green untouched.
#   3. It REUSES the Myelin crates by PATH dependency (`myelin-content`, `myelin-client`), which
#      remain members of the root workspace and resolve their `*.workspace = true` inheritance
#      against it. This is the "one Rust core, shared between Myelin and the Tauri shell" seam.
[package]
name = "myelin-desktop"
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Myelin desktop+mobile shell (Tauri 2) — the Rust side reuses the Myelin crates."

# Tauri requires the app logic in a lib (the mobile entry point links it as a cdylib/staticlib;
# the desktop main.rs links it as an rlib). Same source, three shells.
[lib]
name = "myelin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared Rust content and client logic used by the Tauri commands. These crates have no database,
# network, or desktop-only dependencies.
myelin-content = { path = "../../../../crates/myelin-content" }
myelin-client = { path = "../../../../crates/myelin-client" }

# This crate is its OWN cargo workspace root (it is a path-dependency consumer of the root
# workspace's crates, but not a member). The empty table stops cargo from walking up to the
# root myelin Cargo.toml and trying to treat this leaf as a member.
[workspace]
