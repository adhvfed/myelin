# ci-workload-inventory.toml — the CT-007 pre-registered cutover-floor GATE 1/4.
#
# planning/system-reviews/2026-06-26/12-ci-track-ledger.md ("Pre-registered CT-007 cutover
# floor", ~line 302): CT-007 (cut CI over from GitHub Actions onto the hardened sandbox) may begin
# disabling or removing GitHub Actions jobs only after four gates. Gate 1 is:
#
#   "A committed Myelin-native workflow maps every still-required GitHub job to an executable
#   Myelin job or names a mechanically gated, non-CI owner; an inventory test fails on silent job
#   loss."
#
# This file is that mapping. `crates/myelin-lints/tests/ci_workload_inventory.rs` is the inventory
# test: it scans every `jobs:` block in `.github/workflows/*.yml` and fails RED if a discovered
# job has no row here, if a row here names a job that no longer exists, or if a row's structured
# fields are internally inconsistent (see SCHEMA below) — including a mechanical check that any
# `myelin_job` a row names actually exists in `.myelin/ci.toml`, not merely a plausible string.
#
# 2026-07-25 revision (adversarial review by gpt-5.6-sol): the original schema had a free-text
# `owner` field the test never actually examined — any string would have passed, including one that
# silently contradicted this file's own header (an earlier version of this file said "none of steps
# 2-4 started" in prose while a row's `owner` said "in progress"). `owner` is replaced below by
# `migration_step` (an integer 1-4) and `migration_state` (a closed, test-enforced enum) so real
# progress is mechanically checked, not merely narrated.
#
# STATUS TODAY (2026-07-25): the only Myelin-native pipeline that exists at all is the tiny
# founder-dogfood marker job in `.myelin/ci.toml` — it proves transport/plumbing only, NOT workload
# parity with any job below. So every row's `status` is honestly `github-only`; NONE are
# `myelin-native` yet. Marking a row `myelin-native` before a real `.myelin/ci.toml` job exists for
# it would be exactly the overclaiming doctrine EI-01 §5 forbids ("make violations loud, never
# silently swallowed" — the inverse failure mode is silently claiming a floor that is not there).
#
# **CT-007 gate 1 is NOT "closed" by this file — only its inventory subgate is.** An earlier ledger
# entry called gate 1 "closed"; that overclaimed the ledger's own literal wording ("maps every job
# to an executable Myelin job OR names a MECHANICALLY GATED non-CI owner"). This file's honest
# inventory-and-plan is real and enforced, but it does not yet constitute either an executable
# Myelin job or an enforced non-CI ownership mechanism for any row — see ledger 12's dated entry.
#
# SCHEMA (mechanically enforced by ci_workload_inventory.rs, not just documentation):
#   status = "github-only"   — GitHub Actions is the only thing that runs this workload today.
#                              `myelin_job` MUST be empty; `migration_state` MUST NOT be
#                              "graph-passing"/"cutover-repeated" (those imply real Myelin
#                              execution, which would mean status should already be `myelin-native`).
#   status = "myelin-native" — a real `.myelin/ci.toml` job now carries this workload. `myelin_job`
#                              MUST name that job, and the test verifies it actually exists as a
#                              `[[jobs]] name = "..."` entry there. `migration_state` MUST be
#                              "graph-passing" or "cutover-repeated".
#   migration_step  — which of the ledger's four cutover-floor gates this row is progressing
#                     through (1-4); see the ledger for what each step requires.
#   migration_state — one of, in increasing order of real (not planned) progress:
#     "not-started"        — nothing built for this row's capability yet.
#     "capability-smoke"    — a runner asset exists and proves the TOOLCHAIN executes under the
#                             hardened sandbox (e.g. `rustc --version`) — NOT proof the job's full
#                             observable contract (its real commands, inputs, resources, services)
#                             is satisfied. Distinguishing this from full capability was itself an
#                             adversarial-review finding (gpt-5.6-sol, 2026-07-25) against an
#                             earlier version of this file that conflated the two.
#     "capability-proven"   — the runner asset genuinely satisfies the job's full observable
#                             contract (exact commands, env, resources, services) — reserved, not
#                             yet reached by any row.
#     "graph-passing"       — the complete mapped graph passes on one exact Myelin commit (ledger
#                             step 3) — reserved, not yet reached by any row.
#     "cutover-repeated"    — a second ordinary commit repeated it without GitHub execution or
#                             manual green (ledger step 4) — reserved, not yet reached by any row.
#
# WHEN A LATER STEP SHIPS A REAL MYELIN JOB FOR A ROW: flip `status` to `myelin-native`, fill in
# `myelin_job` with the real `.myelin/ci.toml` job name, and set `migration_state` to
# "graph-passing" or "cutover-repeated" as appropriate. Do not flip early — the test will refuse an
# unpaired combination.

# ─────────────────────────────────── .github/workflows/ci.yml ───────────────────────────────────

[[job]]
workflow = "ci.yml"
job = "edge-release-bundle"
status = "github-only"
migration_step = 2
migration_state = "not-started"
myelin_job = ""
note = "Builds the locked, stripped, checksummed edge release bundle artifact. P0 later promotes this one-cell runner asset into the signed/SBOM release supply-chain floor (ledger 2026-06-26); that later provenance work is not an excuse to drop this job before R4 workload parity exists."

