# ci-workload-inventory.toml — the CT-007 pre-registered cutover-floor GATE 1/4.
#
# planning/system-reviews/2026-06-26/12-ci-track-ledger.md ("Pre-registered CT-007 cutover
# floor", ~line 302): CT-007 (cut CI over from GitHub Actions onto the hardened sandbox) may begin
# disabling or removing GitHub Actions jobs only after four gates. Gate 1 is:
#
#   "A committed Myelin-native workflow maps every still-required GitHub job to an executable
#   Myelin job or names a mechanically gated, non-CI owner; an inventory test fails on silent job
#   loss."
#
# This file is that mapping. `crates/myelin-lints/tests/ci_workload_inventory.rs` is the inventory
# test: it scans every `jobs:` block in `.github/workflows/*.yml` and fails RED if a discovered
# job has no row here, or if a row here names a job that no longer exists in the workflow files.
#
# STATUS TODAY (committed 2026-07-25): the only Myelin-native pipeline that exists at all is the
# tiny founder-dogfood marker job in `.myelin/ci.toml` — it proves transport/plumbing only, NOT
# workload parity with any job below. So every row's `status` is honestly `github-only`; NONE are
# `myelin-native` yet. Marking a row `myelin-native` before a real `.myelin/ci.toml` job exists for
# it would be exactly the overclaiming doctrine EI-01 §5 forbids ("make violations loud, never
# silently swallowed" — the inverse failure mode is silently claiming a floor that is not there).
#
# STATUS VOCABULARY (the inventory-honesty test `no_inventory_entry_claims_myelin_native_without_
# naming_its_myelin_job` enforces the contract below — it is not just documentation):
#   - "github-only"    — GitHub Actions is the only thing that runs this workload today.
#                        `myelin_job` MUST be empty (there is nothing yet to name).
#   - "myelin-native"  — a real `.myelin/ci.toml` job now carries this workload. `myelin_job`
#                        MUST name that job (non-empty) — a later CT-007 step's Definition of Done.
#
# `owner` names the CT-007 cutover-plan step accountable for eventually flipping this row — a
# MECHANICALLY GATED, non-CI owner (the ledger's step numbers, each itself gated by a committed
# test/scorecard), never a person and never a fabricated Myelin job. The four steps:
#   1. this inventory (satisfied by this file + its test, committed 2026-07-25)
#   2. digest-pinned one-cell runner assets providing the Rust/Node/browser/container capability
#      each job needs, without weakening gVisor/egress/privilege boundaries
#   3. the complete mapped graph passes on one exact Myelin commit + the permanent mutation gate
#      has zero missed mutants
#   4. a second ordinary commit repeats the graph without GitHub execution or manual green
# None of steps 2-4 have started for any row below.
#
# WHEN A LATER STEP SHIPS A REAL MYELIN JOB FOR A ROW: flip its `status` to `myelin-native` and
# fill in `myelin_job` with the real `.myelin/ci.toml` job name. Do not flip early.

