myelin_job = ""
note = "cargo build --workspace --locked, cargo test --workspace --locked, cargo clippy --workspace --all-targets -D warnings. The base Rust workload every other job's crates depend on existing. `linux-rust-v1` (runner-assets.toml) proves the Rust TOOLCHAIN executes under the real hardened gVisor sandbox — it does NOT yet mount an exact-commit checkout, provide vendored/locked dependencies under deny-all egress, propagate the job's env, or size resources for a real workspace build; JobSpec.image is also not yet bound to this asset at launch (a 2026-07-25 gpt-5.6-sol finding). Status stays `github-only` and `migration_state` stays `capability-smoke`, not `capability-proven`, until the real vertical slice (checkout + vendored deps + env + resource sizing + image-digest binding + the real dispatch path) is built and independently verified."

# ─────────────────────────────── .github/workflows/integration.yml ──────────────────────────────

[[job]]
workflow = "integration.yml"
job = "integration"
status = "github-only"
migration_step = 2
migration_state = "not-started"
myelin_job = ""
note = "The integration band-boundary gate over real backends (Postgres/RustFS/Valkey/NATS JetStream): scripts/integration-test.sh brings the stack up, runs `cargo test --features integration`, then the infra scorecard binary. The only workflow needing a live multi-service stack; ci.yml stays DB-free by design. `crates/myelin-storage/tests/stage4_floor_smokes.rs` also invokes Docker directly, so workload parity needs a rootless Docker-compatible engine inside the runner asset, not just native service daemons (gpt-5.6-sol, 2026-07-25) — see planning discussion on a single ephemeral Firecracker \"job pod\" holding the runner + all service dependencies over guest loopback, so the sandbox's egress-default-deny/no-external-NIC posture stays unchanged."

# ───────────────────────────────── .github/workflows/security.yml ───────────────────────────────

[[job]]
workflow = "security.yml"
job = "rustsec"
status = "github-only"
migration_step = 2
migration_state = "not-started"
myelin_job = ""
note = "cargo-audit over Cargo.lock against the RustSec advisory database. Needs a LIVE, current advisory DB — cannot be made hermetic/vendored like a build asset. The sandbox's egress allowlist only accepts IP literals today (DNS-rebinding-unsound otherwise); planning direction (gpt-5.6-sol, 2026-07-25) is a narrow purpose-built `rustsec_snapshot` broker (fetch+mount a read-only advisory DB snapshot, run `cargo audit --no-fetch`), not a general resolving forward proxy."

[[job]]
workflow = "security.yml"
job = "pnpm"
status = "github-only"
migration_step = 2
migration_state = "not-started"
myelin_job = ""
note = "pnpm audit --audit-level moderate over the frontend lockfile. Same live-advisory-DB egress consideration as rustsec (a narrow `npm_bulk_audit` broker, not a general proxy, per gpt-5.6-sol 2026-07-25). Separately, pnpm 10.5.2 (frontend/package.json) may already be broken against this job independent of CT-007: the npm registry retired the legacy audit endpoints pnpm 10.x used in 2026 (pnpm moved to a new bulk-advisory path in 10.33/11.x) — flagged, not yet investigated."
