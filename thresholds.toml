human_lane_reservation = 32    # 25% of cap — above the 20% measured human-lane floor.
retry_after_secs = 2

[[shed_budgets]]
surface = "ConnectionTier"    # reserved connection slots for interactive humans.
per_tenant_in_flight_cap = 256 # MEASURED: connection-storm (P-S31) held interactive humans at this cap.
human_lane_reservation = 64    # 25% of cap — above the 20% measured human-lane floor.
retry_after_secs = 3

[[shed_budgets]]
surface = "AgentMention"      # humans never queue behind agent runs (a reserved human fraction).
per_tenant_in_flight_cap = 96  # MEASURED: BUS-D7 (P-420) + SUB-D3 held the human lane under the 30× agent-mention storm.
human_lane_reservation = 24    # 25% of cap — above the 20% measured human-lane floor.
retry_after_secs = 10

[[shed_budgets]]
