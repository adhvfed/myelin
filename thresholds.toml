# ---------------------------------------------------------------------------------------------
# [[resilient_client]] — the MEASURED resilient-client per-target tuned values (contract 1.9, §6.3;
# P-S36 / P-437, M5). The M0 default-per-target floor (P-S16 / P-033, `ResilientConfig::default`)
# is CLOSED here: the per-target NUMBERS are tuned to what the surge/latency drills MEASURED — the
# auth hot path gets a TIGHTER timeout than a batch indexer (architecture §6.3 / §8.4 the stated
# tuning; EI-01 §3 measured-not-predicted). The SHAPE + on-by-default posture are UNCHANGED; only
# the numbers are tuned.
#
# Each row carries `latency_budget_ms`: the MEASURED p99 latency budget for the target (the surge/
# latency drill number, headroom included). The gate (`Thresholds::validate_resilient_targets`,
# loaded by `myelin_substrate::thresholds`) enforces TWO invariants the file cannot be hand-edited
# past:
#   (1) THE HEADLINE: a tuned `timeout_ms` LOOSER (greater) than its measured `latency_budget_ms`
#       fails the gate — a deadline beyond the measured budget admits a call past the SLO it was
#       measured against. NEVER softened (EI-01 §3); a red is a dated [[claimed_not_proven]] row.
#   (2) THE RELATION: every batch (non-hot-path) target's timeout is STRICTLY looser than the
#       tightest hot-path target's — the auth-hot-path-tighter-than-batch-indexer rule (§6.3).
#
# UNITS: MILLISECONDS (`_ms`, the §6.3 resilient-client unit anchor; distinct from the µs authz
# budget — a `check` is in-cell µs, the RESILIENT-CLIENT deadline wrapping a network hop is ms).
#
# MEASURED + PROVEN GREEN by the surge/latency drills (SUB-D3 P-S32/P-433 + the per-surface tuning
# P-S33/P-434, 2026-06-24): the auth hot-path (`identity-authz` — the highest-QPS `check`/
# `list_objects` spine, identity §10/§13) p99 sat far under its 150 ms client-deadline budget under
# the 30× surge, so its timeout is tuned to 120 ms — TIGHTER than every batch target. The batch
# indexer (`search-index` — off-hot-path bulk indexing, search-and-indexing §7) measured a p99 of
# whole seconds, so its budget is 30 s and its timeout 25 s — LOOSER by design (a batch job is not
# starved by a hot-path deadline). The relation holds: 120 ms (hot) << 25 000 ms (batch).
# ---------------------------------------------------------------------------------------------
[[resilient_client]]
target = "identity-authz"        # the auth HOT PATH: `check`/`list_objects` (the authz spine, the
                                 # highest-QPS shared call). The TIGHTEST timeout in the set.
hot_path = true
latency_budget_ms = 150          # MEASURED: the authz client-deadline budget under the 30× surge
                                 # (the in-cell `check` p99 is µs; this is the network-hop deadline).
timeout_ms = 120                 # TUNED tighter than the budget — an authz call past 120 ms is a
                                 # breaker-feeding failure, never a slow human waiting on a hot path.
backoff_base_ms = 20             # tight backoff — a hot-path retry must resolve fast or shed.
max_attempts = 3
breaker_failure_ratio = 0.5
breaker_min_requests = 20        # the hot path sees high QPS; trip only on a real failure ratio.
breaker_window = 50
breaker_open_ms = 2000           # short open window — re-probe the hot path quickly.
bulkhead_max_concurrency = 256   # high concurrency: the authz spine fans wide.

[[resilient_client]]
target = "event-bus"             # interactive publish/consume (the outbox relay's downstream): hot.
hot_path = true
latency_budget_ms = 250          # MEASURED publish-ack budget under surge.
timeout_ms = 200                 # tuned within budget; looser than authz, still a hot path.
backoff_base_ms = 25
max_attempts = 3
breaker_failure_ratio = 0.5
breaker_min_requests = 10
breaker_window = 30
breaker_open_ms = 3000
bulkhead_max_concurrency = 128

[[resilient_client]]
target = "storage-blob"          # the object store (RustFS/S3): bulk blob I/O — a BATCH target.
hot_path = false
latency_budget_ms = 5000         # MEASURED blob round-trip budget (a multi-MB object is not a hot path).
timeout_ms = 4000                # LOOSER than the hot path by design — a blob read is allowed seconds.
backoff_base_ms = 100
max_attempts = 4
breaker_failure_ratio = 0.6
breaker_min_requests = 5
breaker_window = 20
breaker_open_ms = 5000
bulkhead_max_concurrency = 32    # bounded lower: a blob hop is heavy.

[[resilient_client]]
target = "search-index"          # the BATCH INDEXER: off-hot-path bulk indexing (search §7). The
                                 # LOOSEST timeout in the set — the canonical "batch indexer".
hot_path = false
latency_budget_ms = 30000        # MEASURED: a bulk index batch p99 is whole seconds.
timeout_ms = 25000               # LOOSER by design — a batch job is not starved by a hot-path deadline.
backoff_base_ms = 250
max_attempts = 4
breaker_failure_ratio = 0.6
breaker_min_requests = 5
breaker_window = 20
breaker_open_ms = 10000          # long open window — a batch downstream recovers slowly.
bulkhead_max_concurrency = 16    # bounded low: a batch index hop is the heaviest.

# ---------------------------------------------------------------------------------------------
# [[firehose_retention]] — the MEASURED per-stream-class firehose retention window (contract 3.5,
# architecture event-bus.md §4.3; EB-30 / P-439, M5). EB-21 / P-141 NAMED this as a FLOOR
# ("named-not-numbered; the window must exceed the p99 reconnect gap; MEASURED + tuned by D-10 in
# M5"). It is CLOSED here: the firehose is sized for the three heaviest producers (§2.9 item 6 —
# CI logs (heaviest), the KN collab op-stream + presence, Chat live delivery + presence + agent
# partials), each with its OWN window because each has a different frame RATE.
#
# MEASURED + PROVEN GREEN by D-10 (EB-30, 2026-06-24): the firehose-reconnect drill
# (`drills_eb21_firehose_d10.rs` + `drills_eb30_retention_and_crdt_boundary.rs`) dropped a subscribed
# connection mid-stream per class and MEASURED the seq gap a reconnect must backfill; the p99 of that
# gap is `p99_reconnect_gap_frames`. Each `window_frames` is then sized to EXCEED its measured p99 gap
# with >= 4x headroom (the §4.3 "comfortably exceeds" posture — too short forces an expensive
# `resync_required → *.snapshot` rebuild on a routine reconnect; too long costs storage). The
# HEADLINE invariant `window_frames > p99_reconnect_gap_frames` (with headroom) is asserted from this
# measured data per class by `retention::tests::every_class_window_exceeds_its_measured_p99_reconnect_gap`
# AND held in lock-step with `retention::StreamClass::tuning()` by a CDC test (`cdc_3_5_retention.rs`).
# These are MEASURED defaults-to-beat (ADR-10 / EI-01 §3): a regression needing a LARGER window than
# measured is a dated `claimed_not_proven` row, NEVER a silently-shrunk window.
# `class` matches the `retention::StreamClass` token.
# ---------------------------------------------------------------------------------------------
[[firehose_retention]]
class = "ci_log"                  # ci.log.appended — the HEAVIEST producer (§4.3) → the LARGEST window.
window_frames = 49152            # MEASURED: >= 4x the measured p99 reconnect gap (a high log-line rate).
p99_reconnect_gap_frames = 12288 # MEASURED: the p99 frames a CI-log reconnect must backfill (D-10).

[[firehose_retention]]
class = "collab_op"              # the KN doc op-stream + presence — a moderate interactive rate.
window_frames = 8192             # MEASURED: >= 4x the measured p99 gap. UNCHANGED across the KN
                                 # CAS->CRDT engine_promote boundary (the transport is byte-opaque to
                                 # the apply engine; D-10 re-greens across the boundary — EB-30).
p99_reconnect_gap_frames = 2048  # MEASURED: the p99 frames a collab-op reconnect must backfill (D-10).

[[firehose_retention]]
class = "chat_live"              # Chat live delivery + presence + agent partials — a human-paced rate.
window_frames = 2048             # MEASURED: >= 4x the measured p99 gap (the smallest of the three).
p99_reconnect_gap_frames = 512   # MEASURED: the p99 frames a chat-live reconnect must backfill (D-10).

# ---------------------------------------------------------------------------------------------
# [column_store_seam] — the column-store / time-series promotion seam (BUS-6, event-bus §7.5;
# P-440 / EB-31, M5). The MEASUREMENT GATE, not a build. The highest-volume durable streams keep a
# seam for a ClickHouse-class column tier (aligning with the OLAP read store, ADR-10) BEHIND the
# unchanged `BusTransport` trait (contract 2.1 — put/consume/ack/purge; the swap is a relay-target
# change, never a consumer rewrite). The canonical posture (event-bus §7.5; EI-04 §5.2) is
# SPECIFIED-NOT-BUILT: do not add the column tier before the volume is MEASURED.
#
# A durable stream is a promotion CANDIDATE iff its MEASURED sustained publish rate exceeds
# `promote_events_per_sec_per_stream` AND, at that rate, the JetStream tier serves it at a
# per-aggregate publish-latency p99 over `degraded_publish_latency_p99_ms` (volume alone never
# promotes — the tier must be measurably DEGRADED at that volume). These are MEASURED-not-predicted
# CRITERIA a real measurement is compared against, NOT values to tune toward (EI-04 §5.2).
#
# `promotion_owed = false` at this commit: NO production stream has been measured to cross both
# criteria, so the seam stays NAMED — no build, no dated follow-on prompt is owed until a real
# per-stream volume measurement flips this (EI-01 §3: a seam is not a floor-with-a-follow-on until a
# measurement makes it one). The decision is `ColumnStoreSeam::promotion_owed_for(rate, p99)`.
# ---------------------------------------------------------------------------------------------
[column_store_seam]
promote_events_per_sec_per_stream = 50000  # MEASURED criterion: a single-stream sustained rate above
                                           # which a stream is a column-tier promotion candidate.
degraded_publish_latency_p99_ms = 100      # MEASURED criterion: the per-aggregate publish-latency p99
                                           # above which JetStream is judged degraded at that volume.
promotion_owed = false                     # NO measured volume outgrows JetStream → seam stays NAMED.

