
version = 1
as_of = "2026-08-18"

# honesty note: values historically labelled "MEASURED" came from in-repo
# simulations of the mechanisms, not from production measurement. every value
# here is a tuning seed unless its comment names the production enforcement
# point (today: the edge gateway rows marked ENFORCED).

[revocation]
sla_mins = 5

[surge]
multiplier = 30
human_lane_p99_budget_us = 10000  # SUB-D3: the substrate's protected-human-lane p99 ceiling under 30× (P-S33 re-confirms).

[ci_surge]
per_tenant_in_flight_cap = 64               # seed (in-repo simulation): == shed_budgets.CiDispatch cap; the 30× CI surge shed the batch lane here, cross-tenant 0.
drr_base_quantum = 1                        # the DRR deficit decrement on one claim (fairness::BASE_QUANTUM).
drr_deficit_ceiling = 64                    # the DRR burst-credit cap — a long-idle fair_key cannot hoard priority (fairness::DEFICIT_CEILING).
starvation_wait_p99_max_ticks = 32          # promotion gate (07#1): wait p99 over this owes the hierarchical scheduler (CI-P29). simulated within budget at 30×.
hierarchical_scheduler_promotion_owed = false # CI-D2 measured the wait p99 within budget → flat DRR holds; the hierarchy stays a named floor.
prewarm_buffer_per_arrival_rate_bps = 1000  # seed (07#2 / §5.4, simulated): 10% of the recent arrival rate kept warm (replaces CI-P4's fixed floor).
prewarm_max_buffer = 16                     # the warm-buffer ceiling — bin-packing under the per-VM memory floor (never past the zone's headroom).

[authz_surge]
human_lane_p99_budget_us = 5000  # ID-D9: the protected human lane's authz-decision p99 ceiling under 30×.

[fail_static]
status = "OPEN - LEGAL"          # L-1, DPO-ratified; the VALUE is absent until counsel clears it.
owner = "DPO / Legal"
static_max_default_secs = 300    # the engineering SEED the mechanism is drilled against (P-S18/P-S25).
agent_token_ttl_secs = 60
constraint = "static_max <= revocation-SLA AND static_max >= agent-token-TTL"

[rpo_rto]
rpo_max_mins = 5             # recovery-point objective: at most 5 minutes of data may be lost.
rto_tenant_max_mins = 60     # recovery-time objective, per tenant: ≤ 1 hour.
rto_cell_max_mins = 240      # recovery-time objective, per cell: ≤ 4 hours.

[online_migration]
lock_wait_p99_max_ms = 500   # STOR-D8: an online step's p99 lock-wait must stay ≤ 500 ms (a short
downtime_max_ms = 0          # STOR-D8: 0 downtime — an online migration NEVER takes the table offline.

[git_pack_ceiling]
clone_serve_p99_max_ms = 50  # GIT-D4: the object-backed packs' clone-serve p99 must stay ≤ 50 ms;

[git_merge_queue]
concurrent_merge_attempts = 64  # GIT-D5: PRs racing onto one protected base_ref in the drill.
lost_merge_max = 0              # the hard floor: 0 lost merge (a single lost merge fails the drill).

[depth_ceilings]
soft = 12
hard = 16

[refs_traverse]
depth_ceiling = 16
max_nodes = 10000

[refs_hot_artifact]
read_budget_fanout = 1000     # R5: inbound fanout above which the CTE read falls over budget → R4 promotes (>budget).

[flex_db]
view_read_p99_max_ms = 200    # KN-D9: the flex-DB view-read p99 budget (JSONB + GIN + SetExpr conjoin).
page_row_cap = 500            # §4.1 step 5: the page row cap (a view read is always row-capped).
facet_promotion_ratio = 0.05  # contract 6.3: the FROZEN >5% facet-promotion trigger (measured, acted on KN-P31).
rollup_read_p99_max_ms = 250  # KN-D10 (KN-P18 / P-308, architecture §4.2 / KQ-4): the read-time rollup/formula

[authz_index]
ids_cardinality_cap = 1000      # P-ID-32: the Ids↔Filter switch point (drilled in-repo at the cap boundary).
reverse_index_lag_slo_ms = 1000 # P-ID-32: the freshness SLO seed (bounded < revocation SLA).
list_subjects_density_members = 50000 # the pinned density (a 50k-member channel, C8).
list_subjects_density_budget_ms = 250 # the 50k-density expand budget seed (P-ID-23/M4 re-measure at real density).

[dsr]
deadline_secs = 2592000          # Art. 12(3): 1 month = 30 days.
warning_margin_secs = 604800     # the nearing-deadline warning fires 7 days (1 week) before the deadline.
extension_total_secs = 7776000   # Art. 12(3) extension-for-complex: 3 months = 90 days (re-arm w/ recorded reason).

[cell_sizing]
pool_tenants_max = 2000           # seed (in-repo simulation): tenants one Pool cell admits (NOT the binding dimension here).
pool_write_qps_max = 9000         # seed (in-repo simulation): the Pool tier's sustained write-QPS ceiling (the BINDING dimension).
pool_storage_bytes_max = 2199023255552  # seed (in-repo simulation): ~2 TiB stored-bytes ceiling (storage binds last).
pool_binding_dimension = "write_qps"    # seed (ADR-10, simulated): write QPS binds FIRST at the Pool tier.
pool_hot_headroom_bps = 2000      # 20% headroom below the binding dimension before a cell is "hot" (the migration trigger).

[[shed_budgets]]
surface = "CiDispatch"        # TARGET (not yet enforced - no admission point in the dispatcher).
per_tenant_in_flight_cap = 64 # the batch lane: CI + agent share the wallet; no human reservation.
human_lane_reservation = 0
retry_after_secs = 5

[[shed_budgets]]
surface = "CollabOpStream"    # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 128 # numbers come from in-repo simulations of ShedLane, not production
human_lane_reservation = 32    # measurement; treat as the tuning seed when this surface is wired.
retry_after_secs = 2

[[shed_budgets]]
surface = "ConnectionTier"    # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 256
human_lane_reservation = 64
retry_after_secs = 3

[[shed_budgets]]
surface = "AgentMention"      # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 96
human_lane_reservation = 24
retry_after_secs = 10

[[shed_budgets]]
surface = "GitFrontDoor"      # the Git clone/push front door; ENFORCED at the edge gateway.
per_tenant_in_flight_cap = 4  # sized to the edge's 4 global git-wire slots (server.rs): machines
human_lane_reservation = 1    # hold at most 3 per tenant, so a human fetch always has a slot.
retry_after_secs = 5

[[shed_budgets]]
surface = "RefsBacklinkRead"  # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 192
human_lane_reservation = 48
retry_after_secs = 3

[[shed_budgets]]
surface = "RefsRefCreate"     # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 96
human_lane_reservation = 24
retry_after_secs = 5

[[shed_budgets]]
surface = "SearchQuery"       # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 160
human_lane_reservation = 40
retry_after_secs = 3

[[shed_budgets]]
surface = "WorkflowAgentLane" # TARGET (not yet enforced - no admission point in this service).
per_tenant_in_flight_cap = 96
human_lane_reservation = 24
retry_after_secs = 10

[[shed_budgets]]
surface = "HttpIntake"        # the generic /v1 API surface; ENFORCED at the edge gateway.
per_tenant_in_flight_cap = 48 # sized under the edge's 64 global dispatch slots (server.rs): one
human_lane_reservation = 12   # tenant's machine lanes hold at most 36, humans keep 12 reserved.
retry_after_secs = 5

[[resilient_client]]
target = "identity-authz"        # the auth HOT PATH: `check`/`list_objects` (the authz spine, the
hot_path = true
latency_budget_ms = 150          # the authz client-deadline budget seed (simulated 30× surge)
timeout_ms = 120                 # TUNED tighter than the budget — an authz call past 120 ms is a
backoff_base_ms = 20             # tight backoff — a hot-path retry must resolve fast or shed.
max_attempts = 3
breaker_failure_ratio = 0.5
breaker_min_requests = 20        # the hot path sees high QPS; trip only on a real failure ratio.
breaker_window = 50
breaker_open_ms = 2000           # short open window — re-probe the hot path quickly.
bulkhead_max_concurrency = 256   # high concurrency: the authz spine fans wide.

[[resilient_client]]
target = "event-bus"             # interactive publish/consume (the outbox relay's downstream): hot.
hot_path = true
latency_budget_ms = 250          # publish-ack budget seed (simulated surge).
timeout_ms = 200                 # tuned within budget; looser than authz, still a hot path.
backoff_base_ms = 25
max_attempts = 3
breaker_failure_ratio = 0.5
breaker_min_requests = 10
breaker_window = 30
breaker_open_ms = 3000
bulkhead_max_concurrency = 128

[[resilient_client]]
target = "storage-blob"          # the object store (RustFS/S3): bulk blob I/O — a BATCH target.
hot_path = false
latency_budget_ms = 5000         # blob round-trip budget seed (a multi-MB object is not a hot path).
timeout_ms = 4000                # LOOSER than the hot path by design — a blob read is allowed seconds.
backoff_base_ms = 100
max_attempts = 4
breaker_failure_ratio = 0.6
breaker_min_requests = 5
breaker_window = 20
breaker_open_ms = 5000
bulkhead_max_concurrency = 32    # bounded lower: a blob hop is heavy.

[[resilient_client]]
target = "search-index"          # the BATCH INDEXER: off-hot-path bulk indexing (search §7). The
hot_path = false
latency_budget_ms = 30000        # a bulk index batch p99 is whole seconds.
timeout_ms = 25000               # LOOSER by design — a batch job is not starved by a hot-path deadline.
backoff_base_ms = 250
max_attempts = 4
breaker_failure_ratio = 0.6
breaker_min_requests = 5
breaker_window = 20
breaker_open_ms = 10000          # long open window — a batch downstream recovers slowly.
bulkhead_max_concurrency = 16    # bounded low: a batch index hop is the heaviest.

[[firehose_retention]]
class = "ci_log"                  # ci.log.appended — the HEAVIEST producer (§4.3) → the LARGEST window.
window_frames = 49152            # seed (in-repo simulation): >= 4x the measured p99 reconnect gap (a high log-line rate).
p99_reconnect_gap_frames = 12288 # seed (in-repo simulation): the p99 frames a CI-log reconnect must backfill (D-10).

[[firehose_retention]]
class = "collab_op"              # the KN doc op-stream + presence — a moderate interactive rate.
window_frames = 8192             # seed (in-repo simulation): >= 4x the measured p99 gap. UNCHANGED across the KN
p99_reconnect_gap_frames = 2048  # seed (in-repo simulation): the p99 frames a collab-op reconnect must backfill (D-10).

[[firehose_retention]]
class = "chat_live"              # Chat live delivery + presence + agent partials — a human-paced rate.
window_frames = 2048             # seed (in-repo simulation): >= 4x the measured p99 gap (the smallest of the three).
p99_reconnect_gap_frames = 512   # seed (in-repo simulation): the p99 frames a chat-live reconnect must backfill (D-10).

[column_store_seam]
promote_events_per_sec_per_stream = 50000  # promotion criterion: a single-stream sustained rate above
degraded_publish_latency_p99_ms = 100      # promotion criterion: the per-aggregate publish-latency p99
promotion_owed = false                     # NO measured volume outgrows JetStream → seam stays NAMED.

[search_freshness]
freshness_p99_ms = 2000          # simulated under load: the §4.10 seconds-grade event→searchable
index_lag_alarm_margin_ms = 500  # the index-lag alarm fires at 2000−500 = 1500 ms — BELOW the budget,

[filtered_ann]
recall_at_k_bps = 10000               # simulated + held: exact recall@k (100.00 %) under a selective
brute_force_fallback_visible_bps = 2000 # the TUNED very-selective trigger: ≤ 20 % visible ⇒ fall back to
ivf_pq_promotion_live_vectors = 1000000 # the §3.3 HNSW→IVF-PQ promotion point (per-cell live vectors);

[projection_feeder]
promotion_ratio = 0.05  # contract 6.3 / OQ-C: the FROZEN > 5 % trigger Search consumes from Issues/KN
min_executions = 20     # the rolling-window floor: fewer executions is too noisy to promote on.

[timer_wheel_promotion]
promote_due_now_per_sec_per_cell = 100000 # §7.3 / OQ #5: the per-cell sustained due-now fire rate above
degraded_wheel_lag_budget = 0             # the `timer_wheel_lag` budget: any due timer left unfired past
promotion_owed = false                    # the 1M+ FLOW-D3-full run drained within the tick budget
