# =============================================================================================
# thresholds.toml — THE versioned thresholds file (P-S22 / P-038, master band M0)
# =============================================================================================
#
# The single, versioned source of truth for every Q32 "default-to-beat": the quantified
# threshold every M0 drill reads its number from. NO drill hardcodes a magic number — it reads
# its threshold from here (loaded by `myelin_substrate::thresholds`). A missing threshold is a
# LOUD error (the loader fails), never a silent default.
#
# CANON:
#   - external-insights/01-process-and-quality-doctrine.md §3 — "prove it or it isn't real":
#     gates resolve to quantified thresholds; NEVER weaken a threshold or invert an assertion to
#     make a check pass. A red gate is *information* and becomes a "claimed, not proven" row IN
#     THIS FILE (see [[claimed_not_proven]] below) — never edited green.
#   - planning/05-refined-shared-systems-architecture/00-platform-substrate.md §10.2 (the
#     telemetry signal set the thresholds key on) + §8.2 (the fail-static value W `[OPEN — LEGAL]`).
#   - planning/06-roadmaps/shared/00-platform-substrate.md §2 SUB-M0 item 5 (the Q32 defaults) +
#     §5 (the green-artifact / thresholds-file discipline) + §6 (the honesty register).
#
# DISCIPLINE (the thresholds-file rule, roadmap §5 / EI-01 §3): a milestone is done only when its
# drill emits a dated green artifact reading green. A drill that fails does NOT get its threshold
# softened; it is recorded as a [[claimed_not_proven]] row with a date and an owner, and stays
# there until the deliverable is genuinely repaired. A threshold here is edited only by re-running
# the drill that measures it (e.g. the M5 surge tunes the shed-budget numbers — never edited green
# without the drill).
#
# UNITS are frozen by the EventEnvelope names/units anchor (§2.10): durations in SECONDS (suffix
# `_secs`) or MINUTES (suffix `_mins`) as named; multipliers are bare integers; ceilings are
# integer causal depths.
# =============================================================================================

version = 1
# The date this file's current row set was last asserted against its drills (ISO-8601). Bump
# (with a [[claimed_not_proven]] or a drill-dated note) on every threshold change.
as_of = "2026-06-24"

# ---------------------------------------------------------------------------------------------
# [revocation] — N, the deprovision / revocation SLA (the disabled-user blast-radius bound).
# Roadmap §2 item 5: "N = 5 min revocation". This is the ceiling the fail-static window must sit
# under (static_max ≤ revocation_sla), and the bound ID-D1/SUB-D4 assert a revoked actor is denied
# within. Keyed on contract 1.10 / 4.11.
# ---------------------------------------------------------------------------------------------
[revocation]
sla_mins = 5

# ---------------------------------------------------------------------------------------------
# [surge] — the load-multiplier the harness drives the surge family at (SUB-D3, the F6 family).
# Roadmap §2 item 5: "30× surge". The 1×/10×/30× load generator (P-S02) reads its top multiplier
# here; SUB-D3 asserts the human lane holds, the agent lane sheds, cross-tenant impact is 0 at this
# multiplier. Keyed on contract 1.11.
# MEASURED + PROVEN GREEN at 30× by BUS-D7 (EB-29 / P-420, 2026-06-24): the Bus's reactive/dispatch
# tier shed lanes on the AgentMention surface — the protected human lane HELD (0 human sheds), the
# agent lane SHED with 429 + Retry-After, and a second tenant was UNAFFECTED (cross-tenant shed 0)
# under the full 30× agent-skewed surge. The agent-mention shed budget below is no longer just a
# named floor — it is asserted green at the surge multiplier here.
#
# MEASURED + PROVEN GREEN at 30× by SUB-D3 (P-S32 / P-433, 2026-06-24): the substrate's own
# principal-aware shed lane (shed::ShedLane) was driven by the P-S02 load generator at the full 30×
# agent/CI-skewed mix on ONE tenant against the substrate's public surfaces (HttpIntake + CiDispatch).
# The protected human lane HELD (0 human sheds; the human-lane p99 stayed within `human_lane_p99_budget_us`
# — a human is admitted into the reserved lane, never queued behind a machine lane), the agent + CI
# lanes SHED with 429 + Retry-After (shed-count > 0, every shed carrying the surface's Retry-After),
# and a SECOND tenant trickling baseline traffic was UNAFFECTED (cross-tenant shed 0). This is the
# substrate's slice of the F6 surge family (sibling to BUS-D7 / ID-D9); the per-surface shed-budget
# NUMBERS the surge measured against are tuned to measured values in the M5 follow-on (P-S33).
# ---------------------------------------------------------------------------------------------
[surge]
multiplier = 30
human_lane_p99_budget_us = 10000  # SUB-D3: the substrate's protected-human-lane p99 ceiling under 30× (P-S33 re-confirms).

# ---------------------------------------------------------------------------------------------
# [authz_surge] — the ID-D9 (F6) protected-human-lane authz-decision p99 budget under the 30× authz
# hot-path surge (identity §10/§13: authz is the highest-QPS shared system; contract 1.8
# `auth_decision_latency` / 4.11 the shed order on the authz surface).
#
# ID-D9 (P-ID-31 / P-424) drives a 30× agent-skewed surge of `check` calls on the authz hot path. The
# protected human lane must HOLD within this p99 budget while the agent lane SHEDS (429 + Retry-After,
# the §7.2 shed order) and cross-tenant impact stays 0. The SHAPE (a measured human-lane p99 ceiling
# under surge) is FROZEN; the NUMBER is the default-to-beat. A regression that pushes the human-lane
# p99 past it is a dated [[claimed_not_proven]] row, never a lowered bar (EI-01 §3).
#
# UNITS: MICROSECONDS (`_us`, the §2.10 names/units anchor). A `check` is an in-cell, memo-bounded
# tuple resolution; the human-lane p99 sits far under this ceiling even under the surge.
#
# MEASURED + PROVEN GREEN under the 30× surge by ID-D9 (P-ID-31 / P-424, 2026-06-24): the authz
# hot-path shed lane on the HttpIntake authz surface held the protected human lane (0 human sheds,
# human-lane check p99 within budget), the agent lane SHED with 429 + Retry-After (shed-count > 0),
# and a second tenant was UNAFFECTED (cross-tenant impact 0) under the full 30× agent-skewed surge.
# ---------------------------------------------------------------------------------------------
[authz_surge]
human_lane_p99_budget_us = 5000  # ID-D9: the protected human lane's authz-decision p99 ceiling under 30×.

# ---------------------------------------------------------------------------------------------
# [fail_static] — W, the bounded-staleness window for FailStatic<T> (contract 1.10 / 4.11).
#
# The MECHANISM and the constraint `static_max ≤ revocation-SLA` AND `static_max ≥ agent-token-TTL`
# (architecture §8.2) ship in M0 REGARDLESS and are enforced in the FailStatic constructor (P-S18).
# The VALUE W is `[OPEN — LEGAL]` — a DPO-ratified call (L-1, the one substrate-owned legal flag,
# roadmap §6): it is the residual GDPR-revocation exposure window, handed to counsel, NOT an
# engineering default set silently.
#
# Until the DPO ratifies, `static_max_secs` is ABSENT (commented out). The loader exposes W as an
# `Open` variant carrying its constraint; reading W as a concrete number is a LOUD error until the
# legal flag clears. `static_max_default_secs` is the engineering *seed* the mechanism is drilled
# against (== revocation_sla = 5 min = 300 s, the largest value the constraint admits) — it is NOT
# the ratified W and is labelled as a seed, not a default-to-beat.
# ---------------------------------------------------------------------------------------------
[fail_static]
status = "OPEN — LEGAL"          # L-1, DPO-ratified; the VALUE is absent until counsel clears it.
owner = "DPO / Legal"
# static_max_secs = <RATIFIED W>  # [OPEN — LEGAL] — intentionally absent (a loud error to read).
static_max_default_secs = 300    # the engineering SEED the mechanism is drilled against (P-S18/P-S25).
# The LOWER bound of the constraint (§8.2): static_max ≥ agent-token TTL — the window must CONTAIN
# the short-lived per-run agent token (ID-1 / GD-3 / ADR-17). The agent token's life == its run
# life; 60s is the v1 seed floor (the FailStatic constructor rejects any static_max below it,
# P-S18). The real per-run TTL is set by mint_run_token (Identity M1); this is the substrate-side
# bound the constraint is enforced against in M0.
agent_token_ttl_secs = 60
# The constraint that ships regardless and is enforced structurally in the constructor (P-S18):
constraint = "static_max <= revocation-SLA AND static_max >= agent-token-TTL"
# CONSUMERS (confirmed in place — never re-defined): the W bound is consumed by Identity's S6
# fail-static availability cache (P-ID-15 / P-073, `failstatic_cache::FailStaticCache`), which reads
# this row + the `[revocation]` SLA and constructs `FailStatic<CoarseGrant>` against them (so a
# `static_max > revocation-SLA` window cannot be built). The ID-D2 drill asserts authenticated
# traffic survives a hiccup on the coarse grant + a just-revoked subject is denied through S6;
# `staleness_age ≤ static_max ≤ revocation-SLA` is the green-artifact bound. The DPO ratification of
# the *number* W stays the `[OPEN — LEGAL]` L-1 follow-on (parallel legal — the floor does not wait).

# ---------------------------------------------------------------------------------------------
# [rpo_rto] — the durability objectives the restore-verify gate (STOR-D1/D2, SUB-D6) asserts.
# Roadmap §2 item 5: "RPO ≤ 5 min, RTO ≤ 1h/tenant ≤ 4h/cell". These are PROVEN in M1 (the
# substrate supplies the injection/assertion half; the value lives here from M0 so the M1 drill
# reads it). Keyed on contract 11.5.
# ---------------------------------------------------------------------------------------------
[rpo_rto]
rpo_max_mins = 5             # recovery-point objective: at most 5 minutes of data may be lost.
rto_tenant_max_mins = 60     # recovery-time objective, per tenant: ≤ 1 hour.
rto_cell_max_mins = 240      # recovery-time objective, per cell: ≤ 4 hours.

# ---------------------------------------------------------------------------------------------
# [online_migration] — the STOR-D8 lock-wait budget the online-migration drill (P-ST-21 / P-126)
# asserts against. Drill catalogue row STOR-D8: "expand→backfill→contract on a restored prod-scale
# copy under load → no blocking lock beyond budget; 0 downtime. Telemetry: lock-wait p99; 0
# downtime." (storage.md §3.1: forward-only online migrations — lock time measured against a
# RESTORED copy, now that restore-verify exists.)
#
# This is the PROPOSED DEFAULT-TO-BEAT measured here at prod-scale (P-126) and re-confirmed at
# CELL scale in M5 (P-ST-34 / world-scale). The online idiom's defining property is that each
# step (Expand = a nullable add / CREATE INDEX CONCURRENTLY; Backfill = throttled off-hot-path
# batches; Contract = a validated swap) takes only a SHORT metadata/catalog lock, never a
# table-rewrite lock at write QPS. A step whose p99 lock-wait exceeds this budget is NOT the
# online idiom and the drill FAILs (it is the blocking-ALTER bug class the runner rejects, now
# proven empirically under load). `downtime_max_ms = 0` is the 0-downtime invariant: an online
# migration NEVER takes the table offline. Weakening either number to pass is forbidden (EI-01
# §3) — a red is a dated `[[claimed_not_proven]]` scorecard row, never a lowered bar. Keyed on
# contract 1.5 (the migration runner) + 11.5 (the restored copy STOR-D8 rehearses against).
#
# PROVEN GREEN at the substrate level by SUB-D10 (P-S34 / P-435, M5, 2026-06-24): the substrate's
# online-migration-under-load chain — the migration runner (1.5) tied to the P-S26 restore-verify
# machinery (the migration runs on a RESTORED prod-scale copy, §9.2's lock-time-against-a-restore
# rule) under the P-S02 load generator's concurrent write traffic (the in-flight writers DERIVED from
# a real 30× generator run) — held this budget: an expand→backfill→contract migration on the restored
# 50M-row copy had its lock-wait p99 WITHIN budget, 0 errored writes (the online idiom takes only
# short metadata/catalog/row-level locks, so the concurrent writers proceeded), and 0 downtime, and
# the restored copy stayed cross-seam consistent across the migration. The blocking-ALTER counter-case
# BLEW the budget (the dynamic proof the static gate cannot make). The lock-cost MODEL is the storage
# tier's (STOR-D8, migration_under_load.rs) — REUSED, not duplicated; SUB-D10 adds the substrate-level
# restore+load+telemetry wiring. CELL-scale re-confirm under WORLD-SCALE load is the M5 follow-on
# P-S35 / P-436.
# ---------------------------------------------------------------------------------------------
[online_migration]
lock_wait_p99_max_ms = 500   # STOR-D8: an online step's p99 lock-wait must stay ≤ 500 ms (a short
                             # metadata/catalog lock), never a table-rewrite lock at write QPS.
downtime_max_ms = 0          # STOR-D8: 0 downtime — an online migration NEVER takes the table offline.

