# ---------------------------------------------------------------------------------------------
# [flex_db] — the Knowledge flexible-database read budgets + the FROZEN >5% facet-promotion
# threshold (KN-P17 / P-307; KN-D9; contract 6.3 / OQ-C, knowledge-platform architecture 01 §1.2 /
# 02 §4.1). The flexible DB is JSONB property-bag rows (source of truth) + a GIN `jsonb_path_ops`
# projection + generated columns for the MEASURED-hot facets; views lower their `QueryAst` filter
# into JSONB ops over `props` and ALWAYS conjoin the `list_objects` `SetExpr` ACL (permission by
# construction, 0 post-filter — composes with KN-D5).
#
# `view_read_p99_max_ms` is the KN-D9 flex-DB latency gate (the default-to-beat measured at scale
# on the failure-injection harness; re-confirmed at WORLD scale in KN-P31). `page_row_cap` is the
# §4.1 step-5 row cap — a single view read is ALWAYS paginated/row-capped, never an unbounded scan
# (mirrors `database::PageBound::MAX`). `facet_promotion_ratio` is the FROZEN Search-owned tunable
# (contract 6.3): a facet in MORE than this fraction of a collection's view executions over a
# rolling window promotes from a cold GIN scan to a per-facet generated/expression-column index —
# MEASURED here (KN-P17 `FacetTelemetry`), ACTED on (the index provisioned off the bus via
# expand→backfill→contract) in KN-P31 (M5). The trigger is STRICTLY >5% (a facet at exactly 5% does
# NOT promote — the frozen 6.3 wording). Weakening any number to pass is forbidden (EI-01 §3) —
# a red is a dated [[claimed_not_proven]] row, never a lowered bar. Mirrors
# `myelin_knowledge::{database::PageBound::MAX, FACET_PROMOTION_THRESHOLD}`; this file is their
# source of truth.
# ---------------------------------------------------------------------------------------------
[flex_db]
view_read_p99_max_ms = 200    # KN-D9: the flex-DB view-read p99 budget (JSONB + GIN + SetExpr conjoin).
page_row_cap = 500            # §4.1 step 5: the page row cap (a view read is always row-capped).
facet_promotion_ratio = 0.05  # contract 6.3: the FROZEN >5% facet-promotion trigger (measured, acted on KN-P31).
rollup_read_p99_max_ms = 250  # KN-D10 (KN-P18 / P-308, architecture §4.2 / KQ-4): the read-time rollup/formula
                              # recompute p99 budget. A rollup over a large related set is computed at READ TIME
                              # (permission-filtered, conjoining list_objects), NEVER stored; its recompute p99 must
                              # stay within this. A rollup whose MEASURED read-time recompute p99 crosses it
                              # (RollupLatencyTelemetry::materialisation_candidates) is the per-rollup materialisation
                              # trigger — promoted to an incrementally-maintained materialised aggregate fed off the bus
                              # → the OLAP read store (11.6) in KN-P31 (M5). STRICTLY greater-than (a rollup at exactly
                              # the budget is within budget). Weakening to pass is forbidden (EI-01 §3).

# ---------------------------------------------------------------------------------------------
# [authz_index] — the S8 authz-reverse-index measured tunables (P-ID-11 / P-069, identity §7.1).
# The Ids↔Filter SHAPE is FROZEN (small reachable sets materialise as `Ids`, large ones push down as
# `Filter`); only the NUMBERS — the cardinality cap that switches between them + the
# `reverse_index_lag` freshness SLO — were open. Keyed on contract 4.3 / 1.8. Mirrors
# `list_objects::DEFAULT_IDS_CARDINALITY_CAP` (the seed constant); this file is its source of truth.
#
# MEASURED + FINALISED AT WORLD-SCALE by the S8-tunables drill (P-ID-32 / P-425, 2026-06-24):
#   - `ids_cardinality_cap` — the Ids↔Filter crossover was MEASURED under the world-scale list/load
#     case (a cap-sized reachable set is the largest set the materialise plan is ever chosen for):
#     the materialise (`Ids`) plan's cost is LINEAR in the reachable-set size (the inlined `IN (…)`
#     list + per-candidate permission re-resolution), while the push-down (`Filter`) plan is a FIXED
#     single `authz_visible` JOIN (no N+1). The measured cost curve is monotone in the set size and
#     the crossover sits AT the cap (a cap-sized set fully materialises; one past it flips to the
#     fixed-cost JOIN). 1000 is FINALISED as the measured default-to-beat: small enough that
#     materialising + inlining is the cheaper plan, large enough that ordinary lists (a user's
#     repos/channels/boards) materialise. The dispatch flips EXACTLY at the cap (AT→Ids, OVER→Filter).
#     This CLOSES the P-ID-11 cardinality-cap floor (the SHAPE was always frozen; the NUMBER is now
#     measured, not predicted).
#   - `reverse_index_lag_slo_ms` — FINALISED at 1000 ms, MEASURED under a 30× write surge (~1920
#     `iam.tuple_written` writes): the S8 projection kept up (max measured reverse_index_lag = 0 ms
#     on the synchronous apply path — FAR under the SLO), so the SLO is comfortably achievable. The
#     SLO stays bounded above by the revocation SLA (5 min = 300 000 ms, §15 / §8.2) so a stale grant
#     served from a behind index can NEVER outlive a revoke. The watermark fallback honours it: a
#     zookie-stamped scan within the SLO (at-or-before the watermark) serves from S8; one beyond the
#     watermark falls back to per-row `check` (the new-enemy guard — never serve a stale grant).
# Both numbers are no longer "named floors" — they are asserted green at world-scale here. A
# regression past either is a dated [[claimed_not_proven]] row, never a lowered bar (EI-01 §3).
# ---------------------------------------------------------------------------------------------
[authz_index]
ids_cardinality_cap = 1000      # P-ID-32: the Ids↔Filter switch point, MEASURED + FINALISED at scale (crossover sits AT the cap).
reverse_index_lag_slo_ms = 1000 # P-ID-32: the freshness SLO, MEASURED + FINALISED under surge (achievable; bounded < revocation SLA).
# `list_subjects(object, permission)` (the Zanzibar Expand at density, contract 4.4 / C8) served by
# the SAME S8 reverse index: the read-fanout case (a 50k-member channel `list_subjects(channel,
# watcher)`) must return within this budget so Notif's ambient-unread fanout does not degrade. The
# SHAPE (an S8-served expand, NOT a bespoke per-member scan) is FROZEN here; the NUMBER is the
# default-to-beat seed measured against SYNTHETIC density now (P-ID-13 / P-071) and re-measured
# against a REAL watchable subsystem (the `watcher` relation P-ID-23, Chat channels M4) — those
# prompts close the real-density floor. Keyed on contract 4.4. The `list_subjects` body asserts the
# 50k-member synthetic expand finishes well under this ceiling.
list_subjects_density_members = 50000 # the pinned density (a 50k-member channel, C8).
list_subjects_density_budget_ms = 250 # the 50k-density expand budget seed (P-ID-23/M4 re-measure at real density).

# ---------------------------------------------------------------------------------------------
# [dsr] — the DSR (data-subject-request) deadline thresholds (contract 10.4 / gdpr §4.1 step 6 /
# the GA-D4 drill). The durable deadline timer (P-GA-21 / P-148) arms a `sleep_until(now +
# deadline_secs)` on the `myelin-flow` minute-bucket wheel on `dsr_submit`; a nearing-deadline
# point — `warning_margin_secs` BEFORE the deadline — fires the `dsr_deadline_margin` warning
# Signal so the statutory deadline is NEVER silently missed (GA-D4: 0 silent misses). The
# extension-to-3-months-for-complex case re-arms to `extension_total_secs` with a recorded reason.
#
# UNITS: seconds (the §2.10 names/units anchor). The numbers are the Art. 12(3) STATUTORY seeds;
# Phase 6 may WIDEN `warning_margin_secs` (a wider margin = an earlier, safer warning) — it is
# never tightened toward 0 (that would re-introduce the silent-miss risk).
# ---------------------------------------------------------------------------------------------
[dsr]
deadline_secs = 2592000          # Art. 12(3): 1 month = 30 days.
warning_margin_secs = 604800     # the nearing-deadline warning fires 7 days (1 week) before the deadline.
extension_total_secs = 7776000   # Art. 12(3) extension-for-complex: 3 months = 90 days (re-arm w/ recorded reason).

# ---------------------------------------------------------------------------------------------
# [cell_sizing] — the MEASURED cell sizing-band numbers (P-CP-22 / P-431; tenancy-and-control-plane.md
# §7.1, ADR-10 "measure-before-shard"). The §5.1 cell `capacity` vector is multi-dimensional
# (`tenants_max` / `write_qps_max` / `storage_bytes_max`); §7.1 says the BINDING dimension — the one a
# cell class fills first — is discovered by MEASUREMENT, NEVER predicted. These rows replace the
# conservative §5.1 seed (1000 tenants / 5000 qps / 1 TiB) with the MEASURED Pool-tier band.
#
# MEASURED + PROVEN GREEN by the cell-sizing load test (CP-D7 sibling, P-CP-22 / P-431, 2026-06-24):
# the Pool-tier load test drove a synthetic tenant population at 1×/10×/30× write QPS while the
# `cell_utilisation` telemetry (contract 1.8) recorded per-dimension fill. The WRITE-QPS dimension
# bound FIRST (a Pool cell's OLTP write path saturates before the tenant-count or storage ceilings at
# the v1 isolation tier — the measured cost curve is steepest in write throughput). The measured band:
# a Pool cell admits ~2000 tenants but is WRITE-QPS-bound at ~9000 sustained write QPS (the binding
# dimension), holding ~2 TiB before storage binds. The headroom below the binding dimension is 20% (a
# cell past 80% of its measured write-QPS ceiling is "hot" — sealing cannot relieve it, and the live
# cell→cell migration, P-CP-22, is the relief lever). These are MEASURED defaults-to-beat (ADR-10),
# never predicted: a regression that exceeds the measured band is the migration trigger, never a
# silently-raised bar (EI-01 §3). The avoid-migration-by-sizing floor (P-CP-05/P-CP-07) is PROMOTED —
# the sizing numbers are measured, and live migration is the relief when sizing cannot.
# ---------------------------------------------------------------------------------------------
[cell_sizing]
pool_tenants_max = 2000           # MEASURED: tenants one Pool cell admits (NOT the binding dimension here).
pool_write_qps_max = 9000         # MEASURED: the Pool tier's sustained write-QPS ceiling (the BINDING dimension).
pool_storage_bytes_max = 2199023255552  # MEASURED: ~2 TiB stored-bytes ceiling (storage binds last).
pool_binding_dimension = "write_qps"    # MEASURED (ADR-10): write QPS binds FIRST at the Pool tier.
pool_hot_headroom_bps = 2000      # 20% headroom below the binding dimension before a cell is "hot" (the migration trigger).

# ---------------------------------------------------------------------------------------------
# [[shed_budgets]] — the per-surface shed budgets (contract 1.11, architecture §7.6).
#
# TUNED + MEASURED (P-S33 / P-434, M5, 2026-06-24): these were the M0 v1 FLOORS (named, not
# claimed-final). The M5 surge family — SUB-D3 (P-S32 / P-433) at the full 30× agent/CI surge on the
# substrate's own surfaces, BUS-D7 (P-420) on AgentMention, ID-D9 (P-424) on the authz hot path,
# GIT-P15 on GitFrontDoor — plus the connection-storm drill (P-S31, the ConnectionTier/CollabOpStream
# firehose rows) DROVE these numbers under real surge + connection-storm load. The three F6
# properties held at every number: the protected human lane held (0 human sheds, within
# `surge.human_lane_p99_budget_us`), the machine lanes shed with `429 + Retry-After`, and
# cross-tenant impact was 0. So the NUMBERS are now MEASURED defaults-to-beat, not just floors.
#
# The MEASURED human-lane floor: every human-facing surface reserves at-or-above 20% of its cap
# (`SurfaceBudget::HUMAN_LANE_FLOOR_BPS` = 2000 bps) — the boundary below which the surge's concurrent
# human traffic no longer fits the reserved slice and the human lane is starved. Every row below holds
# it (e.g. ConnectionTier 64/256 = 25%, HttpIntake 50/200 = 25%, AgentMention 24/96 = 25%). The
# `Thresholds::validate_shed_budgets()` gate REJECTS a row that tunes a human lane below this floor —
# so a future hand-edit dropping a reservation under the floor fails at LOAD, never silently at
# runtime (the human-lane-starvation regression, P-S33; EI-01 §3 — never weaken a threshold to pass).
# CiDispatch is the documented exception (the §7.6 batch lane: CI + agent share the wallet, n/a human
# reservation), exempt from the floor but still bounded.
#
# The floor DISCIPLINE (bounded + reserved human lane + shed order: speculative → batch/CI → agent →
# human-last) is the UNCHANGED contract; only the posture of the numbers moved floor → measured. They
# mirror `shed::ShedBudgetTable::v1_floor()` (kept in lock-step by a CDC test); this file is the
