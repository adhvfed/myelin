# contract-coverage.toml — the coverage manifest the contract-coverage scanner (P-S21 → P-037)
# reconciles against the frozen contract surface.
#
# SOURCE OF TRUTH FOR THE ROW SET: every `N.M` row of
#   planning/05-refined-shared-systems-architecture/contract-index.md  (§1–§13).
# The scanner parses that file directly for the authoritative row set, then checks THIS file:
#   - every contract-index row MUST have exactly one [[contract]] entry here (a missing one is a
#     silently-dropped contract — a build failure);
#   - status = "covered"  ⇒ `cdc` lists the test file(s) carrying the provider+consumer CDC pair;
#                            each named file MUST exist on disk and carry BOTH a provider-side and a
#                            consumer-side marker (a falsely-claimed pair is a build failure);
#   - status = "deferred" ⇒ `landing` names the prompt that will ship the CDC pair (an un-named
#                            floor is a build failure — EI-01 §1, name-your-floors).
#
# DOCTRINE: external-insights/01-process-and-quality-doctrine.md §5 — convert the "every contract
# has a CDC pair" discipline into a committed, LOUD, mechanical gate. A contract violation dropped
# silently is a multi-day misdiagnosis. NEVER weaken this gate to pass; ship the pair instead.
#
# WHEN A LATER PROMPT SHIPS A CONTRACT: flip its row here from `deferred` to `covered` and name its
# CDC file(s). The scanner is the meta-gate that prompt's DEFINITION OF DONE leans on.
#
# `landing` ids below are the GLOBAL ledger ids (P-NNN) from
#   planning/07-prompts/README.md  (the run table). The scanner does not verify the landing id is a
# real prompt (that is the ledger's job); it requires only that one is NAMED.

