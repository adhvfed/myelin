# frozen EffectivePolicy + the recorded IntersectionProof) + consumer (an EffectApi-side caller that
# applies a proposed effect iff its capability is inside the effective set) CDC pair ships here. The
# fourth conjunct (the ordinary object check run AS the agent) is wired via delegation_with_check_in
# over the live CheckEngine. ID-D5 (drill_id_d5_delegation) proves 0 effects escape the intersection
