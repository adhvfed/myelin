<!DOCTYPE html>
<!-- R3 sketch · G-7 PR diff / files-changed · STATE: loading — STRUCTURE SKELETON (R-13 §A.2:
     gutters + line-number columns render FIRST; content bars shimmer where code lands).
     No spinner, no "Loading…" text. aria-busy on the region + ONE debounced polite live region.
     The PR header renders real data the instant PrVM resolves (it arrives before the diff);
     here the header is already real and only the file index + diff body skeleton.
     Rails: semantic tokens only, logical properties, 100dvh, reduced-motion kills the pulse. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR #211 · Files changed · myelin — R3 sketch (skeleton)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--text-primary);
  font:var(--fs-body-sm)/var(--lh-body) var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--font-mono)}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{flex:none}

.shell{display:grid;grid-template-rows:40px 1fr;height:100dvh}
.topbar{display:flex;align-items:center;gap:var(--space-3);border-block-end:var(--hairline) solid var(--border);
  padding-inline:var(--space-3);background:var(--surface-raised)}
.brand{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--weight-semibold)}
.brand .glyph{width:14px;height:14px;border:var(--border-2) solid var(--text-muted);border-radius:var(--radius-1)}
.crumbs{display:flex;align-items:center;gap:var(--space-1);color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-caption)}
.crumbs b{color:var(--text-primary);font-weight:var(--weight-medium)}
.crumbs .sep{color:var(--text-subtle)}
.kbar{margin-inline-start:auto;display:flex;align-items:center;gap:var(--space-2)}
.themebtn{font-size:var(--fs-caption);color:var(--text-muted);border:var(--hairline) solid var(--border);border-radius:var(--radius-1);padding:var(--space-1) var(--space-2)}
.themebtn:hover{color:var(--text-primary);background:var(--surface-hover)}
.bodyrow{display:grid;grid-template-columns:48px 1fr;min-block-size:0}
.rail{border-inline-end:var(--hairline) solid var(--border);background:var(--surface-raised);
  display:flex;flex-direction:column;align-items:center;padding-block-start:var(--space-2);gap:2px}
.rail a{inline-size:34px;block-size:34px;display:grid;place-items:center;color:var(--text-subtle);border-radius:var(--radius-1);text-decoration:none}
.rail a[aria-current="page"]{color:var(--text-primary);background:var(--surface-hover)}

.main{display:grid;grid-template-rows:auto auto 1fr;min-block-size:0}
.prhead{padding:var(--space-3) var(--space-4) 0;background:var(--surface-raised);border-block-end:var(--hairline) solid var(--border)}
.prtitle{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap}
.prtitle h1{margin:0;font-size:var(--fs-h3);font-weight:var(--weight-semibold)}
.prtitle .num{font-family:var(--font-mono);color:var(--text-subtle)}
.pill{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--fs-caption);font-weight:var(--weight-medium);
  border:var(--hairline) solid var(--border);border-radius:var(--radius-pill);padding:1px var(--space-2);color:var(--text-primary)}
.pill .ic-info{color:var(--info)}
.tabs{display:flex;gap:var(--space-1);margin-block-start:var(--space-2)}
.tabs a{padding:var(--space-1) var(--space-2);color:var(--text-muted);text-decoration:none;
  border-radius:var(--radius-1) var(--radius-1) 0 0;font-size:var(--fs-body-sm)}
.tabs a[aria-current="page"]{color:var(--text-primary);background:var(--surface-hover);font-weight:var(--weight-medium)}

.difftools{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);
  border-block-end:var(--hairline) solid var(--border);background:var(--surface-raised)}
.seg{display:flex;border:var(--hairline) solid var(--border-strong);border-radius:var(--radius-1);overflow:hidden}
.seg button{padding:var(--space-1) var(--space-2);font-size:var(--fs-caption);color:var(--text-muted);
  border-inline-end:var(--hairline) solid var(--border);min-block-size:var(--target-min)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--surface-hover);color:var(--text-primary);font-weight:var(--weight-medium)}
.difftools .spacer{flex:1}

/* ── skeleton primitives: structure first, shimmer only where content lands ── */
.sk{background:var(--surface-hover);border-radius:var(--radius-1);animation:skpulse 1.4s var(--ease-standard) infinite}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.55}}
/* reduced-motion: the token layer zeroes animation-duration — the bar simply holds still */

.content{display:grid;grid-template-columns:272px 1fr;min-block-size:0}
.treecol{border-inline-end:var(--hairline) solid var(--border);background:var(--surface-raised);
  overflow:auto;min-block-size:0;padding:var(--space-2) 0}
.treecol h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle);
  margin:0;padding:var(--space-1) var(--space-3);font-weight:var(--weight-semibold)}
.trow{display:flex;align-items:center;gap:var(--space-2);padding:4px var(--space-3)}
.trow .sk{block-size:10px}

.diffcol{overflow:auto;min-block-size:0;background:var(--surface)}
.file{border-block-end:var(--hairline) solid var(--border)}
.filehd{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);
  background:var(--surface-overlay);border-block:var(--hairline) solid var(--border)}
.filehd .sk{block-size:11px}

table.code{inline-size:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:var(--fs-caption);line-height:1.55}
table.code td{vertical-align:middle;padding-block:2px}
/* the gutter structure is REAL from the first paint: fixed-width, hairline-separated */
.ln{inline-size:40px;text-align:end;padding-inline-end:var(--space-2);user-select:none}
.ln .sk{inline-size:22px;block-size:9px;display:inline-block}
.ln2{border-inline-end:var(--hairline) solid var(--border)}
.cd{padding-inline:var(--space-3)}
.cd .sk{block-size:9px;display:inline-block}
tr.hunk td{background:var(--surface-raised);border-block:var(--hairline) solid var(--border);padding:4px var(--space-3)}
tr.hunk .sk{inline-size:180px;block-size:9px;display:inline-block}
</style>
</head>
<body>
