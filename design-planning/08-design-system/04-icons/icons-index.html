<title>Myelin icons — CORE set (iteration 1)</title>
<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  body.dark {
    --bg: #0d1117;
    --panel: #161b22;
    --ink: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    transition: background .2s, color .2s;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  .controls { margin-left: auto; display: flex; gap: .75rem; align-items: center; }
  button {
    font: inherit; cursor: pointer;
    padding: .4rem .8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  label { color: var(--muted); display: flex; gap: .4rem; align-items: center; }
  input[type=range] { width: 120px; }

  /* The container sets color: — every inline SVG inherits it via currentColor. */
  main {
    color: var(--ink);
    padding: 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 1rem;
  }
  .cell {
    margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: .6rem;
    padding: 1rem .5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .cell svg {
    width: var(--size, 32px);
    height: var(--size, 32px);
    display: block;
    /* no stroke/fill set here — proves inheritance from container color */
  }
  figcaption {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }
  /* An accent swatch row to prove currentColor follows any color, not just ink */
  .accent { color: #d9480f; }
  body.dark .accent { color: #ff922b; }
</style>
</head>

  var sizeval = document.getElementById('sizeval');
