      NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
      MYELIN_KMS_SEAL_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    script: >-
      cargo run -p myelin-harness --bin make-it-real-scorecard --
