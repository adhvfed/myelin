# Myelin's local data-layer stack under Service Federation.
#
# This intentionally models the containers directly instead of wrapping
# docker-compose.dev.yml. Direct services let `fed isolate enable` scope every
# container, named volume, and host port independently for each Git worktree.

parameters:
  POSTGRES_PORT:
    type: port
    default: 5433
  S3_PORT:
    type: port
    default: 9000
  VALKEY_PORT:
    type: port
    default: 6380
  NATS_PORT:
    type: port
    default: 4222
  NATS_MONITOR_PORT:
    type: port
    default: 8222
  OPENAI_API_KEY:
    type: secret
    source: manual
    description: "OpenAI API key (GPT-5.6 Luna) for hosted-agent work; resolved from the myelin/myelin Cloud vault."

services:
  postgres:
    image: postgres:16
    ports: ["{{POSTGRES_PORT}}:5432"]
    environment:
      POSTGRES_USER: myelin_admin
      POSTGRES_PASSWORD: myelin_dev_pw
      POSTGRES_DB: myelin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    startup_message: "Postgres: localhost:{{POSTGRES_PORT}}"
    volumes:
      - fed-myelin-pg-data:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      command: pg_isready -U myelin_admin -d myelin
      timeout: 60s

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    ports: ["{{S3_PORT}}:9000"]
    environment:
      RUSTFS_ACCESS_KEY: myelin_dev_access
      RUSTFS_SECRET_KEY: myelin_dev_secret
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - fed-myelin-rustfs-data:/data
    healthcheck:
      command: curl -fsS http://localhost:9000/health
      timeout: 90s

  rustfs-bucket:
    depends_on: [rustfs]
    startup_message: "S3: http://localhost:{{S3_PORT}} (bucket myelin-dev)"
    migrate: >-
      docker run --rm --network host
      -e AWS_ACCESS_KEY_ID=myelin_dev_access
      -e AWS_SECRET_ACCESS_KEY=myelin_dev_secret
      -e AWS_DEFAULT_REGION=fr-par
      amazon/aws-cli:latest
      --endpoint-url http://localhost:{{S3_PORT}}
      s3api head-bucket --bucket myelin-dev
      ||
      docker run --rm --network host
      -e AWS_ACCESS_KEY_ID=myelin_dev_access
      -e AWS_SECRET_ACCESS_KEY=myelin_dev_secret
      -e AWS_DEFAULT_REGION=fr-par
      amazon/aws-cli:latest
      --endpoint-url http://localhost:{{S3_PORT}}
      s3 mb s3://myelin-dev

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["{{VALKEY_PORT}}:6379"]
    startup_message: "Valkey: redis://localhost:{{VALKEY_PORT}}"
    volumes:
      - fed-myelin-valkey-data:/data
    healthcheck:
      command: valkey-cli ping
      timeout: 60s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "{{NATS_PORT}}:4222"
      - "{{NATS_MONITOR_PORT}}:8222"
    startup_message: "NATS: nats://localhost:{{NATS_PORT}}"
    volumes:
      - fed-myelin-nats-data:/data
    healthcheck:
      command: wget -q -O- http://localhost:8222/healthz
      timeout: 60s

entrypoints: [postgres, rustfs-bucket, valkey, nats]

scripts:
  # Foundation check for the hosted-agent work: confirm the vault OPENAI_API_KEY is
  # injected and GPT-5.6 Luna is reachable. Never prints the key (length only).
  luna-ping:
    environment:
      OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
    script: |
      set -eu
      if [ -z "${OPENAI_API_KEY:-}" ] || printf '%s' "$OPENAI_API_KEY" | grep -q '{{'; then
        echo "OPENAI_API_KEY NOT INJECTED"; exit 3
      fi
      echo "OPENAI_API_KEY injected (len=${#OPENAI_API_KEY})"
      curl -sS https://api.openai.com/v1/chat/completions \
        -H "Authorization: Bearer $OPENAI_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{"model":"gpt-5.6-luna","messages":[{"role":"user","content":"Reply with exactly the token: LUNA_OK"}]}' \
        | head -c 3000
      echo

  # SPIKE: Luna-driven hosted-agent loop with per-turn token metering + a HARD spend cap.
  # Throwaway de-risking proof for the hosted-agent pillar (scripts/agent-spike/). Read-only,
  # path-jailed tools; halts before any paid call once running cost >= --cap-usd.
  # Extra args after `--` pass through, e.g. override the goal or cap:
  #   fed run agent-spike -- --cap-usd 0.0001 --goal "..."
  agent-spike:
    environment:
      OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
    script: |
      set -eu
      python3 scripts/agent-spike/agent.py \
        --repo /home/adhv/Projects/myelin \
        --cap-usd 0.15 \
        --goal "What are the exact resource limits (cpu, memory, disk, pids, timeout) of the linux-build-v1 CI execution profile, and which file+function defines them?" \
        "$@"

  # Live hosted-agent TOOL-EXECUTION drill: a real Luna agent invokes the governed git
  # check-status READ tool against seeded live-PG data and answers, metered against the wallet.
  # No `depends_on` — it reaches the ALREADY-RUNNING PG directly (avoids a fed-isolate stack
  # conflict); the key is injected from the vault. Runs the #[ignore] live drill:  fed run agent-tool-drill
  agent-tool-drill:
    environment:
      OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
      # Hardcode the REAL myelin-postgres (:5433, the persistent dev stack), NOT {{POSTGRES_PORT}}
      # (which fed resolves to its ephemeral isolate that lacks the myelin schema).
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:5433/myelin"
      AWS_DEFAULT_REGION: "fr-par"
      MYELIN_REGION: "fr-par"
      S3_REGION: "fr-par"
    script: |
      set -eu
      cargo test -p myelin-agent-host --test e2e_luna_tool_live -- --ignored --nocapture

  provision:outbox-publisher:
    depends_on: [postgres, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PUBLISHER_DATABASE_URL: "postgres://myelin_outbox_publisher_fr_par:myelin_outbox_publisher_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PROVISION_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_OUTBOX_PUBLISH_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
      MYELIN_OUTBOX_PUBLISHER_BATCH: "4"
      MYELIN_OUTBOX_PUBLISHER_POLL_MS: "100"
      MYELIN_OUTBOX_PUBLISHER_BACKOFF_MS: "500"
      MYELIN_OUTBOX_PUBLISHER_STATEMENT_TIMEOUT_MS: "1000"
      MYELIN_OUTBOX_PUBLISHER_MAX_ENVELOPE_BYTES: "262144"
      MYELIN_OUTBOX_STREAM_MAX_AGE_SECONDS: "7776000"
      MYELIN_OUTBOX_STREAM_MAX_BYTES: "67108864"
      MYELIN_OUTBOX_STREAM_MAX_MESSAGES: "100000"
      MYELIN_OUTBOX_STREAM_REPLICAS: "1"
      MYELIN_OUTBOX_STREAM_DEDUP_SECONDS: "120"
      MYELIN_OUTBOX_PUBLISH_ACK_TIMEOUT_MS: "2000"
      MYELIN_OUTBOX_PUBLISHER_PASS_TIMEOUT_MS: "20000"
    script: cargo run -p myelin-outbox-publisher -- provision

  serve:outbox-publisher:
    depends_on: [postgres, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PUBLISHER_DATABASE_URL: "postgres://myelin_outbox_publisher_fr_par:myelin_outbox_publisher_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PROVISION_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_OUTBOX_PUBLISH_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
      MYELIN_OUTBOX_PUBLISHER_BATCH: "4"
      MYELIN_OUTBOX_PUBLISHER_POLL_MS: "100"
      MYELIN_OUTBOX_PUBLISHER_BACKOFF_MS: "500"
      MYELIN_OUTBOX_PUBLISHER_STATEMENT_TIMEOUT_MS: "1000"
      MYELIN_OUTBOX_PUBLISHER_MAX_ENVELOPE_BYTES: "262144"
      MYELIN_OUTBOX_STREAM_MAX_AGE_SECONDS: "7776000"
      MYELIN_OUTBOX_STREAM_MAX_BYTES: "67108864"
      MYELIN_OUTBOX_STREAM_MAX_MESSAGES: "100000"
      MYELIN_OUTBOX_STREAM_REPLICAS: "1"
      MYELIN_OUTBOX_STREAM_DEDUP_SECONDS: "120"
      MYELIN_OUTBOX_PUBLISH_ACK_TIMEOUT_MS: "2000"
      MYELIN_OUTBOX_PUBLISHER_PASS_TIMEOUT_MS: "20000"
    script: cargo run -p myelin-outbox-publisher -- serve

  test:outbox-publisher:
    depends_on: [postgres, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
      DATABASE_MIGRATION_URL: "postgres://myelin_admin:myelin_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PUBLISHER_DATABASE_URL: "postgres://myelin_outbox_publisher_fr_par:myelin_outbox_publisher_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PROVISION_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_OUTBOX_PUBLISH_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
      MYELIN_OUTBOX_PUBLISHER_BATCH: "4"
      MYELIN_OUTBOX_PUBLISHER_POLL_MS: "100"
      MYELIN_OUTBOX_PUBLISHER_BACKOFF_MS: "500"
      MYELIN_OUTBOX_PUBLISHER_STATEMENT_TIMEOUT_MS: "1000"
      MYELIN_OUTBOX_PUBLISHER_MAX_ENVELOPE_BYTES: "262144"
      MYELIN_OUTBOX_STREAM_MAX_AGE_SECONDS: "7776000"
      MYELIN_OUTBOX_STREAM_MAX_BYTES: "67108864"
      MYELIN_OUTBOX_STREAM_MAX_MESSAGES: "100000"
      MYELIN_OUTBOX_STREAM_REPLICAS: "1"
      MYELIN_OUTBOX_STREAM_DEDUP_SECONDS: "120"
      MYELIN_OUTBOX_PUBLISH_ACK_TIMEOUT_MS: "2000"
      MYELIN_OUTBOX_PUBLISHER_PASS_TIMEOUT_MS: "20000"
    script: >-
      cargo test -p myelin-outbox-publisher --features integration
      --test integration_publisher_db -- --nocapture

  test:ci-dispatch-transport:
    depends_on: [postgres, rustfs-bucket, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
      DATABASE_MIGRATION_URL: "postgres://myelin_admin:myelin_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      S3_ENDPOINT: "http://localhost:{{S3_PORT}}"
      S3_REGION: fr-par
      S3_ACCESS_KEY: myelin_dev_access
      S3_SECRET_KEY: myelin_dev_secret
      S3_BUCKET: myelin-dev
      NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
    script: >-
      cargo test -p myelin-ci-dispatch --features integration
      --test integration_ci_dispatch_production_transport -- --nocapture

  test:integration:
    depends_on: [postgres, rustfs-bucket, valkey, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
      DATABASE_MIGRATION_URL: "postgres://myelin_admin:myelin_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_CI_SCHEDULER_DATABASE_URL: "postgres://myelin_ci_scheduler_fr_par:myelin_ci_scheduler_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PUBLISHER_DATABASE_URL: "postgres://myelin_outbox_publisher_fr_par:myelin_outbox_publisher_dev_pw@localhost:{{POSTGRES_PORT}}/myelin"
      MYELIN_OUTBOX_PROVISION_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_OUTBOX_PUBLISH_NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_OUTBOX_PUBLISHER_BATCH: "4"
      MYELIN_OUTBOX_PUBLISHER_POLL_MS: "100"
      MYELIN_OUTBOX_PUBLISHER_BACKOFF_MS: "500"
      MYELIN_OUTBOX_PUBLISHER_STATEMENT_TIMEOUT_MS: "1000"
      MYELIN_OUTBOX_PUBLISHER_MAX_ENVELOPE_BYTES: "262144"
      MYELIN_OUTBOX_STREAM_MAX_AGE_SECONDS: "7776000"
      MYELIN_OUTBOX_STREAM_MAX_BYTES: "67108864"
      MYELIN_OUTBOX_STREAM_MAX_MESSAGES: "100000"
      MYELIN_OUTBOX_STREAM_REPLICAS: "1"
      MYELIN_OUTBOX_STREAM_DEDUP_SECONDS: "120"
      MYELIN_OUTBOX_PUBLISH_ACK_TIMEOUT_MS: "2000"
      MYELIN_OUTBOX_PUBLISHER_PASS_TIMEOUT_MS: "20000"
      S3_ENDPOINT: "http://localhost:{{S3_PORT}}"
      S3_REGION: fr-par
      S3_ACCESS_KEY: myelin_dev_access
      S3_SECRET_KEY: myelin_dev_secret
      S3_BUCKET: myelin-dev
      REDIS_URL: "redis://localhost:{{VALKEY_PORT}}"
      NATS_URL: "nats://localhost:{{NATS_PORT}}"
      MYELIN_REGION: fr-par
    script: cargo test --workspace --features integration -- --nocapture

  test:make-it-real:
    depends_on: [postgres, rustfs-bucket, valkey, nats]
    environment:
      DATABASE_URL: "postgres://myelin_app:myelin_app_pw@localhost:{{POSTGRES_PORT}}/myelin"
